Connexions de servei, reglamentació i normativa
==============================================

La connexió de servei (o _acometida_ en castellà) és el tram de la xarxa 
de distribució que alimenta la caixa general de protecció (CGP) o unitat
equivalent. En aquest document es repassa la normativa vigent, el 
Reglament electrotècnic de baixa tensió (REBT), les normes UNE i les 
Normes tècniques particulars (NTP) de les companyies distribuïdores.





1. Tipus de connexions de servei
--------------------------------

Segons el traçat i les característiques de la xarxa, els embrancaments
es classifiquen en:

- Aeris sobre façana.
- Aeris tensats sobre pal.
- Subterranis (amb entrada/sortida o en derivació).
- Mixtos (aerosubterranis).

> ![c500](../img/connexio_servei_aeria.png)
> **Fig. 1.** [Martin _et al._] (2026). [IOC].
> _Exemple d’embrancament aeri sobre façana_.

### 1.1. Embrancament aeri sobre façana

Principals requeriments tècnics:

- Minimitzar l'impacte visual a les façanes (evitar en edificis
  d'interès històric o artístic).
- Fixar els cables distanciats de la paret amb accessoris adequats.
- Emprar conductors aïllats ($0\text{,}6/1\text{ kV}$) sota tubs o
  canals protectores amb tapa desmuntable mitjançant eina.
- En creuaments de vies públiques, reduir l'obertura al màxim i mantenir
  una alçada mínima de $6\text{ m}$. Permès l'ús de cable fiador segons
  la ITC-BT-06.
- Als trams inferiors a $2\text{,}5\text{ m}$ de terra, protegir els
  cables amb tubs o canals rígides i evitar l'acumulació d'aigua.

### 1.2. Embrancament aeri tensat sobre pals

Principals requeriments tècnics:

- Cables aïllats amb tensió assignada de $0\text{,}6/1\text{ kV}$.
- Poden anar suspesos d'un cable fiador independent o d'un conductor
  neutre fiador dimensionat mecànicament.
- Els suports han d'incorporar elements d'amarratge o suspensió.
- Gàlib mínim sobre carrers o carreteres: $6\text{ m}$.

### 1.3. Embrancament subterrani i aerosubterrani

- **Subterrani:** S'executa segons la NRZ002, respectant les distàncies
  de seguretat i creuaments amb altres serveis (aigua, gas, telecom).
  > ![c500](../img/connexio_servei_subterrania_01.png)

- **Aerosubterrani:** En la transició de subterrani a aeri, el cable es
  protegeix des de la profunditat reglamentària fins a $2\text{,}5\text{ m}$
  d'alçada amb un conducte rígid equivalment al de façana.

### 1.4. Condicions generals d'instal·lació

- Seguir el traçat més curt per terrenys de domini públic (evitar
  patis interiors, garatges o vials privats).
- Garantir l'aïllament contínuament fins a la CGP.
- Criteri general: un embrancament per finca, excepte subministraments
  especials o potències molt elevades.

### 1.5. Característiques dels conductors

Els conductors (Cu o Al) s'han de dimensionar segons la ITC-BT-06 i
ITC-BT-07 atenent als paràmetres següents:

\begin{gather}
I_{adm} \ge I_{calcul}
\end {gather}
A on:
- $I_{adm}$ és la intensitat màxima admissible del conductor en $\text{A}$
- $I_{calcul}$ és la intensitat de càrrega prevista segons la ITC-BT-10 en $\text{A}$

A més, cal verificar que la caiguda de tensió respecti el límit fixat
per la companyia subministradora:

\begin{gather}
\Delta V \le \Delta V_{màx}
\end {gather}
A on:
- $\Delta V$ és la caiguda de tensió calculada en $\text{V}$
- $\Delta V_{màx}$ és la caiguda de tensió màxima admesa en $\text{V}$
