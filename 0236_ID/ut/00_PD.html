PROGRAMACIÓ DIDÀCTICA
=====================










Identificació bàsica
--------------------

- **Mòdul Professional:** Instal·lacions de distribució
- **Codi:** 0236



Continguts segons Curriculum BOE
--------------------------------

### Configuració dels centres de transformació (CT):

- Estructura del sistema elèctric.
- Situació i funció dels centres de transformació en el sistema elèctric.
- Classificació dels CT (segons emplaçament, envoltant, propietat i alimentació).
- Parts fonamentals d'un CT.
- Transformador de distribució.
- Aparellatge.
- Esquemes unifilars.
- Cel·les. Tipus i senyalització.
- Aparells de comandament, maniobra i protecció.
- Quadre de distribució de baixa tensió.
- Instal·lació de terra.



### Configuració de xarxes de distribució de baixa tensió:

- Tipologia i estructura de les xarxes de baixa tensió.
- Representació simbòlica de xarxes en plànols i esquemes.
- Tipus i característiques dels suports.
- Tipus i característiques dels conductors. Cables tensats i cables posats.
- Elements accessoris de subjecció en pals i en façanes.
- Aïlladors.
- Tensors i subjeccables.
- Tipus i característiques de les instal·lacions de xarxes subterrànies (directament enterrades, entubades, en galeries, entre d'altres).
- Tipus i característiques dels conductors de xarxes subterrànies.
- Elements accessoris de connexió i empalmament i de protecció i senyalització.
- Condicions generals i especials d'instal·lació de xarxes de baixa tensió.
- Connexió a terra.
- Sistemes de connexió del neutre i de les masses en xarxes de distribució. Esquemes i criteris d'elecció.
- Enllumenat exterior.

### Configuració de les instal·lacions elèctriques d'enllaç:

- Previsió de càrregues per a subministraments en baixa tensió.
- Comes. Tipus i instal·lació.
- Instal·lacions d'enllaç. Esquemes.
- Caixa general de protecció. Tipus i esquemes.
- Línia general d'alimentació.
- Derivacions individuals.
- Comptadors. Funcionament. Tipus. Esquemes.
- Tarifació elèctrica.
- Instal·lacions de posta a terra en edificis.



### Operacions de manteniment de centres de transformació:

- Instruccions de realització de maniobres.
- Eina i instrumentació específiques.
- Maniobres bàsiques segons el tipus de cel·les.
- Plans de manteniment en centres de transformació.
- Avaries tipus en centres de transformació. Localització i reparació.
- Mesures característiques i paràmetres de control d'un centre de transformació.
- Condicions de posada en servei d'un centre de transformació.
- Riscos elèctrics. Normativa de seguretat aplicable.



### Operacions de muntatge i manteniment de xarxes aèries de baixa tensió:

- Documentació administrativa associada (certificat d'instal·lació, sol·licitud de descàrrec, permís d'obra, entre d'altres).
- Eina i instrumentació específiques.
- Fases de muntatge d'una instal·lació de xarxa aèria de baixa tensió.
- Procediments d'hisat, aplomada, fonamentació i formigonat de suports.
- Procediments d'estesa i tensat de conductors.
- Tècniques de subjecció, connexionat i empalmament de conductors.
- Plans de manteniment en xarxes aèries.
- Avaries tipus en xarxes aèries. Localització i reparació.
- Mesures característiques i paràmetres de control d'una xarxa aèria.
- Condicions de posada en servei d'una xarxa de baixa tensió.
- Riscos elèctrics. Normativa de seguretat aplicable.



### Operacions de muntatge i manteniment de xarxes subterrànies de baixa tensió:

- Documentació administrativa associada (certificat d'instal·lació, sol·licitud de descàrrec, permís d'obra, entre d'altres).
- Eina i instrumentació específiques.
- Fases de muntatge d'una instal·lació de xarxa subterrània de baixa tensió.
- Procediments d'excavació, col·locació de tubs i condicionament de rases.
- Procediments d'estesa de cable (per gravetat i per lliscament i rotació) i de col·locació en safates.
- Tècniques de connexionat i empalmament de conductors.
- Marcatge de conductors.
- Plans de manteniment en xarxes subterrànies.
- Avaries tipus en xarxes subterrànies. Localització i reparació.
- Mesures característiques i paràmetres de control d'una xarxa subterrània.
- Riscos elèctrics. Normativa de seguretat aplicable.



### Operacions de muntatge i manteniment d'instal·lacions elèctriques d'enllaç:

- Documentació administrativa associada.
- Fases de muntatge d'una instal·lació elèctrica d'enllaç.
- Caixa general de protecció. Tipus de muntatge.
- Línia general d'alimentació. Condicions d'instal·lació. Tapes de registre.
- Derivacions individuals. Condicions d'instal·lació. Canalitzacions i conductes. Caixes de registre.
- Comptadors. Connexionat.
- Dispositius generals de comandament i protecció.
- Avaries tipus en instal·lacions d'enllaç. Localització i reparació.
- Mesures característiques i paràmetres de control d'una instal·lació d'enllaç.



### Prevenció de riscos laborals i protecció ambiental:

- Identificació de riscos.
- Determinació de les mesures de prevenció de riscos laborals.
- Prevenció de riscos laborals en els processos de muntatge i manteniment.
- Equips de protecció individual.
- Compliment de la normativa de prevenció de riscos laborals.
- Compliment de la normativa de protecció ambiental.






Resultats d'aprenentatge
------------------------

En finalitzar la UT01, l'alumne/a serà capaç de:

### 1. Configuració dels centres de transformació (CT)

- Descriure l'estructura del sistema elèctric i situar el CT en la 
  xarxa de generació, transport i distribució.
- Classificar els CT segons emplaçament, envoltant, propietat i 
  alimentació.
- Identificar les parts fonamentals d'un CT i la funció de cada element.
- Descriure les característiques, funció i senyalització dels tipus de 
  cel·les.
- Interpretar esquemes unifilars de diferents CT i disposicions de 
  cel·les.
- Identificar aparells de maniobra i elements de protecció de les 
  cel·les.
- Descriure els transformadors de mesura i protecció, relacionant-ne 
  les característiques amb la funció, i interpretar-ne els esquemes de 
  connexió.
- Descriure les característiques, funció i comandament dels aparells de 
  maniobra i protecció.
- Identificar les característiques i connexions dels quadres de 
  distribució de baixa tensió.
- Descriure la instal·lació de posta a terra d'un CT.

### 2. Manteniment dels centres de transformació

- Descriure les fases i procediments de connexió del transformador i de 
  les cel·les.
- Reconèixer les instruccions generals per a la realització de 
  maniobres en un CT.
- Detallar l'ordre i els elements adequats per a les maniobres en 
  cel·les.
- Descriure les operacions de seguretat prèvies a la intervenció (tall 
  de fonts, enclavaments, detecció d'absència de tensió, etc.).
- Descriure els procediments per a la presa de mesures de paràmetres 
  característics.
- Descriure el procediment en un supòsit de manteniment correctiu.

### 3. Prevenció de riscos laborals i protecció ambiental

- Identificar els riscos laborals associats al manteniment de CT i al 
  muntatge i manteniment de línies aèries, subterrànies i 
  instal·lacions d'enllaç (manipulació de materials, maniobres, 
  treballs en altura, en rases, etc.).
- Determinar les mesures de seguretat i els equips de protecció 
  personal adequats per a cada cas.
- Identificar les possibles fonts de contaminació ambiental.
- Valorar l'ordre i la netedat de les instal·lacions com a primer 
  factor de prevenció de riscos.
- Aplicar la normativa de prevenció de riscos laborals i de protecció 
  ambiental en els processos de muntatge i manteniment.
