Operacions de Muntatge i Manteniment de XABT
============================================

Les operacions inclouen el muntatge de materials i les revisions o
reparacions per assegurar el funcionament correcte de la xarxa.

Factors d'execució:
- Especificacions i pla de treball.
- Criteris de qualitat i condicions de seguretat.
- Normativa i procediments tècnics exigits.





1. Documentació Administrativa i Tramitació
-------------------------------------------

Segons el REBT (ITC-BT-04, ap. 3), les xarxes aèries de distribució en
BT (grup "J", sense límit de potència) necessiten projecte.

### 1.1. Documents del Projecte
- **Memòria:** Justificació, conductors, potència, caiguda de tensió,
  pèrdues, encreuaments, paral·lelismes, càlculs elèctrics i
  mecànics.
- **Plànols:** Representació simbòlica de la instal·lació.
- **Pressupost:** Mesuraments, preus unitaris, pressupost general i per
  parts d'obra.
- **Plec de condicions:** Regulació tècnica, econòmica i legal.
- **Estudi de seguretat i salut:** Prevenció de riscos laborals.
- **Annexos:** Documents de suport.

### 1.2. Documentació per a la Tramitació i Posada en Servei
- Certificat d'instal·lació i annex d'informació a l'usuari.
- Certificats d'inspecció inicial i de direcció d'obra.
- Permís d'obra municipal.
- Sol·licitud de descàrrec a la companyia elèctrica.
- Posada en servei segons l'article 18 del REBT.

3. Muntatge de Xarxes Aèries
----------------------------

### 3.1. Xarxa Posada sobre Façana

El muntatge i la connexió de conductors sobre façana s'ha de
realitzar d'acord amb els criteris normatius següents:

- **Criteris de traçat i integració arquitectònica:**
    + El traçat de la xarxa trenada s'ha de triar adaptant-se a
      l'arquitectura de l'edifici.
    + S'han d'aprofitar els sortints de la façana per camuflar la
      xarxa.
    + En encreuaments de carrers o espais buits es pot executar una
      canalització subterrània alternativa.
    + El traçat ha de ser principalment horitzontal, evitant fletxes i
      ressalts destacats.
    + Els canvis de direcció s'han de realitzar en sentit vertical, en
      els límits de l'immoble o aprofitant sortints intermedis.
    + El pas per cantonades, canonades o obstacles es fa conformant el
      feix manualment gràcies a la seva ductilitat i fixant-lo als
      suports.

- **Manipulació, desenvolupament i protecció de les bobines:**
    + La preparació, desenvolupament, estesa i col·locació del feix
      sobre les ferramentes s'ha d'executar amb cura per evitar danys a
      l'aïllament.
    + Les bobines s'han de desenvolupar en terrenys llisos i sense
      asprors, preferentment d'un sol cop per a tota la longitud.
    + Durant el desenvolupament cal verificar la integritat del feix i
      eliminar qualsevol tram deteriorat.
    + Cal evitar efectes de torsió, aixafament, trencament de filferros,
      rascades contra el terra o eines, i estripades de l'aïllament.
    + Les bobines s'han d'emmagatzemar protegir-les de la humitat i en
      llocs lliures de pols o materials abrasius (sorra, ciment, carbó).
    + S'han de col·locar caputxons als extrems dels cables per evitar
      l'entrada d'humitat.

- **Condicions d'estesa i fixació als suports:**
    + Es prohibeix utilitzar com a punt de suport elements de
      propietat privada (balcons, reixes, finestres).
    + En les zones sotmeses a esforç de tracció cal protegir els cables
      amb materials d'esmorteïment (arpillera, cuir, goma).
    + Cal aplicar la tracció necessària a l'extrem del feix per
      mantenir-lo recte abans de posar-lo sobre els suports.
    + La fixació a la paret es realitza mitjançant suports i
      abraçadores, mantenint una distància de $2\text{ cm}$ respecte a la
      façana per evitar dipòsits de pols i facilitar el manteniment.
    + En els punts de connexió, la distància a la façana es redueix a
      $1\text{ cm}$.

### 3.3. Xarxa de Cable Trenat en Suports

> ![c500](../img/XABT_tensat_suport.png)
> **Fig. 13**
> e-distribución (2020)
> _XABT tensada a suport segons NRZ002_.
> Imatge amb copyright<sup>©</sup> utilitzada en aplicació de l'article
> 32 de la [LPI] ([veure pdf original][NRZ002])

Les operacions d'estesa i connexió de conductors trenats sobre
suports requereixen complir els següents requisits tècnics:

- **Integració en l'entorn:**
    + El traçat ha de discórrer per la meitat dels vessants de les
      muntanyes i a prop de camins.
    + S'ha d'evitar el contrast directe amb el cel per reduir
      l'impacte visual i mediambiental.

- **Manipulació i conservació dels conductors:**
    + La preparació, desenvolupament, estesa i col·locació del feix
      sobre les ferramentes s'han de fer amb la màxima cura.
    + Les bobines s'han de desenvolupar en terrenys llisos i sense
      asprors, realitzant el procés d'un sol cop per a tota la
      longitud quan sigui possible.
    + Durant el desenvolupament cal comprovar que el feix està intacte
      i retirar els trams que presentin danys.
    + Cal prevenir rascades contra el terra o ferramentes, així com
      torsions, aixafaments, trencaments de filferros o estripades de
      l'aïllament.
    + L'emmagatzematge de les bobines s'ha de fer a l'aixopluc de la
      humitat i en zones lliures de pols o partícules abrasives (sorra,
      ciment, carbó).
    + Les puntes dels cables s'han de protegir amb caputxons per
      evitar la penetració d'humitat.

- **Procediment d'estesa, hissat i tibament:**
    + Per estendre i hissar els conductors cal utilitzar politges de
      fusta o aliatge d'alumini.
    + Les politges han de tenir una amplada i una profunditat de coll
      mínimes d'una vegada i mitja el diàmetre més gran del feix:
      > \begin{gather}
        a \ge 1{,}5 \cdot d_{\max}
        \end{gather}
        \begin{gather}
        p \ge 1{,}5 \cdot d_{\max}
        \end{gather}
      > A on:
      > - $a$ és l'amplada del coll de la politja en $\text{mm}$.
      > - $p$ és la profunditat del coll de la politja en $\text{mm}$.
      > - $d_{\max}$ és el diàmetre més gran del feix conductor en
      >   $\text{mm}$.

    + Cal aplicar la tracció necessària des de l'extrem del feix fins
      a aconseguir el tensat adequat.
    + És imprescindible ajustar les fletxes de muntatge segons les
      taules normalitzades per prevenir avaries i optimitzar l'ús
      dels suports.
    + Un cop tensat el conjunt, s'ha de col·locar el neutre portant
      sobre els suports corresponents.
    + La cimentació i l'encastament dels suports depenen directament
      de les característiques del suport i del terreny.





4. Muntatge de Suports
----------------------

### 4.1. Suports de Fusta

El procediment d'instal·lació i fixació dels suports de fusta
s'executa mitjançant les fases següents:

- **Excavació del terreny:**
    + El primer pas consisteix a realitzar l'obertura del forat al
      terreny.
    + La profunditat de l'excavació es calcula segons l'equació:
      > \begin{gather}
        h = \frac{H}{10} + 0{,}5
        \end{gather}
      > A on:
      > - $h$ és la profunditat de l'excavació en $\text{m}$.
      > - $H$ és l'alçada total del pal en $\text{m}$.

- **Opcions d'hissada del suport:**
    + **Hissada manual:** A causa de les seves dimensions i pes
      reduïts, es pot dur a terme amb dues persones i una doble perxa,
      aprofitant la forma rectangular de l'excavació i la preparació de
      graons al terreny.
      > ![c500](../img/XABT_hisat_pertigues.png)
      > **Fig. 14.** [Martin _et al._] (2026). [IOC].
      > _Hisat amb doble pèrtiga_.
      > Imatge sota llicència [CC3.0-by-nc-sa]
    
    + **Hissada amb ploma fixa:** S'utilitza aquesta grua especial en
      el cas de pals de gran pes i grandària.
      > ![c500](../img/XABT_hisat_ploma_fixa.png)
      > **Fig. 15.** [Martin _et al._] (2026). [IOC].
      > _Hisat amb ploma fixa_.
      > Imatge sota llicència [CC3.0-by-nc-sa]
      
    + **Hissada amb camió grua:** Opció mecànica alternativa per a la
      col·locació del suport.
      > ![c500](../img/XABT_hisat_camio_grua.png)
      > **Fig. 16.** [Martin _et al._] (2026). [IOC].
      > _Hisat amb camió grua_.
      > Imatge sota llicència [CC3.0-by-nc-sa]
      

- **Comprovació, fixació i posada a terra:**
    + Un cop hissat el pal, s'ha de verificar la seva
      perpendicularitat.
    + El reompliment de l'excavació es realitza col·locant una capa de
      pedres al fons, omplint posteriorment amb terra piconada per
      capes i finalitzant amb una darrera capa de pedres fins a nivell
      de superfície.
    + Si el suport requereix la connexió del neutre a terra, cal
      executar la instal·lació del sistema (pica i cable) abans de
      procedir a la hissada del pal.

6. Conversió d'Línia Aèria a Subterrània
----------------------------------------

- **Cables:** RZ1 (XLPE/poliolefina) o RV (XLPE).
- **Protecció:** Tub segons ITC-BT-11 fins a $2{,}5\text{ m}$
  d'alçada reforçat amb acer galvanitzat.
- **Segellat:** Caputxó superior per evitar l'entrada d'aigua.
- **Empalme:** Unió entre RZ1/RV i RZ mitjançant maniguets de
  punxonat profund (compressió hexagonal per al neutre) i coberta
  termoretràctil.

---------------------------------------

ruptura del conductor.

8. Posada a Terra i Continuïtat del Neutre
------------------------------------------

### Característiques de la Instal·lació de Terra del neutre
- **Pica:** Coure o acer cobrat 
  ($\varnothing 18\text{ mm}$, $2\text{ m}$ de longitud), 
  col·locada a una profunditat de $0{,}5\text{--}0{,}8\text{ m}$.
- **Cable:** Coure aïllat ($0{,}6/1\text{ kV}$), secció de 
  $50\text{ mm}^2$ (UNE 21022), protegit per tub fins a 
  $2{,}5\text{ m}$.

### Ubiació de la Posada a Terra del neutre
- **Sobre façana:** A la CGP/CGPM o cada $500\text{ m}$ de línia.
- **En suports:** Connexió del born inferior a la pica i del superior al
  neutre.
- **Continuïtat del neutre (ITC-BT-06, ap. 3.6 i 3.7):** Prohibida la 
  seva interrupció excepte amb tall omnipolar simultani o unions
  amovibles senyalitzades. Terra obligatòria cada $500\text{ m}$.





9. Manteniment i Avaries
------------------------

### 9.1. Tipus de Revisions
- **Inspecció puntual:** Visual i en servei.
- **Reconeixement reglamentari:** Triennal, amb emissió de butlletí
  oficial.
- **Mesurament de resistència de terra:** Triennal (màxim 
  $400\ \Omega$ en mesura en bucle).

### 9.2. Documentació
- **Guia de revisió:** Llista de defectes codificats per components.
- **Full de revisió:** Format amb capçalera, llista de defectes i
  peu de signatura.

### 9.3. Resum de Defectes i Avaries Habituals
Vegeu les especificacions completes i distàncies de seguretat a la
taula corresponent de la **ITC-BT-06**.

- **Aïllament i conductors:** Aïlladors trencats, venes de conductors
  tallades, escalfament excessiu o secció insuficient.
- **Distàncies reglamentàries:** Incompliment de distàncies a façanes,
  balcons ($\lt 3\text{ m}$), finestres ($\lt 1\text{ m}$), sòl o antenes.
- **Encreuaments:** Separació insuficient amb línies d'AT,
  telecomunicacions ($\lt 1\text{ m}$), carreteres/ferrocarrils
  ($\lt 6\text{ m}$) o zones navegables.
- **Estructura i suports:** Corrosió en gelosia, esquerdes en formigó o
  fusta podrida.
- **Vegetació:** Proximitat excessiva d'arbres ($\lt 1\text{ m}$). El
  manteniment de la vegetació és responsabilitat del titular.

### 9.4. Localització d'Avaries
Mètodes: inspecció visual, mesurador d'aïllament (Megger), càmera
termogràfica, localitzador de cables, analitzador de xarxa o 
reflectòmetre.

Etapes de resolució:
1. Identificació del tipus d'avaria.
2. Prelocalització aproximada.
3. Localització exacta.





10. Paràmetres i Càlcul de Control de la Xarxa
----------------------------------------------

- **Tensió nominal ($U$):** $230\text{ V}$ (monofàsic/trifàsic 3 fils) o
  $400\text{ V}$ (trifàsic 4 fils).
- **Freqüència ($f$):** $50\text{ Hz}$.

### 10.1. Resistència Electrica

\begin{gather}
R_T = R_{20} \cdot [1 + \alpha \cdot (T - 20)]
\end{gather}
A on:
- $R_T$ és la resistència a la temperatura de servei en $\Omega/\text{km}$.
- $T$ és la temperatura de servei en $^\circ\text{C}$.
- $\alpha$ és el coeficient de temperatura ($0{,}00403$ per a Al,
  $0{,}00360$ per a Almelec).


La **Reactància ($X$):** $X \approx 0{,}1\ \Omega/\text{km}$ per a 
cables trenats.



### 10.2. Intensitat Màxima Admissible ($I_{\max}$)

Monofàsica:
\begin{gather}
I_{\max} = \frac{P}{U \cdot \cos\varphi}
\end{gather}

Trifàsica:
\begin{gather}
I_{\max} = \frac{P}{\sqrt{3} \cdot U \cdot \cos\varphi}
\end{gather}
A on:
- $P$ és la potència en $\text{W}$.
- $U$ és la tensió nominal en $\text{V}$.
- $\cos\varphi$ és el factor de potència ($0{,}8\text{--}0{,}9$).



### 10.3. Intensitat de Curtcircuit ($I_{cc}$)

\begin{gather}
I_{cc} = \frac{K \cdot S}{\sqrt{t}}
\end{gather}
A on:
- $S$ és la secció del conductor en $\text{mm}^2$.
- $t$ és la durada del curtcircuit en $\text{s}$.
- $K$ és la constant del material.

### 10.4. Caiguda de Tensió ($\Delta e$)
Caiguda en voltatge (trifàsica):

\begin{gather}
\Delta e = \sqrt{3} \cdot I \cdot L \cdot (R \cdot \cos\varphi + X \cdot \sin\varphi)
\end{gather}

Caiguda relativa ($\%$) respecte al moment elèctric:

\begin{gather}
\% \Delta e = \frac{P \cdot L}{M_1}
\end{gather}

Moment elèctric unitari per a un $1\%$ de caiguda:

\begin{gather}
M_1 = \frac{U^2}{100 \cdot (R + X \cdot \tan\varphi)}
\end{gather}
A on:
- $R$ és la resistència a $50^\circ\text{C}$ en $\Omega/\text{km}$.
- $X$ és la reactància en $\Omega/\text{km}$.
- $P$ és la potència en $\text{kW}$.
- $L$ és la longitud en $\text{km}$.

### 10.5. Pèrdues de Potència ($P_{\text{pèrdues}}$)

\begin{gather}
P_{\text{pèrdues}} = \frac{3 \cdot R \cdot L \cdot P^2}{U^2 \cdot \cos^2\varphi}
\end{gather}
A on:
- $P$ és la potència transportada en $\text{kW}$.
- $R$ és la resistència en $\Omega/\text{km}$.
- $U$ és la tensió en $\text{V}$.
- $L$ és la longitud en $\text{km}$.

### 10.6. Càlcul de Secció ($S$)

Monofàsica:
\begin{gather}
S = \frac{2 \cdot P \cdot L}{\sigma \cdot e \cdot U}
\end{gather}

Trifàsica:
\begin{gather}
S = \frac{P \cdot L}{\sigma \cdot e \cdot U}
\end{gather}
A on:
- $S$ és la secció en $\text{mm}^2$.
- $P$ és la potència en $\text{W}$.
- $L$ és la longitud en $\text{m}$.
- $e$ és la caiguda de tensió admèsa en $\text{V}$.
- $\sigma$ és la conductivitat del material.





11. Seguretat i Prevenció de Riscos Laborals
--------------------------------------------

### 11.1. Marc Normatiu

Llei 31/1995, RD 39/1997, RD 614/2001 (risc elèctric), RD 485/1997
(senyalització), RD 486/1997 (llocs de treball), RD 487/1997 (càrregues),
RD 773/1997 (EPI) i RD 1215/1997 (equips de treball).



### 11.2. Les 5 Regles d'Or (Treball Sense Tensió)

1. Desconnectar totes les fonts de tensió.
2. Prevenir qualsevol possible realimentació (enclavament).
3. Verificar l'absència de tensió.
4. Posar a terra i en curtcircuit.
5. Protegir enfront d'elements pròxims en tensió i senyalitzar la zona.



### 11.3. Reposició de la Tensió

Procés seqüencial un cop finalitzats els treballs:
- Retirada de proteccions auxiliars i senyalització de zona.
- Desconnexió dels equips de posada a terra.
- Desbloqueig dels dispositius de tall.
- Tancament de circuits.



### 11.4. Equips de Protecció
- Accessoris i eines aïllants o aïllades.
- Perxes i elements aïllants de maniobra (banquetes, catifes).
- Equip de Protecció Individual (EPI): cascs, guants aïllants i ulleres
  de protecció.
