TERMINOLOGIA
============










**Observacions terminològiques:**

Comentaris de la IA (pendent de revisar pel docent):

1.  **"Acometidas"** → He traduït com **"Comes"**. És el terme més habitual en català en el context de subministraments elèctrics, tot i que de vegades també es pot veure "escomeses". He optat per "comes" perquè és la forma recollida en molta normativa i manuals tècnics catalans.
2.  **"Celdas"** → He traduït com **"Cel·les"**. És la traducció directa i àmpliament utilitzada en el sector.
3.  **"Aparamenta"** → He traduït com **"Aparellatge"**. És el terme genèric per al conjunt d'aparells elèctrics, encara que de vegades es fa servir "aparells" o "equips". "Aparellatge" és força normalitzat.
4.  **"Apoyos"** → He traduït com **"Suports"**. És el terme més habitual per a les estructures que sustenten les línies aèries (postes, torres...).
5.  **"Cables posados"** → He traduït com **"Cables posats"**. Fa referència a conductors instal·lats superficialment o sobre superfície, en contraposició als tensats. He mantingut "posats" com a traducció literal i entesa en el context.
6.  **"Sujetacables"** → He traduït com **"Subjeccables"**. És un terme compost que es pot traduir com a "subjeccables" o "fixacables". He optat per "subjeccables" per ser una formació paral·lela al castellà però en català.
7.  **"Empalme"** → He traduït com **"Empalmament"**. És la forma substantivada més correcta en català (tot i que de vegades es fa servir "empelta" en altres contexts, en electricitat s'usa més "empalmament").
8.  **"Canaladuras"** → He traduït com **"Canalitzacions"**. En el context de derivacions individuals, es refereix als conductes o canaletes; "canalitzacions" és el terme genèric i adequat.
9.  **"Tensado"** → He traduït com **"Tensat"** (referent a conductors). És la forma verbal substantivada correcta.
10. **"Izado"** → He traduït com **"Hisat"**. És el terme català per a l'acció d'elevar càrregues (en aquest cas, suports).
11. **"Aplomado"** → He traduït com **"Aplomada"**. Fa referència a posar vertical (a plom) una estructura.
12. **"Cimentación"** → He traduït com **"Fonamentació"**, que és el terme més emprat en construcció per a la base dels suports.
13. **"Bandejas"** (subterrànies) → He traduït com **"Safates"**, que és el terme normalitzat per a les safates portacables.
14. **"Tapas de registro"** → He traduït com **"Tapes de registre"**, mantenint la terminologia d'arquitectura i instal·lacions.
15. **"Descargo"** → He traduït com **"Descàrrec"**, referit a la sol·licitud per a treballar en una instal·lació sense tensió.
