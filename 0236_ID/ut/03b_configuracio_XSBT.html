Configuració de les xarxes aèries de BT
=======================================

Les xarxes aèries de BT (tensions nominals de 230 V i 400 V en CA)
subministren energia elèctrica des dels centres de transformació (CT)
fins als escomesos dels punts de consum. El seu disseny és habitualment
radial i ramificat, tot i que puntualment pot ser en anell.





1. Tipus de conductors
----------------------

### 1.1 Nus

Muntats amb distàncies de seguretat entre cables. Actualment en desús,
reservats només per al manteniment d'instal·lacions antigues.

> ![c500](../img/XABT_nu.png)
> **Fig. 1.** [Martin _et al._] (2026). [IOC]. 
> _Línia aèrea nua_.
> Imatge sota llicència [CC3.0-by-nc-sa]


### 1.2. Aïllats (trenats):

Conductors cablejats en feix d'hèlix espiral. Optimitzen l'espai i
faciliten la manipulació.

> ![c500](../img/XABT_trenat.png)
> **Fig. 2.** [Martin _et al._] (2026). [IOC]. 
> _Línia de distribució aèria trenada sobre suports de fusta_.
> Imatge sota llicència [CC3.0-by-nc-sa]

Tota instal·lació ha de complir el Reglament Electrotècnic de Baixa
Tensió (REBT, especialment la ITC-BT-06), les normes UNE i les
especificacions particulars de les companyies distribuïdores.





2. Tipologia i estructura
-------------------------

Segons la ubicació i el traçat, les xarxes trenades es classifiquen en
dues tipologies principals:

### 2.1. Xarxes trenades posades

S'utilitzen principalment en entorns urbans, fixant el feix directament
sobre façanes i murs. S'adapten al traçat arquitectònic (sota cornises o
voladissos) per minimitzar l'impacte estètic. 

> ![c500](../img/XABT_posada.png)
> **Fig. 3.** [Martin _et al._] (2026). [IOC]. 
> _Xarxa trenada posada_.
> Imatge sota llicència [CC3.0-by-nc-sa]

- **Cost i execució:** Requireixen més longitud de cable i mà d'obra que
  les xarxes tibades, augmentant-ne el cost.

- **Transicions:** En creuaments de carrers o espais buits entre
  edificis, la línia passa a suspendre's mitjançant un cable fiador o a
  estar tibada directament, aplicant-se la normativa de xarxes tibades.
  
### 2.2. Xarxes trenades tibades

Pròpies de zones rurals o edificacions aïllades. Els cables es munten
suspendre entre suports (formigó, fusta o metall) o en trams buits entre
edificis mitjançant elements d'amarratge.

> ![c500](../img/XABT_tibada_suports.png)
> **Fig. 4.** [Martin _et al._] (2026). [IOC]. 
> _Xarxa trenada tibant en suport de formigó_.
> Imatge sota llicència [CC3.0-by-nc-sa]

> ![c500](../img/XABT_tibada_façanes.png)
> **Fig. 5.** [Martin _et al._] (2026). [IOC]. 
> _Xarxa trenada tibant entre edificis_.
> Imatge sota llicència [CC3.0-by-nc-sa]


### 2.3. Sistemes de fixació

#### Mitjançant conductor neutre portador
Elaborat d'Almelec (aliatge d'alumini, magnesi i silici) per aportar
resistència mecànica. Pot treballar a tracció (suportant l'esforç de
tensat) o a suspensió (suportant el pes del feix).

#### Mitjançant cable fiador d'acer
Es tensa un cable d'acer de 22 mm² entre ancoratges i se hi dóna suport
al feix trenat mitjançant collarets o tubs flexibles.

> ![c500](../img/XABT_fiador.png)
> **Fig. 6.** [Martin _et al._] (2026). [IOC]. 
> _Cable trenat suspès amb un cable fiador d’acer_.
> Imatge sota llicència [CC3.0-by-nc-sa]





3. Representació simbòlica en plànols
-------------------------------------

### 3.1. Plànols de situació i emplaçament

Ubiquen la línia respecte a l'entorn a escala molt reduïda.
 
> ![c500](../img/planol_situacio.png)
> **Fig. 7.** [Martin _et al._] (2026). [IOC]. 
> _Plànol de situació i emplaçament_.
> Imatge sota llicència [CC3.0-by-nc-sa]

### 3.2. Plànols de planta
Representació en vista superior (escales 1:500 a 1:2.000) amb la línia, 
serveis afectats, orografia i la llegenda de símbols.

> ![c500](../img/planol_planta.png)
> **Fig. 8.** [Martin _et al._] (2026). [IOC]. 
> _Plànol de planta_.
> Imatge sota llicència [CC3.0-by-nc-sa]


### 3.3. Altres plànols

- **Plànols de perfil:** Utilitzats en zones rurals per mostrar la 
  topografia, la numeració i tipus de suports, distàncies d'obertura, 
  àngles de traçat i distància de fletxa.
- **Plànols de detall constructiu:** Defineixen l'aparellatge i l'armat 
  dels suports.





4. Suports: Tipus i característiques
------------------------------------

Els suports sostenen els conductors i la ferramenta (conjunt 
d'accessoris mecànics i de protecció) resistint les exigències 
mecàniques i ambientals.

- **Obertura:** Distància entre dos suports consecutius.
- **Fletxa:** Distància vertical màxima entre el conductor i la línia 
  imaginària que uneix els seus punts de fixació.
  
> ![c500](../img/fletxa.png)
> **Fig. 9.** [Martin _et al._] (2026). [IOC]. 
> _Conceptes d’obertura i fletxa_.
> Imatge sota llicència [CC3.0-by-nc-sa]

### 4.1. Esforços mecànics

> ![c500](../img/esforços_suports.png)
> **Fig. 10.** [Martin _et al._] (2026). [IOC]. 
> _Esforços en suports: a) verticals; b) longitudinals i c) 
> transversals_.
> Imatge sota llicència [CC3.0-by-nc-sa]

- **Verticals:** Compressió pel pes propi, conductors, ferramenta i
  sobrecàrrega de gel.
- **Longitudinals:** Tracció provocada pel tensat dels conductors.
- **Transversals:** Flexió derivada de l'acció del vent i canvis de
  direcció de la línia.
  
#### Classificació funcional segons esforços

- *Alineació:* Esforços verticals i transversals de vent.
- *Àngle:* Esforços verticals i transversals per canvi de direcció.
- *Ancoratge / Fi de línia:* Esforços verticals, transversals i 
  longitudinals continus.
- *Estrellament:* Resolució de forces d'intersecció de diferents línies.



### 4.2. Materials dels suports

#### Formigó armat

No requereixen manteniment, tot i que tenen un pes elevat.

- **Buit (centrifugat):** Secció prismàtica o cilíndrica buida.
- **Vibrat compacte:** Troncopiramidals, aptes per a compressió i
  flexió. Incorporen alvèols per reduir pes, borns de posada a terra,
  identificació pintada al cap segons l'esforç nominal i plaques de
  característiques/risc elèctric a 4 m d'alçada.
- *Paràmetres:* Esforç nominal (F, a 0,25 m del cap), esforç secundari
  (FS), esforç de trencament i moment de ruptura per torsió.


#### Metàl·lics

Destaquen per la seva alta resistència a la tracció, ideals per a grans 
obertures en zones rurals.

- **Gelosia:** Perfils d'acer galvanitzat (soldats, cargolats o reblats)
  dividits en *cap* (tram superior) i *fust* (tram inferior
  troncopiramidal encastat).
- **Xapa plegada / Tubular:** Fabricats en planxa d'acer galvanitzat.
  S'instal·len encastats directament en formigó o mitjançant base
  metàl·lica amb perns.
  
  
#### Fusta

Econòmics i fàcils de transportar, utilitzats principalment en entorns 
rurals. Tenen una vida útil limitada (~10 anys) i requereixen tractament 
amb creosota. S'identifiquen mitjançant marques impreses al fust.

### 4.3. Codificació i designació

- **Formigó:** `HV` (Formigó Vibrat) + `Esforç (daN)` + `N (Normal) / R
  (Reforçat)` + `Longitud (m)`. *(Ex: HV 630 R 11)*

- **Metàl·lics:** `C` (Gelosia) / `CH` (Xapa) + `Esforç (daN)` -
  `Longitud (m)` + `E (Encastat) / P (Pletina)` - `Qualitat Acer (B/D)`.
  *(Ex: C 9000-20, CH 400-13E-D)*

- **Fusta:** `PM` + `Longitud (m)` + `Tipus/Classe`. *(Ex: PM 12 III)*





5. Característiques dels conductors
-----------------------------------

Els conductors aïllats en feix utilitzen normalment alumini (Al) per a
les fases i aliatge d'Almelec (Alm) per al neutre portador. L'aïllament
sol ser de polietilè reticulat (XLPE) o PVC, amb resistència a la
intempèrie i tensió assignada 0,6/1 kV (norma UNE 21030).

- **Dimensions mínimes segons REBT:** 16 mm² per a alumini i 10 mm² per 
a coure.
- **Dimensions mínimes segons NRZ002:** Veure NRZ002

> ![c500](../img/cables_trenats.png)
> **Fig. 11.** [Martin _et al._] (2026). [IOC]. 
> _Cables en feix trenat_.
> Imatge sota llicència [CC3.0-by-nc-sa]


### 5.1. Designació normalitzada (UNE 21123 / UNE 21030)

Estructura: `RZ` (aïllament XLPE, feix trenat) + `Tensions (0,6/1 kV)` +
`Nº conductors` x `Secció Fase` + `Material` + `/Secció i Material 
Neutre o Fiador`.

- `RZ 0,6/1 KV 4x25 Al`: 4 conductors d'alumini de 25 mm².
- `RZ 0,6/1 KV 3x50 Al 54,6 Alm`: 3 fases d'alumini de 50 mm² i neutre 
  portador d'Almelec de 54,6 mm².
- `RZ 0,6/1 KV 3x95/50 Al/22 Ac`: 3 fases de 95 mm², neutre de 50 mm² 
  d'alumini i fiador d'acer de 22 mm².

### 5.2. Criteris de selecció de secció

- **Capacitat tèrmica / Intensitat admissible:** Definida per taules
  normatives segons el tipus d'instal·lació, considerant factors de
  correcció per temperatura ambient (base 40 °C) i agrupament.

- **Corrent de curtcircuit:** Resistència tèrmica del conductor durant
  el temps de resposta de les proteccions.

- **Caiguda de tensió i pèrdues:** Limitacions tècniques per mantenir el
  subministrament dins dels paràmetres de qualitat.





6. Elements accessoris i de suport
----------------------------------

Tots els accessoris han de disposar de protecció contra la corrosió i 
resistir les exigències mecàniques de la línia.



### 6.1. Subjecció sobre façana

Utilitza suports, abraçadores tipus mènsula i tacs de materials 
sintètics o acer plastificat. Incorporen tancaments de seguretat per 
evitar la sortida accidental del feix.

> ![c](../img/suports_façanes.png)
> **Fig. 12.** [Martin _et al._] (2026). [IOC]. 
> _Suports de subjecció sobre façanes_.
> Imatge sota llicència [CC3.0-by-nc-sa]



### 6.2. Subjecció en suports

#### Elements de suspensió
Grapes de suspensió articulades que s'uneixen al suport mitjançant 
consoles i ganxos, subjectant la línia pel neutre portador.

> ![c](../img/grapes_suspensio.png)
> **Fig. 13.** [Martin _et al._] (2026). [IOC]. 
> _Grapes de suspensió_.
> Imatge sota llicència [CC3.0-by-nc-sa]

> ![c](../img/consoles_suspensio.png)
> **Fig. 14.** [Martin _et al._] (2026). [IOC]. 
> _Consoles de suspensió_.
> Imatge sota llicència [CC3.0-by-nc-sa]

> ![c](../img/grapa_ganxo.png)
> **Fig. 15.** [Martin _et al._] (2026). [IOC]. 
> _Conjunt de suspensió format per grapa, consola (no en aquesta imatge) 
> i ganxo_.
> Imatge sota llicència [CC3.0-by-nc-sa]


#### Elements d'amarratge 

Pinces d'amarratge amb tascons aïllants lliscants que mantenen la 
pressió sobre l'aïllament del neutre sense fer-lo.

> ![c](../img/pinces_amarratge.png)
> **Fig. 16.** [Martin _et al._] (2026). [IOC]. 
> _Pinces d’amarratge_.
> Imatge sota llicència [CC3.0-by-nc-sa]

> ![c500](../img/conjunt_amarratge.png)
> **Fig. 17.** [Martin _et al._] (2026). [IOC]. 
> _Conjunt d’elements per a l’amarratge_.
> Imatge sota llicència [CC3.0-by-nc-sa]



### 6.3. Components complementaris

#### Abraçadores
Per fixar el feix al cable fiador d'acer o per a la guia de baixants en 
canvis d'aeri a subterrani.

> ![c500](../img/abraçadores.png)
> **Fig. 18.** [Martin _et al._] (2026). [IOC]. 
> _Abraçadores per a xarxes aèries trenades suspeses_.
> Imatge sota llicència [CC3.0-by-nc-sa]

> ![c500](../img/abraçadores_baixants.png)
> **Fig. 19.** [Martin _et al._] (2026). [IOC]. 
> _Abraçadores de subjecció de cables i tubs_.
> Imatge sota llicència [CC3.0-by-nc-sa]


#### Ganxos
Encastats en moure o suports per ancorar equips de suspensió/amarratge.

> ![c](../img/ganxos.png)
> **Fig. 20.** [Martin _et al._] (2026). [IOC]. 
> _Ganxos_.
> Imatge sota llicència [CC3.0-by-nc-sa]


#### Bressols
Protectors de curvatura (interior/exterior) utilitzats en canvis de 
direcció o derivacions.

> ![c](../img/bressols.png)
> **Fig. 21.** [Martin _et al._] (2026). [IOC]. 
> _Bressols i detall de muntatge de bressols_.
> Imatge sota llicència [CC3.0-by-nc-sa]


#### Caputxons
Elements d'estanquitat per a les puntes dels cables o entrades de tubs 
de protecció.

> ![c500](../img/caputxons.png)
> **Fig. 22.** [Martin _et al._] (2026). [IOC]. 
> _Caputxons i detall de muntatge de caputxons_.
> Imatge sota llicència [CC3.0-by-nc-sa]


#### Connectors i maniguets
Connectors de perforació d'aïllament, pressió o compressió per a 
derivacions; i maniguets (preaïllats o bimetàl·lics) per a empalmes de 
conductors.

> ![c500](../img/connectors.png)
> **Fig. 23.** [Martin _et al._] (2026). [IOC]. 
> _Connectors: a) de pressió per cargol; b) de compressió de petaca; c) 
> de perforació de l’aïllament; d) de compressió AMPACT_.
> Imatge sota llicència [CC3.0-by-nc-sa]

> ![c500](../img/maniguets.png)
> **Fig. 24.** [Martin _et al._] (2026). [IOC]. 
> _Diferents tipus de maniguets: a) maniguet d’unió alumini-alumini; b) 
> Maniguet d’unió alumini-coure; c) Maniguet preaïllat_.
> Imatge sota llicència [CC3.0-by-nc-sa]


#### Terminals i accessoris varis
Terminals de compressió per a connexió a caixes de protecció (CGP), 
juntament amb tacs, tensors, grillons i protectors de tub.

> ![c](../img/XABT_accessoris_varis.png)
> **Fig. 24.** [Martin _et al._] (2026). [IOC]. 
> _Diversos tipus d’accessoris: a) tacs per a la fixació de ganxos i 
cargols; b) Tubs de protecció; c) Tensors de cables; d) Subjectadors de 
cables; e) Protectors de cables; f) Grillons_.
> Imatge sota llicència [CC3.0-by-nc-sa]





7. Aïlladors
------------

S'utilitzen exclusivament per aïllar elèctricament els conductors nus 
en tensions operatives respecte als suports o estructures. Es fixen 
mitjançant roscatge o cimentació inalterable.

- **De politja:** El conductor es fixa a la gola exterior; utilitzats 
  en esteses i amarratges.
- **De suport:** Col·loquen el conductor al cap superior o a la gola 
  lateral.
- **Dobles:** Dissenyats amb diverses gargantes per allotjar més d'un 
  conductor per fase.
- **D'amarratge:** Dispositius especials per suportar grans traccions 
  mecàniques als extrems de la línia.





8. Condicions generals i especials d'instal·lació de XABT
---------------------------------------------------------

La **ITC-BT-06** del REBT i les especificacions de les companyies 
distribuïdores defineixen les distàncies de seguretat per a l'execució 
de les xarxes aèries de baixa tensió.

### 8.1. Distàncies de seguretat segons el tipus d'instal·lació

- **Cables posats:**
    + **Alçada a terra:** Mínim 2,5 m (si la distància és inferior, com 
      en determinats embrancaments, cal protecció mecànica).
    + **Finestres:** 0,30 m a la vora superior i 0,50 m a la vora 
      inferior i laterals.
    + **Balcons:** 0,30 m a la vora superior i 1 m a les vores laterals.
    + **Elements metàl·lics de façana:** Mínim 0,05 m (excepte si el 
      cable incorpora protecció específica).
- **Cables tibats:**
    + **Alçada a terra:** Mínim 4 m en condicions normals (excepte 
      encreuaments).

### 9.2. Proximitats i paral·lelismes

- **Amb línies d'AT:** Evitar el paral·lelisme. Distància horitzontal 
  $D \ge 1,5 \cdot H$ (on $H$ és l'alçada del suport més alt).
    + *Proximitat a CT o centrals:* $d \ge 2$ m (si $U_{AT} \le 66$ kV) 
      o $d \ge 3$ m (si $U_{AT} > 66$ kV).
    + *Mateix suport (AT/BT):* AT per sobre, distància $\ge$ separació 
      entre conductors d'AT, senyalització de perill i aïllament de BT 
      dimensionat per a la posada a terra d'AT.
- **Amb línies de telecomunicació:** En suports diferents, distància 
  horitzontal $\ge 1$ m ($\ge 0,10$ m si ambdues són aïllades). En el 
  mateix suport: distància $\ge 0,50$ m.
- **Carrers i carreteres:**
    + *Conductors nus:* $\ge 6$ m (amb circulació rodada) o $\ge 5$ m 
      (sense circulació).
    + *Conductors aïllats:* $\ge 4$ m en zones sense circulació rodada.
- **Ferrocarrils electrificats, tramvies i troleibussos:** Distància 
  horitzontal $\ge 1,5$ m.
- **Zones arbrades:** Prioritzar l'ús de conductors aïllats. En 
  conductors nus, evitar tot contacte amb branques.
- **Canalitzacions d'aigua i gas:**
    + *Aigua:* Distància $\ge 0,20$ m ($\ge 1$ m respecte a juntes, 
      empalmes o artèries principals).
    + *Gas:* Distància $\ge 0,20$ m ($\ge 1$ m respecte a juntes o 
      empalmes; $\ge 4$ m en gas d'alta pressió $>4$ bar).





10. Connexió a terra
--------------------

La posada a terra (REBT ITC-BT-018) és la unió elèctrica directa sense 
proteccions ni fusibles d'un element conductor al terreny mitjançant 
elèctrodes enterrats. El seu objectiu és derivar corrents de defecte i 
descàrregues atmosfèriques, limitant tensions perilloses en masses 
metàl·liques.

### 10.1. Esquemes de distribució i punts d'aplicació
En xarxes aèries de BT s'efectua a través del conductor neutre 
(esquemes **TT** i **TN**) o del conductor de neutre i protecció 
combinats (**TN-S**). Però l'REBT obliga a esquemes TT, els altres
esquemes són per situacions particulars.

### 10.2. Ubicacions obligatòries de la presa de terra
- Als propis centres de transformació (CT).
- Al primer suport de sortida del CT.
- A les ramificacions principals de la xarxa.
- Als finals de línia.
- En punts intermedis del traçat, garantint que la distància entre pates a terra no superi els **500 metres**.
