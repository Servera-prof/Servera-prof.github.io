Xarxes subterrànies de distribució en baixa tensió
==================================================

1. Tipus i característiques de les instal·lacions
-------------------------------------------------

Les canalitzacions de distribució se situen generalment en terrenys
de domini públic sota les voreres. El traçat ha de ser el més
rectilini possible i paral·lel a referències fixes. Cal respectar els
radis de curvatura mínims de les normes UNE 20435 i realitzar cates de
reconeixement abans d'excavar.



### 1.1. Conduccions directament soterrades

La profunditat mínima fins a la part superior del cable és de 0,60 m en 
voreres i 0,80 m en calçades.

> ![c500](../img/XSBT_excavacions.png)
> **Fig. 1.** [Martin _et al._] (2026). [IOC]. 
> _Conduccions amb conductors directament soterrats per sota de les 
> voreres_.
> Imatge sota llicència [CC3.0-by-nc-sa]

Condicions d'instal·lació:
- El llit de la rasa ha de ser llis, amb una capa de sorra de 0,05 m a
  la base i 0,10 m per sobre del cable.
- Cal una protecció mecànica superior i una cinta de senyalització.
- La distància mínima de la protecció a terra és de 0,10 m, i al
  cable de 0,25 m.



### 1.2. Conduccions entubades i galeries

Per evitar canvis de direcció s'utilitzen arquetes registrables.
En trams rectes es Disposen arquetes com a màxim cada 40 m i només
s'instal·la un circuit per tub.

> ![c500](../img/XSBT_arquetes.png)
> **Fig. 2.** [Martin _et al._] (2026). [IOC]. 
> _Les arquetes han de poder suportar el pes del material i el de la 
> circulació en superfície_.
> Imatge sota llicència [CC3.0-by-nc-sa]

A l'entrada de les arquetes, els tubs s'han de segellar contra
rosegadors.

> ![c500](../img/XSBT_segellat.png)
> **Fig. 3.** [Martin _et al._] (2026). [IOC]. 
> _Segellat de les conduccions subterrànies i els conductors en els 
> registres_.
> Imatge sota llicència [CC3.0-by-nc-sa]

En galeries o rases prefabricades no transitables s'admeten cables de
BT, AT, enllumenat i aigua (si no afecta altres serveis), però mai gas.

> ![c250](../img/XSBT_galeries.png)
> **Fig. 4.** [Martin _et al._] (2026). [IOC]. 
> _Galeria registrable de servei elèctric_.
> Imatge sota llicència [CC3.0-by-nc-sa]



### 1.3. Galeries transitables

Les galeries transitables de formigó armat han de complir:
- Dimensionament per suportar càrregues de trànsit i terres.
- Accessos tancats a la intempèrie i ventilació de 6 renovacions/hora.
- Temperatura màxima de 40 °C i sòls antilliscants amb drenatge.

> ![c250](../img/XSBT_galeries_2.png)
> **Fig. 5.** [Martin _et al._] (2026). [IOC]. 
> _Característiques generals de les galeries_.
> Imatge sota llicència [CC3.0-by-nc-sa]

Les canalitzacions d'aigua se situen al nivell inferior i requereixen
desguàs amb doble sifó. Està prohibit incloure instal·lacions de gas.

> ![c250](../img/XSBT_galeries_3.png)
> **Fig. 6.** [Martin _et al._] (2026). [IOC]. 
> _Galeries per al servei elèctric_.
> Imatge sota llicència [CC3.0-by-nc-sa]

Per a galeries de més de 400 m de longitud cal afegir:
- Il·luminació fixa interior i detecció de gasos tòxics (300 ppm).
- Indicadors lluminosos d'accés i sortides cada 400 m.
- Sectorització contra incendis RF120 i portes tallafocs RF90 segons la
  NBE-CPI-96.

En canals registrables d'accés restringit es poden usar canals d'obra
amb ventilació. En instal·lacions vistes en safates, l'ús queda
limitat a subestacions o interiors protegits.





2. Conductors i característiques elèctriques
--------------------------------------------

Els conductors de les línies subterrànies són de coure o alumini amb
aïllament polimèric i tensió assignada mínima de 0,6/1 kV segons la
norma UNE-HD 603. Les seccions mínimes són de 6 mm² per a coure i
16 mm² per a alumini.



### 2.1. Intensitats màximes admissibles

La intensitat permanent depèn de la temperatura màxima suportada per
l'aïllament. Les temperatures de servei i curtcircuit es detallen a les
taules de la norma UNE 20435 i el REBT (vegeu les taules del REBT o
UNE corresponents).

Per a condicions diferents de les tipus (temperatura del terreny de
25 °C, profunditat de 0,70 m i resistivitat de 1 K·m/W), s'apliquen
factors de correcció $F$. Per a temperatures diferents de 25 °C s'usa:

\begin{gather}
F = \sqrt{\frac{\theta_s - \theta_t}{\theta_s - 25}}
\end{gather}

A on:
- $\theta_s$ és la temperatura màxima de servei del conductor en 
  $\text{°C}$.
- $\theta_t$ és la temperatura real del terreny en $\text{°C}$.

Els coeficients per agrupació, profunditat i canalització sota tub
es consulten en les taules de la norma UNE 20435.



### 2.2 Instal·lació a l'aire en galeries

Per a cables a l'aire a 40 °C ambient es requereix una ventilació
eficaç. Si la temperatura varia, s'aplica el factor de correcció:

\begin{gather}
F = \sqrt{\frac{\theta_s - \theta_a}{\theta_s - 40}}
\end{gather}
A on:
- $\theta_s$ és la temperatura màxima de servei en $\text{°C}$.
- $\theta_a$ és la temperatura ambient de l'aire en $\text{°C}$.

L'absència de renovació d'aire pot incrementar la temperatura ambient
uns 15 K, fet que obliga a reduir la intensitat admissible.



### 2.3. Conductor neutre

La secció mínima del conductor neutre es determina en funció del
nombre de conductors i la secció de les fases segons les taules del
REBT. En sistemes de 2 o 3 conductors iguala la secció de fase.



### 2.4. Tubs protectors i encreuaments

Els tubs en canalitzacions soterrades han de complir la norma
UNE-EN 50086-2-4. La secció interior del tub ha de ser com a mínim
4 vegades la secció ocupada pels conductors.

Les distàncies mínimes en encreuaments i paral·lelismes són:
- Carreteres i ferrocarrils: tubs protegits amb formigó a 0,80 m i
  1,30 m de profunditat respectivament.
- Altres cables elèctrics: 0,25 m amb alta tensió i 0,10 m amb baixa
  tensió.
- Telecomunicacions i aigua/gas: 0,20 m de separació mínima (1 m fins a
  empalmaments o juntes).



### 2.5. Pas per elements constructius

Els passos per murs o sostres no poden contenir empalmaments i han de
disposar de tubs de protecció contínua, obturats contra la humitat i
incombustibles.





3. Càlculs elèctrics de secció
------------------------------

La distribució es realitza a 400 V entre fases i 230 V entre fase i
neutre. La secció es calcula segons la capacitat tèrmica i la caiguda
de tensió màxima admissible (5,5% o 7% segons el tipus de xarxa).

### 3.1. Càlcul per intensitat admissible

La intensitat de corrent es calcula amb la fórmula:

\begin{gather}
I_L = \frac{P}{\sqrt{3} \cdot U_L \cdot \cos\varphi}
\end{gather}
A on:
- $I_L$ és la intensitat de línia en $\text{A}$.
- $P$ és la potència en $\text{W}$.
- $U_L$ és la tensió composta en $\text{V}$.
- $\cos\varphi$ és el factor de potència (es pren 0,9).

### 3.2. Càlcul per caiguda de tensió

La caiguda de tensió en línies trifàsiques es calcula mitjançant:

\begin{gather}
\Delta U_L = 
  \sqrt{3} \cdot I_L \cdot L \cdot 
  (R \cdot \cos\varphi + X \cdot \sin\varphi)
\end{gather}
A on:
- $\Delta U_L$ és la caiguda de tensió en $\text{V}$.
- $I_L$ és la intensitat en $\text{A}$.
- $L$ és la longitud de la línia en $\text{km}$.
- $R$ és la resistència del conductor en $\Omega/\text{km}$.
- $X$ és la reactància del conductor en $\Omega/\text{km}$.
- $\cos\varphi$ és el factor de potència.

Expressat en funció de la potència:

\begin{gather}
\Delta U = 
  \frac{P \cdot L \cdot (R + X \cdot \tan\varphi)}{U_L^2} \cdot 100
\end{gather}
A on:
- $\Delta U$ és la caiguda de tensió en percentatge (%).
- $P$ és la potència en $\text{kW}$.
- $L$ és la longitud en $\text{km}$.
- $U_L$ és la tensió en $\text{kV}$.





4. Proteccions i posada a terra
-------------------------------

Els conductors es protegeixen contra sobrecàrregues i curtcircuits
mitjançant fusibles de classe gG. Les posades a terra del neutre es
realitzen al llarg de la línia cada 200 m com a màxim i als finals de
línia, aconseguint una resistència global inferior a 37 $\Omega$.






5. Esquemes de distribució (TN, TT, IT)
---------------------------------------

Els esquemes es defineixen mitjançant dues lletres principals:
- Primera lletra (Alimentació respecte a terra):
  + T = Connexió directa a terra.
  + I = Aïllat o connectat mitjançant una impedància.
- Segona lletra (Masses de la instal·lació respecte a terra):
  + T = Connectades directament a terra.
  + N = Connectades al punt neutre de l'alimentació.

Subtipus i característiques:
- Esquema TN:
  + TN-S: Neutre i protecció separats en tot el circuit.
  + TN-C: Funcions de neutre i protecció combinades (CPN).
  + TN-CS: Combinat en una part i separat en la resta.

> ![c500](../img/TN-S.png)
> **Fig. 7.** [Martin _et al._] (2026). [IOC]. 
> _Esquema de distribució tipus TN-S_.
> Imatge sota llicència [CC3.0-by-nc-sa]

> ![c500](../img/TN-C.png)
> **Fig. 8.** [Martin _et al._] (2026). [IOC]. 
> _Esquema de distribució tipus TN-C_.
> Imatge sota llicència [CC3.0-by-nc-sa]

> ![c500](../img/TN-CS.png)
> **Fig. 9.** [Martin _et al._] (2026). [IOC]. 
> _Esquema de distribució tipus TN-CS_.
> Imatge sota llicència [CC3.0-by-nc-sa]

- Esquema TT:
  + Neutre a terra i masses de la instal·lació a una presa de terra
    independent. Protecció mitjançant dispositius diferencials (DDR).

> ![c500](../img/TT.png)
> **Fig. 9.** [Martin _et al._] (2026). [IOC]. 
> _Esquema de distribució tipus TT_.
> Imatge sota llicència [CC3.0-by-nc-sa]

- Esquema IT:
  + Sense connexió directa a terra a l'alimentació. Garanteix la màxima
    continuïtat de servei davant un primer defecte d'aïllament.

> ![c500](../img/IT.png)
> **Fig. 9.** [Martin _et al._] (2026). [IOC]. 
> _Esquema de distribució tipus IT_.
> Imatge sota llicència [CC3.0-by-nc-sa]
