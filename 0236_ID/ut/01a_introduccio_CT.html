UT01 - INTRODUCCIÓ ALS CENTRES DE TRANSFORMACIÓ (CT)
====================================================






Introducció
-----------

La importància estratègica de l'energia elèctrica justifica l'anàlisi de
les instal·lacions de distribució, des de la generació fins al punt de
consum.

Històricament, els primers sistemes de corrent continu operaven a un
únic nivell de tensió (100 V), determinant per la càrrega principal
(il·luminació incandescent). Aquesta limitació tècnica, deguda a la
manca de mitjans eficients per al canvi de nivells de tensió en
contínua, imposava fortes restriccions: calia producció local per
limitar les pèrdues, amb cables de gran secció i una distància màxima de
generació-client d'uns 2,4 km per tal de garantir la viabilitat
econòmica.

Actualment, el sistema es basa en corrent altern i tensions elevades, la
qual cosa n'optimitza la transmissió i la distribució.

Aquesta unitat se centra en la infraestructura de distribució, abordant:

1. **Centres de transformació (CT):** S'analitzen la configuració, els
  components (transformadors, aparellatge, cel·les, instal·lacions de
  terra), i la seva funció en la xarxa de distribució. 
2. **Operació, anteniment i prevenció de riscos:** S'estudien els
   protocols d'operació manteniment i les maniobres als CT, així com la
   identificació de riscos elèctrics i l'aplicació de mesures
   preventives i equips de protecció, en compliment de la normativa de
   prevenció de riscos laborals i protecció ambiental.

Per a l'aprenentatge efectiu, es recomana la realització de les
activitats pràctiques i exercicis d'autoavaluació, així com la consulta
de la bibliografia i recursos web complementaris.

Resum
-----

### El sistema elèctric i els centres de transformació

#### Estructura del sistema elèctric
El sistema elèctric es compon de tres subsistemes fonamentals: 
producció, transport i distribució. La freqüència nominal obligatòria 
és de 50 Hz.

#### Xarxes de distribució
- **Xarxa primària**: formada per línies (aèries o subterrànies) de 
  mitja tensió (MT) i subestacions de transformació MT/BT.
- **Xarxa secundària**: integrada per línies de 15 a 20 kV, centres de 
  transformació (CT) MT/BT i línies de baixa tensió (BT).

### Centres de transformació (CT)
Instal·lació proveïda d'un o diversos transformadors reductors d'alta 
tensió (AT) a baixa tensió (BT), amb l'aparellatge i obra 
complementària necessaris.

#### Justificació tècnica
Les tensions de generació (6-18 kV) no són suficients per al transport 
a grans distàncies. S'eleven a valors superiors (132 kV, 220 kV, 380 kV) 
per minimitzar les pèrdues per efecte Joule durant el transport. 
Posteriorment, les xarxes de distribució (20 kV, 66 kV) redueixen la 
tensió a 400/230 V mitjançant transformadors de distribució als CT.

#### Classificació dels CT
Segons: ubicació, connexió de servei, emplaçament, alimentació (una o 
dues línies d'arribada) i propietat.

#### Components bàsics del CT
- **Equip de MT**: seccionadors, seccionadors de posada a terra (SPT), 
  interruptors automàtics, interruptors seccionadors i interruptors 
  seccionadors amb fusibles.
- **Transformadors de distribució**: MT/BT.
- **Equip de BT**: quadres modulars de distribució.
- **Transformadors de mesura**: de tensió o intensitat per alimentar 
  aparells de mesura, comptatge i protecció.
- **Aparellatge**: conjunt d'elements de maniobra, seguretat i 
  protecció.

#### Cel·les o cabines prefabricades
Conjunts d'aparellatge de MT ja muntats en recintes metàl·lics. La 
connexió entre cel·les es realitza mitjançant adaptadors laterals.

#### Quadre modular de BT
Conjunt de mòduls que reben el circuit principal del transformador i el 
distribueixen en circuits individuals.

#### Instal·lació de posada a terra
Segons les instruccions MIE-RAT 13, consta de línies de terra i 
elèctrodes. La configuració habitual és l'anell rectangular a la rasa perimetral de cimentació. Quan la tensió màxima de defecte és inferior a 1.000 V, es poden unificar les postes a terra del neutre i de les masses de MT.


### Prevenció de riscos

#### Maniobres i seguretat
- No accionar mai un seccionador en càrrega.
- Per tallar servei en circuit en càrrega, obrir primer l'interruptor.
- Verificar absència de tensió abans de tancar un seccionador de posada 
  a terra.
- Comprovar que els seccionadors de posada a terra estan oberts abans 
  de restablir el servei.
- Per evitar tensions de retorn per doble alimentació, obrir 
  l'interruptor automàtic del quadre de BT.

#### Cinc regles d'or per a treballs en AT sense tensió
1. Obrir totes les fonts de tensió (tall visible).
2. Enclavar, bloquejar i senyalitzar els aparells de tall.
3. Comprovar l'absència de tensió.
4. Posar a terra i curtcircuitar les fonts de tensió.
5. Delimitar i senyalitzar la zona de treball.

#### Equips de protecció individual (EPI)
Qualsevol equip destinat a protegir el treballador d'un risc. Han de dur marcatge amb tipus de protecció, tensió d'utilització, número de sèrie i data de fabricació.


### Manteniment

#### Tipus de manteniment
- **Preventiu**: inspeccions periòdiques i renovació d'elements danyats.
- **Correctiu**: actuació sobre avaries imminents o produïdes.
- **Predictiu**: anticipació a la falla mitjançant monitoratge (ex. 
  càmeres termogràfiques per detectar escalfaments per mala connexió).

#### Avaries freqüents**
- **CT d'intempèrie**: causes climàtiques i actes vandàlics; afecten 
  aïllants, fusibles i autovàlvules (fàcil substitució i identificació 
  visual).
- **CT d'interior**: trencament de comandaments de cel·les (cal 
  comunicar al fabricant).


### Mediambient

#### Gestió de residus a les Illes Balears

L'ens competent és el **Govern de les Illes Balears**, a través de 
la **Direcció General d'Economia Circular, Transició Energètica i 
Canvi Climàtic** .

La normativa aplicable a les Balears és la **Llei 8/2019, de 19 de 
febrer, de residus i sòls contaminats de les Illes Balears** . A més, 
el **Pla de Transició Energètica i Canvi Climàtic de les Illes Balears 
(2025-2035)** estableix objectius més ambiciosos en matèria de 
renovables i economia circular .

#### Residus potencials en CT (àmbit balear):**
- Elements substituïts per avaria (ferralla).
- Líquid refrigerant i oli de transformador (a alguns llocs substituïts 
  per transformadors secs modelats en resina).
- Hexafluorur de sofre (SF₆), gas aïllant a les cel·les.
- Transformadors fora de servei (considerats residus perillosos) .

**Consideracions ambientals addicionals a Balears:**
- Les instal·lacions elèctriques es consideren activitats potencialment 
  contaminants del sòl .
- Cal extremar precaucions per evitar abocaments durant l'obertura de 
  rases.
- Les aigües pluvials de zones pavimentades han de recollir-se i 
  tractar-se mitjançant separadors d'olis i hidrocarburs.
- Abans de la posada en servei, pot ser necessària una analítica de 
  control de la qualitat de l'aqüífer .
