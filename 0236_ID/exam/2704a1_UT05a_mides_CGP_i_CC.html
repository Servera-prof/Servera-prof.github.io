Examen mides nínxol CPG + CS i armari/local CC
==============================================

Enunciat
--------

1. Ves al catàleg de Pinazo i a la guia de la NRZ103 i dimensiona 
   l'hornacina (_hornacina_ en castellà) o nínxol (_nicho_ en castellà, 
   _niche_ en francés) per a la CS, CGP i fusibles adients per a una 
   LGA amb una $I_z = 151 \text{ A}$ i una previsió de potència de $P = 
   80 \text{ kW}$.

   **Important:** per tal de complir alhora la NRZ002 i la NRZ103. 
   Utilitza els marges més amples de les figures de la **guia NRZ103**.
   
   **Indica:**
   - Ample nínxol/hornacina: __________ cm
   - Alt nínxol/hornacina: __________ cm
   - Profunditat nínxol/hornacina: __________ cm
   - Referència del fabricant CS: __________
   - Referència del fabricant CGP: __________


2. Ves al catàleg de Pinazo i a la guia de la NRZ103 i dimensiona el 
   local o armari de comptadors. No es pot utilitzar local si amb un 
   armari és suficient. Recorda que per normativa s'ha de considerar 
   que tots els locals són trifàsics, els habitatges poden ser 
   monofàsics si no superen els 15 kW.
   
   **Edifici:**
   
   - 3 habitatges d’electrificació elevada (planta segona)
       i 3 d’electrificació bàsica (planta primera).
   - 3 locals comercials (planta baixa):
       + Una pizzeria
       + Una tenda de pinso per cabres
       + Una oficina d’atenció d’objectes perduts a torrents
   - Les zones comunes són de 100 m²
   - L’aparcament (soterrani) té 200 m²
   
   **Important:** Recorda que has d'instal·lar un protector de 
   sobretensions!
   
    **Indica:**
   - Ample armari/local: __________ cm
   - Alt armari/local: __________ cm
   - Profunditat armari/local: __________ cm
   - Referència del fabricant UF que instal·lis:
       + __________ 
       + __________ 
       + __________ 
       + __________ 
       + __________.
       
**S'ha d'entregar:**
