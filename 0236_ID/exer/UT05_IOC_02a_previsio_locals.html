Previsió de càrregues locals
============================

Enunciat
--------

L’objectiu d’aquesta activitat és que us familiaritzeu amb els càlculs 
necessaris per fer una previsió de càrrega per a un edifici d’habitatges 
que tingui locals comercials o d’oficines i serveis generals.

Suposem que a l’edifici de l’activitat anterior, en què la previsió 
d’habitatges era de 80,64 kW.

Hi ha 3 locals a la planta baixa de 20,  40 i 65 m2 respectivament, i 
l’edifici disposa, al soterrani, d’un garatge de 300 m2 amb ventilació 
forçada.

A més, l’edifici té un ascensor de 400 kg de càrrega i ens basta que 
vagi a 0,63 m/s, i una piscina de 120 m3 (pots suposar 8 W/m³), 
La superfície d’àrees comunes consta d'una entrada de 60 m2 i escala 
de 170 m2. 

Cal tenir en compte també el grup de pressió per a l’elevació de 
l’aigua (pots suposar 17 preses d'aigua per habitatge). 
Quina és la previsió de càrrega total?
