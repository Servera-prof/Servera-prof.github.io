Càlcul DI
=========

Enunciat
--------

L’objectiu d’aquesta activitat és que us familiaritzeu amb els càlculs 
necessaris per determinar la secció de la derivació individual (DI), 
segons els paràmetres de caiguda de tensió, corrent màxim admissible 
d’acord amb les condicions d’instal·lació i la temperatura màxima de 
servei.

Heu de calcular la secció d’una derivació individual (DI) que alimenta 
un habitatge amb nivell d’electrificació bàsic (5.750 W) a 230 V, la 
longitud de la qual des de l’embarrat de la sala de comptadors fins al 
quadre privat de dispositius generals de comandament i protecció és de 
10 m (situat a la segona planta). El sistema d’instal·lació és el de 
conductors aïllats a l’interior de conductes tancats d’obra de fàbrica.
