Previsió de càrregues habitatges
================================

Enunciat
--------

L’objectiu d’aquesta activitat és que us familiaritzeu amb els càlculs 
necessaris per fer una previsió de càrrega per a un edifici 
d’habitatges.

Volem determinar la potència dels diferents habitatges d’un edifici de 
3 plantes, amb 5 habitatges per planta de 100 m2 cada un, i un àtic amb 
2 habitatges de 160 m2 cada un.
