Càlcul LGA
==========

Enunciat
--------

L’objectiu d’aquesta activitat és que us familiaritzeu amb els càlculs 
necessaris per determinar la secció de la línia general d’alimentació 
(LGA), segons els paràmetres de caiguda de tensió, corrent màxim 
admissible segons les condicions d’instal·lació i la temperatura màxima 
de servei.

En un edifici dedicat a habitatges i locals comercials, s’estableix una 
previsió de càrrega de 145 kW, amb una centralització de comptadors a 
la planta baixa de l’edifici.

Tenint present que la longitud de la LGA és de 40 m, que està 
instal·lada sota tub encastat, i que la tensió d’alimentació és de 
400 V i, el cos f, de 0,9, trobeu quina és la secció de la LGA que 
compleix els requisits anteriorment especificats.

Per a la caiguda de tensió fes-ho utilitzant els dos sistemes que
coneixes: la fórmula simplificada, i les taules de valors unitaris.
Si t'atreveixes ho pots intentar mitjançant el càlcul vectorial.
