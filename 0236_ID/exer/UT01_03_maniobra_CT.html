Exercici 03: Maniobra a CT
==========================

1. Recollament de la connexió en una cel·la MT
----------------------------------------------

### Objectiu

Realitzar de forma segura el recollament de la connexió interna d'una 
cel·la de Mitjana Tensió, _cel·la suport 1 a CS Usurbil_, al Centre de 
Transformació _CT Usurbil_, garantint que no hi ha tensió i complint els 
protocols establerts de la companyia distribuidora i de seguretat 
elèctrica.




### 1. Sol·licitud de Descàrrega

#### 1.1. Tasques i Dades
- Centre de transformació afectat: CT Usurbil
- Línia d'alimentació: CT Lasarte
- Indicar clarament el motiu del treball: «Recollament de terminals en  
  cel·la MT del CT Usurbil»
- Adjuntar croquis de situació si és necessari.


#### 1.2. Responsables. Qui omple la Sol·licitud de Descàrrega?

Només el personal autoritzat i amb competència tècnica pot omplir i signar una Sol·licitud de Descàrrega, ja que és un document legal que implica la intervenció en una instal·lació energitzada i la seva posterior desenergització controlada. Normalment, el «Responsable tècnic de l'empresa contractista».




### 2. Permís de Treball:

#### 2.1. Tasques

- Identificar tot el personal intervinent.
- Assignar responsable de zona de treball (AZT).
- Establir data i hora prevista per a la intervenció.

#### 2.2. Qui omple el permís de treball?

El Permís de Treball l'omple i signa l'AZT, qui es compromet a garantir
que la zona està desenergitzada, amb posades a terra visibles,
senyalitzada, i que el treball es pot fer en condicions segures.

1. **COD – Centre d'Operació de Distribució**
    **Qui és?** Operador des del centre de control de la companyia distribuïdora (ex. Iberdrola).
    **Responsabilitats:**
    *   Supervisa la xarxa de distribució en temps real.
    *   Autoritza i executa maniobres remotes (obertura/tancament de cel·les, seccionadors, etc.).
    *   Registra i documenta totes les actuacions.
    *   Manté comunicació permanent amb l'AZT.

## ROLS CLAU EN MANIOBRES EN INSTAL·LACIONS ELÈCTRIQUES (MT/AT)

## 1. COD – Centre d'Operació de Distribució
**Qui és?**
Operador des del centre de control de la companyia distribuïdora (ex. Iberdrola).
**Responsabilitats:**
*   Supervisa la xarxa de distribució en temps real.
*   Autoritza i executa maniobres remotes (obertura/tancament de cel·les, seccionadors, etc.).
*   Registra i documenta totes les actuacions.
*   Manté comunicació permanent amb l'AZT.

## 2. AZT – Agent de Zona de Treball
**Qui és?**
Tècnic qualificat que es troba al camp, responsable de la seguretat a la zona de treball.
**Responsabilitats:**
*   Coordina l'actuació dins del centre de transformació o subestació.
*   Verifica absència de tensió i col·loca posades a terra.
*   Instal·la senyalització i candaus de seguretat.
*   Assegura que no es treballa en tensió.
*   Es comunica en tot moment amb el COD.

## 3. JT – Cap de Treball
**Qui és?**
El Cap de Treball en una instal·lació elèctrica té un paper clau en l'organització, supervisió i seguretat de l'equip de treball. Tot i que pot coincidir amb l'AZT (Agent de Zona de Treball) en intervencions simples, en treballs més complexos o amb diversos equips simultanis les seves funcions estan clarament diferenciades.
**Responsabilitats:**
*   Garantir la seguretat de l'equip de treball
*   Coordinar amb l'AZT (Agent de Zona de Treball)
*   Distribuir tasques dins l'equip
*   Verificar l'ús correcte d'EPIs i eines
*   Supervisar el desenvolupament del treball
*   Interrompre el treball si hi ha condicions insegures

===== Pàgina 5 =====

*   Informar de qualsevol incident
*   Deixar constància del treball realitzat

## 4. Equip de treball / Tècnics al camp

**Qui són?**
Un o diversos operaris que realitzen tasques tècniques (manteniment, proves, medicions, etc.).
**Responsabilitats:**
*   Realitzen els treballs segons l'ordre.
*   Compleixen instruccions de l'AZT.
*   No executen maniobres llevat d'autorització.
*   Usen EPI i segueixen protocol de seguretat elèctrica.

## 5. OT – Ordre de Treball

**Què és?**
Document oficial que autoritza els treballs a realitzar en una instal·lació elèctrica. Inclou:
*   Identificació del lloc (CT, subestació, etc.).
*   Data, hora i durada estimada.
*   Tipus de treball i transformador/línia afectada.
*   Personal autoritzat i responsable AZT.
*   Codi d'intervenció (per al COD).

===== Pàgina 6 =====

**Seqüència de maniobra segura reaprès de la connexió en una cel·la de Mitjana Tensió (CT Usurbil)**

## 0. Preparació administrativa

*   Omplir la Sol·licitud de Descàrrega
    *   Responsable: Coordinador elèctric o AZT autoritzat.
    *   Afectació: Línia CT Lasarte – CT Usurbil
    *   Descripció del treball: Reaprès de borns en cel·la MT.
    *   Incloure croquis si ho requereix la distribuïdora.
*   Permís de Treball
    *   Responsable: AZT (Agent de Zona de Treball).
    *   Identificació de treballadors, cap de treball (si aplica), equips, EPI i mesures de seguretat.

## 1. Contacte amb el COD (Centre d'Operació de Distribució)

*   L'AZT s'identifica i sol·licita descàrrega de la cel·la CT Usurbil
*   Es confirma que els treballs autoritzats són de reaprès de connexió en cel·la MT.
*   El COD confirma i executa l'obertura remota de la cel·la escomesa bucle aeri en CT Lasarte
*   El COD confirma i executa l'obertura remota de la cel·la suport 1 a CS Usurbil.
*   Els operaris realitzen la posada a terra manual, senyalització i bloqueig de la cel·la suport 1 a CS Usurbil.
*   Es senyalitza la zona de risc, s'instal·la candau i cartell a la cel·la intervinguda.

## 2. Obertura física de ganivetes al suport 2

*   Desplaçament fins al pal de suport 2, situat entre CT Lasarte i CT Usurbil.
*   Al suport 2, s'utilitza detector de tensió específic per a mitjana tensió (5–36 kV) per detectar absència de tensió (5–36 kV).
*   L'AZT o el Cap de Treball executa l'obertura manual de les ganivetes del seccionador aeri (amb pértiga).
*   Es verifica visualment que les ganivetes estan obertes completament.

## 3. Verificació d'absència de tensió

*   Al suport 2, s'utilitza detector de tensió específic per a mitjana tensió (5–36 kV) per assegurar novament absència de tensió.
*   Es verifica absència de tensió en els tres conductors abans de realitzar qualsevol posada a terra.

===== Pàgina 7 =====

4.  **Connexió de posada a terra al suport 2**
    *   Es connecta l'equip de posada a terra en altura (pinces amb pértiga o connectors telescòpics).
    *   S'asseguren els tres conductors a la línia de terra (baixada protegida o cable enterrat del pal).
    *   Es comprova que la connexió és visible i està correctament instal·lada.

**Execució del treball**

5.  **Accés al CT Usurbil**
    *   L'equip entra a la zona de treball sota supervisió de l'AZT.
    *   Es realitza el reaprès dels borns de connexió a la cel·la de mitjana tensió amb eines adequades i parell controlat si escau.

**Finalització del treball**

6.  **Retirada de posada a terra al suport 2**
    *   L'AZT o Cap de Treball retira acuradament les posades a terra del suport 2 amb pértiga.

7.  **Tancament de ganivetes al suport 2**
    *   Es realitza el tancament manual de les ganivetes del seccionador del suport 2.

8.  **Comunicació al COD**
    *   L'AZT informa el COD que el treball ha finalitzat i se sol·licita el rearmament del sistema des de CT Lasarte i el rearmament de la cel·la de suport 1 a CS Usurbil.
    *   El COD tanca les cel·les i restableix l'alimentació.

9.  **Registre de l'actuació**
    *   Es complimenta la documentació de fi de treball: full de descàrrega, part de maniobra, informe tècnic si es requereix.

===== Pàgina 8 =====

**Consideracions de seguretat**

*   Tots els operaris han d'estar autoritzats per treballar en instal·lacions de MT.
*   És obligatori l'ús d'EPI dielèctrics, guants de classe 3 o superior, i pértigues certificades.
*   La posada a terra ha de ser visible, contínua i comprovada abans d'iniciar el treball.

**DETALLS A DESTACAR EN LA PRÀCTICA**

*   Verificació de tensió en ambdós sentits abans d'aterrar

*   Posada a terra amb pértiga o bastó de posada a terra aèria
*   Coordinació constant amb COD en cada fase

===== Pàgina 12 =====

# Treball simultani de 2 equips de treball en un mateix CT

Si ambdós equips han d'intervenir simultàniament —un per fer medicions al transformador del CT_Usurbil i un altre per canviar els fusibles en un pal de línia aèria connectat al mateix CT— llavors es requereix una coordinació precisa entre els dos equips de treball i el COD, perquè ambdós treballs requereixen desenergitzar elements diferents però connectats a la mateixa infraestructura.

**ESCENARI TÈCNIC:**

*   L'Equip 1 treballarà al transformador del CT_Usurbil (requereix obrir i posar a terra a la cel·la de transformador).
*   L'Equip 2 treballarà en un pal amb fusibles de la línia aèria (requereix obertura en ambdós extrems de la línia i posada a terra en altura).
*   Ambdós treballs afecten directament a la mateixa xarxa i s'han de fer amb màxima seguretat.

**COORDINACIÓ ENTRE AZT:**

*   Només pot haver-hi una única persona que coordini amb el COD en nom d'ambdós equips: un dels AZT assumirà el rol d'AZT coordinador.
*   L'AZT coordinador serà l'encarregat de comunicar-se amb els Caps de Treball de cada equip de treball. (l'AZT coordinador pot ser el mateix cap d'equip d'un equip si el treball no és complex)
*   El COD gestionarà les maniobres necessàries per garantir una desconnexió segura total per a ambdós treballs abans d'autoritzar l'inici.
*   És imprescindible que ambdós Caps de Treball verifiquin l'absència de tensió per separat en els seus punts de treball.

**Objectiu:**
Aprendre a coordinar treballs simultanis en instal·lacions de MT, mantenint comunicació efectiva amb COD i entre equips, garantint la seguretat mitjançant maniobres autoritzades i posades a terra.
