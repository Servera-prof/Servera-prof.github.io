Càlcul DI
=========

Enunciat
--------

L’objectiu d’aquesta activitat és que us familiaritzeu amb els càlculs 
necessaris per determinar la resistència de pas d’un circuit de presa a 
terra amb la utilització de diferents tipus d’elèctrodes.

1. **Càlcul de la resistència de pas amb piques:** en un terreny de 
   resistivitat aparent de 60 Ω·m, s’instal·len tres piques de 2 m de 
   longitud cadascuna, connectades en paral·lel, amb la finalitat 
   d’aconseguir una resistència determinada. Quin és el valor d’aquesta 
   resistència?
2. **Càlcul de la resistència de pas amb plaques:** s’ha de connectar a 
   terra un fanal sobre terreny de resistivitat aparent de 90 Ω·m. S’ha 
   optat per una placa massissa de coure de 0,5 per 1 m. Quina és la 
   resistència de pas a terra que tindrà la placa un cop instal·lada?
3. **Càlcul de la resistència de pas amb conductors enterrats:** en un 
   edifici en construcció de 40 m de perímetre s’ha instal·lat com a 
   elèctrode un conductor nu que forma un anell sota els fonaments. La 
   resistivitat aparent del terreny és de 200 Ω·m. Quina és la 
   resistència de pas a terra que aporta aquest conductor?
