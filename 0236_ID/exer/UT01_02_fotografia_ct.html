Exercici 02: Caça centres de transformació
==========================================

<!-- Ortografia revisada 06/09/2026 -->

Enunciat
--------

Un dels grans avantatges del mòdul d'instal·lacions de distribució és
que aquestes instal·lacions estan a tot arreu. Per tant, es tracta de
anar passejant pel poble o ciutat (a on visqueu, a ca la vostra parella,
per on aneu a nedar amb els amics, etc.) i quan us topeu amb una 
instal·lació interessant **fotografieu-la**. No valen fotografies de
transformadors a **menys de 500 m** del centre. 

La fotografia haurà d'estar **acompanyada amb una localització** al
mapa, si el GPS del vostre mòbil no és precís, ubiqueu-la manualment.
**No hi pot haver fotos repetides**. Podeu enviar la fotografia i la
ubicació al xat del grup, perquè ningú «us el prengui». Teniu fins la
**data màxima** que hagi establert el professor.



Fotografies a adjuntar
----------------------

Les fotografies a adjuntar hauran de ser com a mínim les següents:

- Transformador en superfície en caseta prefabricada i escomesa 
  subterrània.
- Transformador integrat en un edifici
- Transformador a la intempèrie

Tot i que es poden obtenir punts extres si trobeu:

- Un transformador subterrani
- Un transformador semisoterrani
- Un transformador en caseta d'obra amb escomesa aèria
- Un transformador d'abonat



Puntuació
---------

- +4 punts si s'han aconseguit 2 dels 3 transformadors mínims.
- +1 punt si també s'ha aconseguit el tercer
- +0,75 punts per cada transformador opcional
- +1 punt si 2 transformadors o més estan lluny de Manacor.
- +1 punt si 2 o més fotografies són de transformadors interessants 
  (molt nets, en molt mal estat, decorats artísticament, etc.). El que
  és interessant o no queda a criteri subjectiu del professor, però li
  podeu anar mostrant fotografies per entendre la seva personalitat.
- -1 punt per fotografia repetida.
- -0,5 punts si la fotografia no està localitzada o no està correctament 
  localitzada
