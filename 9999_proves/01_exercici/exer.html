Càlcul de previsió de potències
===============================

Enunciat
--------

Tenim un edifici dedicat principalment a habitatges. Tenint en compte
que:
- assumirem que l'habitatge és d'electrificació bàsica tret que sigui
  reglamentariament exigible elevada 
- que les potències de cada habitatge seran les mínimes reglamentàries
- no hi pot haver places mitges de VE, i que la opció més cauta és 
  arrodonir a l'enter superior (p.e. si el nombre de vehícles elèctrics 
  és d'1,4 s'arrodonirà a 2) 
  
Calcula segons ITC-BT-10 la potència prevista per una instal·lació amb:

**Habitatges**

- [[nh1]] habitatges [[rh1]], [[mq1]] m², [[nt1]] bases de corrent d'ús 
  general i [[pll1]] punts de llum.
- [[nh2]] habitatges [[rh2]], [[mq2]] m², [[nt2]] bases de corrent d'ús
  general i [[pll2]] punts de llum.
- [[nh3]] habitatges [[rh3]], [[mq3]] m², [[nt3]] bases de corrent d'ús
  general i [[pll3]] punts de llum.

**Locals**

| Local   | $P_{dem}$ | $S$     |
| :-----: | :-------: | :-----: |
| [[tl1]] |  [[pdl1]] | [[sl1]] |
| [[tl2]] |  [[pdl2]] | [[sl2]] |
| [[tl3]] |  [[pdl3]] | [[sl3]] |

A on:
- $P_{dem}$ és la potència demandada pel local en $\text{kW}$
- $S$ és la superfície en $\text{m}^2$

**Garatge**

El garatge té [[plg]] plantes amb una superfície de [[sg]] cada una
i ventilació [[vg]], i una superfície de [[spv]] m² per vehícle i
[[spl]] prevista la instalació de SPL.

**Serveis comuns**

- La superfície de l'escala a il·luminar és de [[sesc]], i la dels
  passadissos [[spas]]. La il·luminació està prevista amb LEDs
  (assimilable a fluorescent).
- Es necessita un ascensor per [[ae]]
- A l'edifici a més es necessita un grup de pressió de [[npa]] preses
  d'aigua i té [[npl]] plantes.
 
 
 
Respostes
----------

- Coeficient de simultaneitat habitatges: [[%cs]]
- Potència habitatges: [[%ph_kw]] kW
- Potència locals: [[%pl_kw]] kW
- Potència garatge: [[%pg_kw]] kW
- Potència zones comunes: [[%pzc_kw]] kW
- Potència vehícle elèctric: [[%pve_kw]] kW
- **(_4 punts_) Potència total prevista per l'edifici** [[%pt_kw]] kW



Puntuacions
-----------

Tret que s'indiqui el contrari totes les preguntes valen 1 punt.

/**
 * Array o obj opcional amb el pes de puntuació per a cada regunta.

1, 4
];


/**
 * Genera de forma aleatòria tots els paràmetres de l'exercici o examen:
 * habitatges, locals comercials, garatge, serveis comuns, ascensor i 
 * grup de pressió.
 * 
 * @returns {Object<string, any>} Objecte amb les propietats dels 
 *    diferents elements de l'edifici.
 */
function genera_params() {
    const nh1 = aleat(2, 5);                   // Nombre d'habitatges 01
    const nh2 = aleat(2, 10);                  // Nombre d'habitatges 02
    const nh3 = aleat(2, 10);                  // Nombre d'habitatges 03
    
    const arr_rh = [                         // Requeriments d'habitatge
    [
        "amb secadora", 
        "amb aire acondicionat", 
        "amb calefacció elèctrica",
        "amb circuits domòtics"
    ],
    [
        "amb termo elèctric", 
        "amb grup de pressió pròpi", 
        "amb ascensor privat",
        "amb piscina"
    ]
    ];

    const i_rh1 = 1;
    const j_rh1 = aleat(0, 3);
    const i_rh2 = 0;
    const j_rh2 = aleat(0, 3);
    const i_rh3 = aleat(0, 1);
    const j_rh3 = aleat(0, 3);

    const rh1 = arr_rh[i_rh1][j_rh1];
    const rh2 = arr_rh[i_rh2][j_rh2];
    const rh3 = arr_rh[i_rh3][j_rh3];

    const mq1 = aleat(50, 159);                       // metres quatrats
    const mq2 = aleat(50, 200);
    const mq3 = aleat(50, 200);

    const nt1 = aleat(9, 20);              // número de tomes de corrent
    const nt2 = aleat(9, 25); 
    const nt3 = aleat(9, 25);  

    const pll1 = aleat(10, 30);               // número de punts de llum
    const pll2 = aleat(10, 35);
    const pll3 = aleat(10, 35);

    const arr_tl = [                                   // Tipus de local
        "pizzeria",
        "oficina de advocat",
        "gestoria",
        "concesionari",
        "gimnàs"
    ];

    const i_tl1 = aleat(0, 4);
    const i_tl2 = aleat(0, 4);
    const i_tl3 = aleat(0, 4);

    const tl1 = arr_tl[i_tl1];
    const tl2 = arr_tl[i_tl2];
    const tl3 = arr_tl[i_tl3];

    const nl1 = aleat(1, 3);                         // Nombre de locals
    const nl2 = aleat(1, 3);
    const nl3 = aleat(1, 3);

    const pdl1 = aleat(200, 1000)/100;          // Pot. demandada locals
    const pdl2 = aleat(200, 1000)/100;
    const pdl3 = aleat(200, 1000)/100;

    const sl1 = aleat(50, 150);                     // Superficie locals
    const sl2 = aleat(50, 150);
    const sl3 = aleat(50, 150);

    const plg = aleat(1, 3);                          // plantes garatge

    const arr_vg = [                               // ventilació garatge
        "natural",
        "forçada"
    ]
    const i_vg = aleat(0, 1);
    const vg = arr_vg[i_vg];

    const spv = aleat(25, 35);        // superficie per plaça de vehicle
    const sg = aleat(2, 10) * spv;                 // superficie garatge

    const arr_spl = [
        "està",
        "**no** està"
    ]
    const i_spl = aleat(0, 1);
    const spl = arr_spl[i_spl];

    const sesc = aleat(50, 100);
    const spas = aleat(50, 100);

    const arr_ae = [
        "fins a 5 persones i 0,63 m/s de velocitat",
        "fins a 5 persones i 1,00 m/s de velocitat",
        "fins a 8 persones i 1,00 m/s de velocitat"
    ];
    const i_ae = aleat(0, 2);
    const ae = arr_ae[i_ae];

    const nh_tot = nh1 + nh2 + nh3;
    const npa = aleat(10, 15) * nh_tot;           // numero preses aigua
    const npl =  Math.floor(nh_tot / aleat(3, 5));     // nombre plantes
    
    return {
        nh1,  i_rh1, rh1,  mq1, nt1, pll1,
        nh2,  i_rh2, rh2,  mq2, nt2, pll2,
        nh3,  i_rh3, rh3,  mq3, nt3, pll3,
        tl1,  pdl1,  sl1,  
        tl2,  pdl2,  sl2,  
        tl3,  pdl3,  sl3,  
        plg,  sg,    i_vg, vg,  spv, i_spl, spl,
        sesc, spas,  i_ae, ae,   npa, npl
    };
}

/**
 * Calcula les solucions teòriques de potència segons la normativa 
 * ITC-BT-10.
 * 
 * @typedef {Object} SolucionsEdifici
 * @property {number} cs - Coeficient de simultaneïtat dels habitatges.
 * @property {number} ph_kw - Pot. prevista per als habitatges (en kW).
 * @property {number} pl_kw - Pot. prevista locals comercials (en kW).
 * @property {number} pg_kw - Potència prevista garatge (en kW).
 * @property {number} pzc_kw - Potència zones comunes (en kW).
 * @property {number} pve_kw - Pot. càrrega vehicles elèctrics (en kW).
 * @property {number} pt_kw - Pot. total prevista de l'edifici (en kW).
 * 
 * @returns {SolucionsEdifici} Objecte amb els resultats numèrics 
 *   calculats.
 */
function calcular_solucions() {
    const {
        nh1,  i_rh1, rh1,  mq1, nt1, pll1,
        nh2,  i_rh2, rh2,  mq2, nt2, pll2,
        nh3,  i_rh3, rh3,  mq3, nt3, pll3,
        tl1,  pdl1,  sl1,  
        tl2,  pdl2,  sl2,  
        tl3,  pdl3,  sl3,  
        plg,  sg,    i_vg, vg,  spv, i_spl, spl,
        sesc, spas,  i_ae, ae,   npa, npl
    } = params;
    
    const ee1 = i_rh1 === 0 || mq1 > 160 || nt1 > 20 || pll1 > 30;
    const ee2 = i_rh2 === 0 || mq2 > 160 || nt2 > 20 || pll2 > 30;
    const ee3 = i_rh3 === 0 || mq3 > 160 || nt3 > 20 || pll3 > 30;
    
    const ph1 = ee1 ? 9200: 5750;
    const ph2 = ee2 ? 9200: 5750;
    const ph3 = ee3 ? 9200: 5750;
    
    const nh = nh1 + nh2 + nh3;                             // num habit
    const arr_cs = [
        1,    2,    3,    3.8,  4.6,
        5.4,  6.2,  7,    7.8,  8.5,
        9.2,  9.9,  10.6, 11.3, 11.9,
        12.5, 13.1, 13.7, 14.3, 14.8,
        15.3
    ];
    const cs = nh > 21 ? 15.3+(nh-21)*0.5 : arr_cs[nh-1]; // coef simult
    const ph = cs*(nh1*ph1 + nh2*ph2 + nh3*ph3)/nh;
    
    const pl1 = max(sl1*100, pdl1*1000, 3450);
    const pl2 = max(sl2*100, pdl2*1000, 3450);
    const pl3 = max(sl3*100, pdl3*1000, 3450);

    const pl = pl1 + pl2 + pl3;                            // pot locals
    
    const pmqg = i_vg === 0 ? 10 : 20;               // pot per m² garat
    const pg = plg * sg * pmqg;
    
    const cspl = i_spl === 0 ? 0.3 : 1;                // coeficient SPL
    const nve = Math.ceil(0.1 * plg * sg / spv);
    const pve =  cspl * nve * 3680;                  // pot vehicle elec
    
    const pesc = sesc * 4;
    const ppas = spas * 8;
    const arr_pae = [
        4500,
        7500,
        11500
    ];
    const pae = arr_pae[i_ae];
    
    const arr_pgp = [
        [1, 1, 1, 1],
        [1, 1, 2, 2],
        [1, 2, 4, 6],
        [2, 4, 6, 6],
        [2, 4, 6, 8],
        [4, 6, 9, 11]
    ];
    const i_pgp = [150, 300, 450, 900, 1800, 3500].findIndex(e => e >= npa);
    const j_pgp = [1, 5, 11, 16].findIndex(e => e >= npl);
    const pgp = arr_pgp[i_pgp][j_pgp]*1e3;
    const pzc = pesc + ppas + pae + pgp;
    const pt = ph + pl + pg + pve + pzc;
    
    const ph_kw = ph/1e3; 
    const pl_kw = pl/1e3;
    const pg_kw = pg/1e3; 
    const pzc_kw = pzc/1e3;
    const pve_kw = pve/1e3;
    const pt_kw = pt/1e3;
    return {
        cs, ph_kw, pl_kw, pg_kw, pve_kw, pzc_kw, pt_kw
    };
}
