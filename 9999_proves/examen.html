Examen de càlcul de previsió de potències
=========================================

Enunciat
--------

Tenim un edifici dedicat principalment a habitatges, calcula segons
ITC-BT-10 la potència prevista per una instal·lació amb:

**Habitatges**

- [[nh1]] habitatges [[rh1]], [[mq1]] m², [[nt1]] bases de corrent d'ús 
  general i [[pl1]] punts de llum.
- [[nh2]] habitatges [[rh2]], [[mq2]] m², [[nt2]] bases de corrent d'ús
  general i [[pl2]] punts de llum.
- [[nh3]] habitatges [[rh3]], [[mq3]] m², [[nt4]] bases de corrent d'ús
  general i [[pl3]] punts de llum.

**Locals**

| Local   |  n      | $P_{dem}$ | $S$     |
| :-----: | :-----: | :-------: | :-----: |
| [[tl1]] | [[nl1]] |  [[pl1]]  | [[sl1]] |
| [[tl2]] | [[nl2]] |  [[pl2]]  | [[sl2]] |
| [[tl3]] | [[nl3]] |  [[pl3]]  | [[sl3]] |

A on:
- n és el nombre de locals idèntics
- $P_{dem}$ és la potència demandada pel local en $\text{kW}$
- $S$ és la superfície en $\text{m}^2$

**Garatge**

El garatge té [[pg]] plantes amb una superfície de [[sg]] cada una
i ventilació [[vent]], i una superfície de [[spv]] m² per vehícle i
[[spl]] prevista la instalació de SPL.

**Serveis comuns**

- La superfície de l'escala a il·luminar és de [[sesc]], i la dels
  passadissos [[spas]]. La il·luminació està prevista amb LEDs
  (assimilable a fluorescent).
- Es necessita un ascensor tipus [[ae]]
- A l'edifici a més es necessita un grup de pressió de [[npa]] preses
  d'aigua i té [[np]] plantes.
 
Resposta
--------

- Coeficient de simultaneitat habitatges: [[cs]]
- Potència habitatges: [[ph]]
- Potència locals: [[plc]]
- Potència garatge: [[pg]]
- Potència zones comunes: [[pzc]]
- Potència vehícle elèctric: [[pve]]
- Potència total prevista per l'edifici [[pt]]
