UT02a - AutoCAD primers passos
==============================

Normes generals
---------------
- Les normes són les aplicables a qualsevol examen.
- No es pot utilitzar programari o material no autoritzat.
- El material autoritzat és:
    + Calculadora
    + Portàtil
    + Boli
    + Paper
- El programari autoritzat és:
    + AutoCAD
    + Chrome (amb només 2 pestanyes obertes):
        * examen
        * [screencapture.com](https://screencapture.com)
- Material de consulta autoritzat:
    + [UNE 1027](../docs/norma_une_1027.pdf)
- Totes les parts valen 1 punt excepte que s'indiqui el contrari.
- La nota final és la part proporcional dels punts obtinguts sobre 10.

Enunciat
--------

1. Crea un nou dibuix amb la plantilla «acadiso», fes que el paper tingui
   unes mides de A2 full bleed.
2. Crea els marges reglamentaris per a un plànol A2 que serà 
   enquadernat. Consulta l'UNE si cal.<br>
   **ALERTA!!** no et fixis a la norma el que es guarda en capsa, sinó 
   el que s'enquaderna. 
3.  Utilitzant les coordenades relatives crea un caixetí de 180 x 36 al
   límit inferior dret del marge que acabes de crear.
4. Ves al cadastre i descarregat entre 150 i 200 parcel·les de Felanitx
5. Torna a anar al cadastre i descarregat entre 150 i 200 parcel·les més 
   adjacents a les anteriors. Utilitza la còpia amb punt de referència
   que has estudiat a classe per a ajuntar-les a un mateix dibuix.
6. Desactiva les capes de tal manera que només quedi el límit de les 
   parcel·les.
7. Fes un cercle de radi 150 a l'espai paper.
8. Converteix-lo a una finestra gràfica amb VMULT. Recorda que VMULT
   a vegades no està en mode objecte per defecte.
9. Genera un PDF a partir de la presentació, fet clic amb el botó dret
   a la pestanya i triant «Trazar...», assegurat que l'area de Traçat 
   és «Presentación» i no «Ventana» o altres.
   La resta d'opcions per defecte són les que has configurat al punt 2,
   i no és necessari tocar-les.
   
Entregues
---------

Has d'entregar:

- L'arxiu dwg que has generat amb l'AutoCAD
- El pdf del darrer punt
- El video de screencapture
