Examen global de documentació tècnica en instal·lacions elèctriques 			
===================================================================


Normes:
-------

- S'ha de **gravar la pantalla COMPLETA**, sense micròfon, webcam ni so.
  Pots utilitzar la web
  [Screen Capture](https://www.screencapture.com/es/)
- No es poden usar apunts.
- Només es pot tenir una finestra oberta (la del navegador Chrome).
- Només es pot tenir una pestanya oberta (la de l'examen).
- Està terminantment prohibit copiar o mirar al company.
- No es poden fer preguntes. Part de l'avaluació és la comprensió del
  text. Si hi ha algun error es parlarà una vegada l'examen hagi
  finalitzat, i en el seu cas s'anul·larà la pregunta.
- L'examen dura el que indiqui la tasca associada i **es tanca
  automàticament**. ENTREGUEU-HO ABANS o serà un zero.
- Qualsevol incompliment serà sancionat amb un zero.
- A l'examen tipus test 
  les preguntes correctes sumen 1 punt, 
  les incorrectes resten 1/(numrespostes - 1) punts, 
  les que es deixen en blanc, ni sumen ni resten.



Com fer l'examen tipus test:
----------------------------

- Agafa paper
- **Escriu la permutació del test al paper!!**
- Comença a escriure les respostes al paper (1. a, 2. c, etc.).
- Si una resposta es vol deixar en blanc escriu una n.
- Quan acabis copia les respostes sense espais i tot seguit, al camp
  «resposta», si no la saps n. Per exemple: abnaac
- Omple el teu nom i clica a avaluar.
- **Imprimeix la pàgina com a pdf fent «Ctrl + P»**
- Adjunta-la com a tasca.
- Entrega els papers utilitzats.



Com fer l'examen pràctic:
-------------------------

- Obre l'opció A i llegeix-la, obre l'opció B i llegeix-la.
- Tria una opció A o B.
- Segueix les instruccions de l'examen (recorda que estàs capturant la 
  pantalla COMPLETA, que permeten veure si la tasca es fa correctament).
- Entrega l'arxiu i els papers que hagis generat en la resolució de
  l'examen pràctic.
- Cada tasca val 1 punt excepte a on s'indiqui. La puntuació
  de l'exercici serà la suma dels punts obtinguts dividit pel total
  de punts multiplicat per deu 

> $$ \dfrac {\sum\limits_{i=1}^n P_i}{\sum\limits_{i=1}^n Z_i} \cdot 10 $$
> A on:
> - $ n $ és el total de tasques
> - $ P_i $ és la puntuació obtinguda a la tasca i-èssima
> - $ Z_i $ és la puntuació màxima de la tasca i-èssima
  
  
Puntuació
---------

- Projecte entregat: 40 %
- Examen
    - Test: 30 %
    - Pràctic: 30 %
  

EXAMEN
======

Una vegada s'hagin llegit les instruccions es pot accedir a l'examen 
en si fent clic als següents enllaços.

S'ha de fer l'examen tipus test i **només una** de les dues opcions
d'examen pràctic
