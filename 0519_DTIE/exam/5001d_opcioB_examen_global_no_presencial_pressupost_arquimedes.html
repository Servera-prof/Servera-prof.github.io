Opció B: Arquímedes		
===================

S'han de fer els punts següents:

- (_0,5 punts_) Descarregat i obri l'arxiu de [l'enllaç](../docs/examen.cyp)

- Copia una partida de la base de preus d'Extremadura, que et serveixi de base per a un punt de llum de creuament.
  
- Modifica la descripció per especificar que els mecanismes han de ser de la marca SERBUS.

- Crea una nova mà d'obra «peó serveri de qualitat» amb un preu per hora de 64 €, i amb una dedicació de 6 minuts per partida.

- Fes els amidaments d'aquesta partida per un chalet adossat (2 habitatges), només s'utilitza aquesta partida al saló d'ambdós habitatges (per dos cops de llum) i al dormitori doble d'ambdós habitatges (un cop de llum).

- (_0,5 punts_) Imprimeix el descompost.
- (_0,5 punts_) Imprimeix el pressupost i amidaments.

- (_0,5 punts_) Guarda l'arxiu en format comprimit cyp.

**Entrega**

- pdf del descompost.
- pdf del pressupost i amidaments
- arxiu .cyp
- captura de screencapture
