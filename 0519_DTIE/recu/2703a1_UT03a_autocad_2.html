UT03a - AutoCAD primers passos
==============================

Enunciat

1. Crea un nou dibuix i una presentació de pàgina de A1, full bleed amb 
   els màrges de la UNE1027 per a enquadernació i amb un caxetí de 
   180x36 al cantó inferior dret (0,5 punt).

2. Utilitza recursos existents:
    + Ves al drive i descarrega l'extracció cooperativa que vareu fer 
      de Sineu, copia-ho al model del nou dibuix (0,25 punts) 
    + Ves a servera-prof a la part de DXECT i descarrega la simbologia 
      de xarxes de baixa tensió i copia-la just a sobre del caixetí de 
      la presentació i al model (0,25 punts)

3. Crea una finestra gràfica a l'espai paper que comprengui l'A1 al 
   complet excepte els marges i el caixetí, i fes que el dibuix tingui una 
   escala 1:200 (1 punt).

4. Crea tres capes noves XABT_exist, XSBT_exist, XSBT_nova, amb els 
   colors i el tipus de línia corresponents segons la simbologia 
   d'edistribución (1 punt).

5. Tria una parcel·la qualsevol de Sineu i coloca un CD existent al seu 
   interior, enrasat i alineat amb la seva façana i amb el color i 
   l'escala corresponent (1 punt).

6. Des d'aquest CT dibuixa una XABT existent a la capa adeqüada, 
   aquesta XABT ha d'atravessar al meny un carrer i quan ho faci ha de 
   passar a XSBT (1 punt).

    + S'utilitza el tipus de línia adequat, amb el color adeqüat i a la 
      capa adeqaada (0,5 punts)
    + Utilitza la simbologia adequada, amb la mida adequada i a la capa 
      adequada (0,5 punts)

7. Crea una nova XSBT entubada, des del final de la XABT fins a una 
   parcel·la al·leatoria però que obligui a la linia a fer un gir 
   d'entre 45° i 120° i mesuri més de 70 m. Coloca una CS + CGP (1 punt).

    + No s'utilitza el tipus de línia adequat, amb el color adeqüat i a 
      la capa adequada (-0,5 punts) 
    + No s'utilitza la simbologia adequada, amb la mida adequada i a la 
      capa adequada (-0,5 punts)
    + La línia no fa un gir (-0,5 punts)

8. A l'espai paper crea una directriu per especificar la **londitud** i 
   el **tipus de cable** de la nova XSBT, així com el seu sistema 
   d'instal·lació. La lletra ha de tenir 3.5 mm de mida i la directriu 
   ha de ser de tipus subratllada i amb fons. A més ha de mesurar 20 mm
   i ha de tenir un angle de 45° (1 punt).
    + Indicacions incorrectes (-0.5 punts)
    + Format part del texte correcte (-0.5 punts)
    + Format de la directriu correcte (-0.5 punts)

9. Genera un pdf de la presentació (0,5 punts).



S'ha d'entregar
---------------
- PDF
- DWG
- ScreenCapture
