UT02a - AutoCAD primers passos
==============================

Normes generals
---------------
- Les normes són les aplicables a qualsevol examen.
- No es pot utilitzar programari o material no autoritzat.
- El material autoritzat és:
    + Calculadora
    + Portàtil
    + Boli
    + Paper
- El programari autoritzat és:
    + AutoCAD
    + Chrome (amb només 2 pestanyes obertes):
        * examen
        * [screencapture.com](https://screencapture.com)
- Material de consulta autoritzat:
    + [UNE 1027](../docs/norma_une_1027.pdf)
- Totes les parts valen 1 punt excepte que s'indiqui el contrari.
- La nota final és la part proporcional dels punts obtinguts sobre 10.



Enunciat
--------

1. Crea un nou dibuix i una presentació de pàgina de A3, full bleed amb 
   els màrges de la UNE1027 (o un mínim de 5 mm) per a enquadernació i 
   amb un caxetí de 180x36 al cantó inferior dret.
2. Utilitzant les coordenades relatives crea un caixetí de 180 x 36 al
   límit inferior dret del marge que acabes de crear.
3. Ves al drive i descarrega l'extracció cooperativa que vareu fer 
   de Sineu, copia-ho al model del nou dibuix, utilitzant la còpia amb
   punt de referència. Descarregat del cadastre entre 150 i 200
   parcel·les rurals més dels voltants.
4. (_0,5 punts_) Desactiva les capes de tal manera que només quedi el 
   límit de les parcel·les.
5. (_2 punts_) Crea 5 quadrats equiespaiats horitzontalment i separats 
   10 mm verticalment.
6. Crea 5 respectives finestres gràfiques amb diferent nivell de zoom.
7. A la darrera finestra afageix els noms de 2 carrers en majúscules i 
   mida mínima reglamentaria a l'espai paper.
8. A la d'abans crea una directriu amb linia de 20 mm i angle 135°
   senyalant un punt en concret, amb minúscules i majúscules escriu
   «Plaça del Poble»
9. (_0,5 punts_) Genera un PDF a partir de la presentació.

**Nota:** Per motius del funcionament de les rúbriques del GestIb, el
punt 5 es subdividirà en 2 items d'un punt cada un. El 4 i el 9 es
fusionen a l'item 4.
   
   
   
Entregues
---------

Has d'entregar:

- L'arxiu dwg que has generat amb l'AutoCAD
- El pdf del darrer punt
- Screencapture
