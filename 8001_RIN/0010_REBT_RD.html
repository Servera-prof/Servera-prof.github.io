RD 842/2002
===========

El vigent Reglament electrotècnic per a baixa tensió, aprovat pel Decret
2413/1973, de 20 de setembre, va suposar un considerable avanç en
matèria de regles tècniques i va establir un esquema normatiu, basat en
un reglament marc i unes instruccions complementàries, les quals
desenvolupaven aspectes específics, que es va revelar altament eficaç,
de manera que molts altres reglaments es van realitzar amb un format
anàleg.

No obstant això, l'evolució tant del cabal tècnic com de les condicions
legals ha provocat, al cap i a la fi, també en aquest reglament, un
allunyament de les bases amb què va ser elaborat, per la qual cosa
resulta necessària la seva actualització.

La Llei 21/1992, de 16 de juliol, d'Indústria, estableix el nou marc
jurídic en què, òbviament, es desplega la reglamentació sobre seguretat
industrial. L'apartat 5 del seu article 12 assenyala que «els reglaments
de seguretat industrial d'àmbit estatal s'aprovaran pel Govern de la
Nació, sense perjudici que les Comunitats Autònomes, amb competència
legislativa sobre indústria, puguin introduir requisits addicionals
sobre les mateixes matèries quan es tracti d'instal·lacions radicades en
el seu territori».

D'altra banda, el Tractat d'Adhesió d'Espanya a la Comunitat Econòmica
Europea va imposar el compliment de les obligacions derivades del seu
tractat constitutiu i successives modificacions.

El conjunt normatiu establert per l'Associació Espanyola de
Normalització i Certificació (AENOR), amb origen en els organismes
internacionals de normalització electrotècnica, com la Comissió
Electrotècnica Internacional (CEI) o el Comitè Europeu de Normalització
Electrotècnica (CENELEC), posa a disposició de les parts interessades
instruments tècnics avalats per una àmplia experiència i consensuats
pels sectors directament implicats, la qual cosa facilita l'execució
homogènia de les instal·lacions i els intercanvis comercials.

El Reglament que s'aprova mitjançant el present Reial Decret i les seves
instruccions tècniques complementàries manté l'esquema citat i, en la
mesura que sigui possible, l'ordenament del Reglament anterior, per
facilitar la transició.

La major novetat del Reglament consisteix en la remissió a normes, en la
mesura que es tracti de prescripcions de caràcter eminentment tècnic i,
especialment, característiques dels materials. Atès que aquestes normes
procedeixen en la seva major part de les normes europees EN i
internacionals CEI, s'aconsegueix ràpidament disposar de solucions
tècniques en sintonia amb l'aplicat en els països més avançats i que
reflecteixen un alt grau de consens en el sector.

Per facilitar la seva posada al dia, en el text de les instruccions
únicament es citen aquestes normes pels seus números de referència,
sense l'any d'edició. En una Instrucció a tal efecte es recull tota la
llista de les normes, aquesta vegada amb l'any d'edició, a fi que quan
apareguin noves versions es puguin fer els respectius canvis en aquesta
llista, quedant automàticament actualitzades en el text dispositiu,
sense necessitat d'una altra intervenció. En aquest moment també es
poden establir els terminis per a la transició entre les versions, de
tal manera que els fabricants i distribuïdors de material elèctric
puguin donar sortida en un temps raonable als productes fabricats
d'acord amb la versió de la norma anul·lada.

En línia amb la reglamentació europea, les prescripcions establertes pel
propi Reglament es considera que assoleixen els objectius mínims de
seguretat exigibles en cada moment, d'acord amb l'estat de la tècnica,
però també s'admeten altres execucions l'equivalència de les quals amb
aquests nivells de seguretat es demostri per part del dissenyador de la
instal·lació.

D'altra banda, a diferència de l'anterior, el Reglament que ara s'aprova
permet que es puguin concedir excepcions a les seves prescripcions en
els casos en què es justifiqui degudament la seva impossibilitat
material i s'aportin mesures compensatòries, la qual cosa evitarà
situacions sense sortida.

Es defineixen de manera molt més precisa les figures dels instal·ladors
i empreses autoritzades, tenint en compte les diferents formacions
docents i experiències obtingudes en aquest camp. S'estableix una
categoria bàsica, per a la realització de les instal·lacions elèctriques
més comunes, i una categoria especialista, amb diverses modalitats,
atenent les instal·lacions que presenten peculiaritats rellevants.

S'introdueixen nous tipus d'instal·lacions: des de les corresponents a
establiments agrícoles i hortícoles fins a les d'automatització, gestió
tècnica de l'energia i seguretat per a habitatges en edificis, d'acord
amb les tècniques més modernes, passant per un nou concepte
d'instal·lacions en piscines, on s'introdueixen les tensions que
proporcionen seguretat intrínseca, caravanes i parcs de caravanes, entre
d'altres.

S'augmenta el nombre mínim de circuits en habitatges, la qual cosa
redundarà en un major confort d'aquests.

Per a l'execució i posada en servei de les instal·lacions es requereix
en tots els casos l'elaboració d'una documentació tècnica, en forma de
projecte o memòria, segons les característiques d'aquelles, i el
registre en la corresponent Comunitat Autònoma.

Per primera vegada en un reglament d'aquest tipus, s'exigeix el
lliurament al titular d'una instal·lació d'una documentació on es
reflecteixin les seves característiques fonamentals, traçat,
instruccions i precaucions d'ús, etc. No tenia sentit no procedir
d'aquesta manera amb una instal·lació d'un immoble, mentre es
proporciona sistemàticament un llibre d'instruccions amb qualsevol
aparell elèctric d'escàs valor econòmic.

S'estableix un quadre d'inspeccions per organismes de control, en el cas
d'instal·lacions la seguretat de les quals ofereix particular
rellevància, sense obviar que els titulars d'aquestes les han de
mantenir en bon estat.

Finalment, s'encarrega al centre directiu competent en matèria de
seguretat industrial del Ministeri de Ciència i Tecnologia l'elaboració
d'una guia, com a ajuda als diferents agents afectats per a la millor
comprensió de les prescripcions reglamentàries.

En la fase de projecte, la present disposició ha complert el procediment
d'informació establert en el Reial Decret 1337/1999, de 31 de juliol,
pel qual es regula la remissió d'informació en matèria de normes i
reglamentacions tècniques i reglaments relatius als serveis de la
societat de la informació, en aplicació de la Directiva del Consell
98/34/CEE.

En virtut d'això, a proposta del Ministre de Ciència i Tecnologia, amb
informe favorable del Ministre d'Administracions Públiques, d'acord amb
el Consell d'Estat i prèvia deliberació del Consell de Ministres en la
seva reunió del dia 2 d'agost de 2002,

### DISPOSO:


#### Article únic. Aprovació del Reglament electrotècnic per a baixa tensió.

S'aprova el Reglament electrotècnic per a baixa tensió i les seves
instruccions tècniques complementàries (ITC) BT 01 a BT 51, que
s'adjunten al present Reial Decret.

> <b>Nota:</b> Cal tenir en compte que s'hi afegeix la ITC BT 52 
mitjançant l'article únic del Reial Decret 1053/2014, de 12 de desembre.



#### Disposició addicional primera. Cobertura d'assegurança o altra garantia equivalent subscrita en un altre Estat.

Quan l'empresa instal·ladora en baixa tensió que s'estableix o exerceix
l'activitat a Espanya, ja estigui coberta per una assegurança de
responsabilitat civil professional o altra garantia equivalent o
comparable en l'essencial quant a la seva finalitat i a la cobertura que
ofereixi en termes de risc assegurat, suma assegurada o límit de la
garantia en un altre Estat membre en què ja estigui establerta, es
considerarà complerta l'exigència establerta a l'apartat 5.8 c) de la
ITC-BT-03 aprovada pel Reial Decret 842/2002, de 2 d'agost, pel qual
s'aprova el Reglament electrotècnic per a baixa tensió. Si
l'equivalència amb els requisits és només parcial, l'empresa
instal·ladora en baixa tensió haurà d'ampliar l'assegurança o garantia
equivalent fins a completar les condicions exigides. En el cas
d'assegurances o altres garanties subscrites amb entitats asseguradores
i entitats de crèdit autoritzades en un altre Estat membre, s'acceptaran
a efectes d'acreditació els certificats emesos per aquestes.



#### Disposició addicional segona. Acceptació de documents d'altres Estats membres a efectes d'acreditació del compliment de requisits.

A efectes d'acreditar el compliment dels requisits exigits a les
empreses instal·ladores, s'acceptaran els documents procedents d'un
altre Estat membre dels quals es desprengui que es compleixen aquests
requisits, en els termes previstos a l'article 17 de la Llei 17/2009, de
23 de novembre, sobre el lliure accés a les activitats de serveis i el
seu exercici.



#### Disposició addicional tercera. Model de declaració responsable.

Correspondrà a les comunitats autònomes elaborar i mantenir disponibles
els models de declaració responsable. A efectes de facilitar la
introducció de dades en el Registre Integrat Industrial regulat al títol
IV de la Llei 21/1992, de 16 de juliol, d'Indústria, l'òrgan competent
en matèria de seguretat industrial del Ministeri d'Indústria, Turisme i
Comerç elaborarà i mantindrà actualitzada una proposta de models de
declaració responsable, que haurà d'incloure les dades que es
subministraran a l'esmentat registre, i que estarà disponible a la seu
electrònica d'aquest Ministeri.



#### Disposició addicional quarta. Obligacions en matèria d'informació i reclamacions.

Les empreses instal·ladores en baixa tensió han de complir les
obligacions d'informació dels prestadors i les obligacions en matèria de
reclamacions establertes, respectivament, als articles 22 i 23 de la
Llei 17/2009, de 23 de novembre, sobre el lliure accés a les activitats
de serveis i el seu exercici.



#### Disposició transitòria primera. Carnets professionals.

Els titulars de carnets d'instal·lador autoritzat o empresa
instal·ladora autoritzada, a la data de publicació del present Reial
Decret, disposaran de dos anys, a partir de l'entrada en vigor del
Reglament adjunt, per convalidar-los pels corresponents que es
contemplen a la instrucció tècnica complementària ITC-BT 03 del mateix,
sempre que no els hi hagués estat retirat per sanció, mitjançant la
presentació davant l'òrgan competent de la Comunitat Autònoma d'una
memòria en què s'acrediti la respectiva experiència professional en les
instal·lacions elèctriques corresponents a la categoria o categories la
convalidació de les quals se sol·licita, i que compten amb els mitjans
tècnics i humans requerits per l'esmentada ITC-BT 03. A partir de la
convalidació, per a la renovació dels carnets hauran de seguir el
procediment comú fixat en el Reglament.



#### Disposició transitòria segona. Entitats de formació.

Mentrestant no es determinin per les Administracions educatives les
titulacions acadèmiques i professionals corresponents a la formació
mínima requerida per a l'exercici de l'activitat d'instal·lador, aquesta
formació podrà ser acreditada, sense efectes acadèmics, a través de la
corresponent certificació expedida per una entitat pública o privada que
tingui capacitat per desenvolupar activitats formatives en aquesta
matèria i compti amb la corresponent autorització administrativa.

Els requisits de les entitats de formació seran establerts mitjançant la
corresponent Ordre ministerial.



#### Disposició transitòria tercera. Instal·lacions en fase de tramitació en la data d'entrada en vigor del Reglament.

Es permetrà una pròrroga de dos anys, a partir de l'entrada en vigor del
reglament annex, per a l'execució d'aquelles instal·lacions la
documentació tècnica de les quals hagi estat presentada abans d'aquesta
entrada en vigor davant l'òrgan competent de la Comunitat Autònoma i fos
conforme al que es disposa al Reglament electrotècnic per a baixa
tensió, aprovat pel Decret 2413/1973, de 20 de setembre, les seves
instruccions tècniques complementàries i totes les disposicions que els
desenvolupen i modifiquen.



#### Disposició derogatòria única. Derogació normativa.

A l'entrada en vigor del Reglament adjunt, quedarà derogat el Reglament
electrotècnic per a baixa tensió, aprovat pel Decret 2413/1973, de 20 de
setembre, les seves instruccions tècniques complementàries i totes les
disposicions que els desenvolupen i modifiquen.



#### Disposició final primera. Habilitació normativa.

El present Reial Decret es dicta a l'empara del títol competencial
establert a la disposició final única de la Llei 21/1992, de 16 de
juliol, d'Indústria, en concret, de les competències que corresponen a
l'Estat conforme a l'article 149.1.1a i 13a de la Constitució, relatives
a la regulació de les condicions bàsiques que garanteixin la igualtat de
tots els espanyols en l'exercici dels drets i en el compliment dels
deures constitucionals, així com sobre les bases i condicions de la
planificació general de l'activitat econòmica.



#### Disposició final segona. Habilitació al Ministre de Ciència i Tecnologia.

Es faculta el Ministre de Ciència i Tecnologia perquè, en atenció al
desenvolupament tecnològic i a petició de part interessada, pugui
establir, amb caràcter general i provisional, prescripcions tècniques,
diferents de les previstes al Reglament o les seves instruccions
tècniques complementàries (ITC), que possibilitin un nivell de seguretat
almenys equivalent a les anteriors, mentre es procedeix a la modificació
d'aquests.



#### Disposició final tercera. Entrada en vigor.

El Reglament electrotècnic per a baixa tensió, annex al present Reial
Decret, entrarà en vigor, amb caràcter obligatori, per a totes les
instal·lacions contemplades en el seu àmbit d'aplicació, **a l'any** de
la seva publicació al «Butlletí Oficial de l'Estat». No obstant això,
podrà aplicar-se, voluntàriament, des de la data d'aquesta publicació.

> **Nota:** Publicació del RD 842/2002 el 18/09/2002

Donat a Palma de Mallorca a 2 d'agost de 2002. JUAN CARLOS R.

El Ministre de Ciència i Tecnologia, JOSEP PIQUÉ I CAMPS
