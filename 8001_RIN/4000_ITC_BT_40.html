ITC-BT-40
=========

INSTAL·LACIONS GENERADORES DE BAIXA TENSIÓ

## 1. OBJECTE I CAMP D'APLICACIÓ

La present instrucció s'aplica a les instal·lacions generadores, 
entenent com a tals, les destinades a transformar qualsevol tipus 
d'energia no elèctrica en energia elèctrica.

Als efectes d'aquesta Instrucció s'entén per <b>«Xarxes de Distribució 
Pública»</b> a les xarxes elèctriques que pertanyen o són explotades 
per empreses l'objectiu principal de les quals és la distribució 
d'energia elèctrica per a la seva venda a tercers. Així mateix, 
s'entén per <b>«Autogenerador»</b> a l'empresa que, subsidiàriament a 
les seves activitats principals, produeix, individualment o en comú, 
l'energia elèctrica destinada en la seva totalitat o en part, a les 
seves necessitats pròpies.

> <b>GUIA TECNICA</b>
> 
> #### PREÀMBUL
> 
> Tot i que l'objectiu de la present instrucció és donar normes 
> generals que apliquin a totes les instal·lacions generadores d'energia 
> elèctrica, a causa de l'auge de les energies renovables en els últims 
> anys, i en particular al de l'energia solar fotovoltaica, amb una gran 
> penetració principalment en les xarxes de mitjana i baixa tensió, s'ha 
> cregut convenient particularitzar en alguns aspectes l'aplicació 
> d'aquesta Guia a aquest tipus d'instal·lacions, sobretot ateses les 
> seves grans perspectives de futur en el *mix* de generació.
> 
> Per tant, es pretenen establir una sèrie de recomanacions per a la 
> connexió a xarxa d'aquesta generació distribuïda, sent necessari 
> definir els assajos i recomanacions normatives que han de complir les 
> parts integrals d'aquests sistemes, i no donar lloc a situacions no 
> contemplades en el disseny d'aquest tipus de generació i la seva forma 
> d'acoblar-se a la xarxa a través de convertidors alterna contínua, 
> tenint sempre en compte aquells possibles problemes que poguessin 
> afectar la seguretat de les persones i dels equips elèctrics.
> 
> No obstant això, l'aplicació d'aquesta guia afecta la resta de 
> tecnologies de generació, atès que estan cobertes per la present ITC.
> 
> El present document aplica a totes les instal·lacions generadores de 
> baixa tensió, tals com:
> 
> - Motors de combustió
> - Turbines
> - Generadors fotovoltaics (FV)
> - Generadors eòlics de BT
> - Acumuladors mecànics o electroquímics
> - Cèl·lules de combustible
> - Altres fonts d'energia en BT
> 
> Pel que fa a la definició d'autogenerador cal entendre que la 
> referència a "empresa" inclou "persona física o jurídica".






## 2. CLASSIFICACIÓ

Les Instal·lacions Generadores es classifiquen, atenent el seu 
funcionament respecte a la Xarxa de Distribució Pública, en:

1. Tipus a) Instal·lacions generadores **aïllades:** aquelles en què 
   no pot existir connexió elèctrica alguna amb la Xarxa de Distribució 
   Pública.

2. Tipus b) Instal·lacions generadores **assistides:** Aquelles en què 
   existeix una connexió amb la Xarxa de Distribució Pública, però 
   sense que els generadors puguin estar treballant en paral·lel amb 
   ella. La font preferent de subministrament podrà ser tant els grups 
   generadors com la Xarxa de Distribució Pública, quedant l'altra 
   font com a socors o suport. Per impedir la connexió simultània 
   d'ambdues, s'han d'instal·lar els corresponents sistemes de 
   commutació. Serà possible no obstant això, la realització de 
   maniobres de transferència de càrrega sense tall, sempre que es 
   compleixin els requisits tècnics descrits en l'apartat 4.2.

3. Instal·lacions generadores **interconnectades:** Aquelles que estan, 
   normalment, treballant en paral·lel amb la Xarxa de Distribució 
   Pública.

> <b>GUIA TECNICA</b>
> 
> De la classificació d'instal·lacions generadores de la present ITC es 
> poden contemplar els següents tipus:
> 
> 1. Tipus a) Les instal·lacions aïllades per a ús exclusiu d'alimentar 
>    càrregues o circuits de baixa tensió.
> 
> 2. Tipus b) Les instal·lacions generadores assistides, per a ús 
>    exclusiu d'alimentació de càrregues o circuits de baixa tensió que 
>    poden estar alternativament alimentats per la xarxa o pel 
>    generador.
> 
> 3. Tipus c) Instal·lacions interconnectades
> 
>     1. Tipus c.1) Les instal·lacions generadores amb punt de connexió 
>        en la xarxa de distribució de baixa tensió en la qual hi ha 
>        altres circuits i instal·lacions de baixa tensió connectats a 
>        ella, independentment que la finalitat de la instal·lació 
>        sigui tant vendre energia com alimentar càrregues, en paral·lel 
>        amb la xarxa.
> 
>     2. Tipus c.2) Les instal·lacions generadores amb punt de connexió 
>        en la xarxa d'alta tensió mitjançant un transformador elevador 
>        de tensió, que no té altres xarxes de distribució de baixa 
>        tensió que alimenten càrregues alienes, connectades a ell. 
>        Aquest esquema, està igualment inclòs en les condicions del 
>        RBT, encara que per la seva consideració d'instal·lació 
>        generadora connectada directament a la xarxa d'AT requereix 
>        condicions especials de connexió, atenent les reglamentacions 
>        vigents sobre proteccions i condicions de connexió en alta 
>        tensió.
> 
> En les instal·lacions de tipus c) quan la xarxa de distribució es 
> desconnecta, es poden alimentar càrregues pròpies sempre que es 
> compleixin les condicions de desconnexió i connexió de la instal·lació 
> generadora a la xarxa de distribució, requerides en el capítol 4 de la 
> ITC-BT-40.
> 
> **Nota:** Sense perjudici del que estableixen les definicions de punt 
> de connexió en altres reglamentacions, als efectes d'aquesta guia 
> s'entén per punt de connexió el punt de la xarxa pública de 
> distribució o transport en què es connecta la instal·lació del 
> titular de la instal·lació generadora. El punt de connexió no 
> necessàriament coincideix amb el punt en què es realitza la mesura 
> d'energia, però sí que és el punt on s'instal·la el primer element 
> (vist des de la xarxa) de les proteccions generals requerides en la 
> instal·lació del titular.

## 3. CONDICIONS GENERALS

Els generadors i les instal·lacions complementàries de les 
instal·lacions generadores, com els dipòsits de combustibles, 
canalitzacions de líquids o gasos, etc., hauran de complir, a més, 
çles disposicions que estableixen els Reglaments i Directives 
específics que els siguin aplicables.

> <b>GUIA TECNICA</b>
> 
> Les instal·lacions elèctriques d'alimentació **fotovoltaiques** 
> s'executaran preferentment segons el que estableix la norma 
> UNE 20460-7-712 en allò que no col·lisioni amb els requisits de les 
> legislacions aplicables.
> 
> Les instal·lacions situades _a la intempèrie_ hauran de complir els 
> _requisits de la ITC-BT-30_.
> 
> En _**edificis o establiments industrials**_ hauran de complir-se 
> les disposicions del Reglament de seguretat contra incendis en els 
> establiments industrials, Reial Decret 2267/2004 i les seves 
> modificacions.
> 
> En el cas de _**locals i edificis per a ús residencial i/o 
> terciari**_ hauran de complir-se les disposicions del Codi Tècnic 
> de l'Edificació, Document Bàsic DB-SI Seguretat en cas d'incendi, 
> Reial Decret 314/2006 i les seves modificacions.

Quan les instal·lacions generadores estiguin allotjades en edificis o 
establiments industrials, els seus locals, que seran d'ús exclusiu, 
compliran amb les disposicions reguladores de protecció contra incendis 
corresponents.

Els locals on estiguin instal·lats els motors tèrmics, qualsevol que 
sigui la seva potència, hauran d'estar suficientment ventilats.

> <b>GUIA TECNICA</b>
> 
> La ventilació ha d'assegurar que no es produeixen acumulacions de 
> substàncies tòxiques en l'ambient ni es generen atmosferes 
> potencialment explosives.

Els conductes de sortida dels gasos de combustió seran de material 
incombustible i evacuaran directament a l'exterior o a través d'un 
sistema d'aprofitament energètic.

> <b>GUIA TECNICA</b>
> 
> En el cas de cèl·lules de combustible i d'acumuladors electroquímics 
> també hauran de considerar-se els requisits de ventilació i els 
> relatius als conductes de sortida dels gasos.
> 
> Atenent l'efecte que sobre la seguretat pot tenir la inclusió de 
> generació en una instal·lació nova o existent, tota instal·lació 
> generadora haurà de ser comunicada a la companyia distribuïdora.
> 
> Serà responsabilitat del titular de la instal·lació generadora la 
> correcta actuació de les proteccions, la vigilància de les condicions 
> de seguretat i de connexió a la xarxa.

> ### 4.A INSTAL·LACIONS DE CONNEXIÓ PER A INSTAL·LACIONS GENERADORES DE TIPUS C1
>
> #### 4.A.1 Definicions
>
> Als efectes del present capítol, es considerarà que les instal·lacions 
> de connexió d'una instal·lació generadora tipus C1 a la xarxa comencen 
> en la caixa general de protecció i acaben en els dispositius generals 
> de comandament i protecció de l'equip generador.
>
> <b>Nota:</b> S'ha de tenir en compte que si l'equip generador 
> incorpora parts que requereixen instal·lació, aquesta haurà de 
> complir els requisits del REBT rellevants.
>
> #### 4.A.2 Parts que constitueixen les instal·lacions de connexió
>
> Estructuralment, seran les mateixes que constitueixen les 
> instal·lacions d'enllaç (ITC-BT-12), i que anomenarem:
>
> - Caixa General de Protecció (CGP)
> - Línia General de connexió (LGC)
> - Interruptor general de maniobra (IGM)
> - Equip de mesura de generació (EMG)
> - Línia Individual del generador (LIG)
> - Interruptor de Control de Potència (ICP)
> - Dispositius de Protecció Interiors (DPI)
> - Equip generador (GEN)
> 
> Depenent del punt físic de connexió de l'equip generador algunes de 
> les parts de la instal·lació generadora citades podran ser comunes 
> amb les pròpies de la instal·lació elèctrica per a consum de 
> càrregues. En qualsevol cas no s'ha de sobrepassar la previsió de 
> càrregues de la instal·lació aigües amunt dels elements comuns.
> 
> Les proteccions corresponents al generador en els esquemes que 
> s'inclouen a continuació podran estar integrades en el mateix,

> L'interruptor de control de potència (ICP) és un dispositiu per 
> controlar que la potència consumida no excedeixi de la contractada.

> Per a generadors que no comparteixin equip de mesura amb la

### 4.1 Instal·lacions generadores aïllades

La connexió als receptors, en les instal·lacions on no pugui donar-se 
la possibilitat de l'acoblament amb la Xarxa de Distribució Pública o 
amb un altre generador, precisarà la instal·lació d'un dispositiu que 
permeti connectar i desconnectar la càrrega en els circuits de sortida 
del generador.

> <b>Borrador</b>
> 
> Aquest dispositiu podrà ser l'IGA de la instal·lació generadora 
> sempre que tingui capacitat de seccionament.

Quan existeixin més d'un generador i la seva connexió exigeixi la 
sincronització, s'haurà de disposar d'un equip manual o automàtic per 
realitzar aquesta operació.

> <b>GUIA TECNICA</b>
> 
> Existeixen equips, com alguns inversors, en què no cal realitzar tal 
> sincronització de forma externa perquè ja incorporen aquesta funció 
> internament. En aquests casos, no serà necessària la instal·lació 
> d'equips addicionals per a aquest fi.

Els generadors portàtils hauran d'incorporar les proteccions generals 
contra sobreintensitats i contactes directes i indirectes necessaris 
per a la instal·lació que alimentin.

> <b>GUIA TECNICA</b>
> 
> Les proteccions incorporades en els generadors portàtils han de ser 
> conformes a:
> 
> | Producte | Norma d'aplicació |
> | :--- | :--- |
> | Interruptors automàtics amb capacitat de seccionament (ús industrial) | UNE-EN 60947-2 |
> | Interruptors diferencials (ús industrial) | UNE-EN 60947-2 |
> | Fusibles | UNE-EN 60269-3 |
> 
> És igualment recomanable que incorporin protecció contra les 
> sobretensions i si escau seran conformes a:
> 
> | Dispositius de protecció contra sobretensions transitòries | UNE-EN 61643-11 |
> | :--- | :--- |
> | Dispositius de protecció contra sobretensions temporals per a ús domèstic i anàleg | UNE-EN 50550 |
> 
> En el cas de les instal·lacions generadores aïllades, les instal·lacions de connexió contenen només els elements de connexió a la instal·lació de consum, ja que els de connexió a la xarxa no existeixen ni per a la instal·lació generadora, ni per a la receptora o de consum, tal com pot veure's en l'esquema següent.
>

### 4.2 Instal·lacions generadores assistides

En la instal·lació interior l'alimentació alternativa (xarxa o 
generador) podrà fer-se en diversos punts que aniran proveïts d'un 
sistema de commutació per a tots els conductors actius i el neutre, que 
impedeixi l'acoblament simultani a ambdues fonts d'alimentació.

Aquesta commutació pot realitzar-se manualment, normalment amb 
enclavament mecànic o interruptors de lleva, o mitjançant commutació 
automàtica, normalment amb enclavament elèctric.

En el cas que estigui previst realitzar maniobres de transferència de 
càrrega sense tall, la connexió de la instal·lació generadora assistida 
amb la Xarxa de Distribució Pública es farà en un punt únic i hauran de 
complir-se els següents requisits:

- Només podran realitzar maniobres de transferència de càrrega sense 
  tall els generadors de potència superior a 100 kVA.
- En el moment d'interconnexió entre el generador i la xarxa de 
  distribució pública, es desconnectarà el neutre del generador de 
  terra.
- El sistema de commutació haurà d'instal·lar-se juntament amb els 
  aparells de mesura de la Xarxa de Distribució pública, amb 
  accessibilitat per a l'empresa distribuïdora.
- S'haurà d'incloure un sistema de protecció que impossibiliti 
  l'enviament de potència del generador a la xarxa.
- S'hauran d'incloure sistemes de protecció per tensió del generador 
  fora de límits, freqüència fora de límits, sobrecàrrega i 
  curtcircuit, enclavament per no poder energitzar la línia sense 
  tensió i protecció per fora de sincronisme.
- Disposarà d'un equip de sincronització i no es podrà mantenir la 
  interconnexió més de 5 segons.

Per evitar els efectes de sobretensió degudes a les commutacions podrà 
ser necessari instal·lar protectors contra sobretensions transitòries, 
adequats a la instal·lació que alimentin.

### 4.3 Instal·lacions interconnectades

La potència màxima de les centrals interconnectades a una Xarxa de 
Distribució Pública estarà condicionada per les característiques 
d'aquesta: tensió de servei, potència de curtcircuit, capacitat de 
transport de línia, potència consumida en la xarxa de baixa tensió, 
etc.

La connexió de la instal·lació generadora no haurà d'afectar el 
funcionament normal de la xarxa ni a la qualitat del subministrament 
dels clients connectats a ella. Tampoc no haurà de produir canvis en la 
filosofia d'explotació, protecció i desenvolupament de la mateixa
El punt de connexió ha de tenir elements que compleixin les funcions de 
tall i aïllament de la xarxa, accessibles, en tot moment a l'empresa 
distribuïdora, a efectes de poder desconnectar la instal·lació 
generadora.

En el cas de les instal·lacions de tipus c2, el punt de connexió
consistirà en un seccionador frontera entre les instal·lacions de
l'autogenerador i les de l'empresa de distribució pública, en les
condicions establertes en la ITC 19 del MIE-RAT (i en cas de connexió a
la xarxa de transport el PO 12.2), amb el seu corresponent equip de
mesura (quan procedeixi) i proteccions segons el que s'indica més
endavant.

Es contemplen aquí una sèrie d'escenaris, en funció del punt de connexió
del generador, i la possibilitat o no d'alimentació d'un consum associat
al productor de la instal·lació de generació, i mantenint sempre la
simetria amb les instal·lacions d'enllaç de la ITC BT 12 i la seva Guia
d'aplicació corresponent.

Els escenaris que es contemplen es refereixen a aspectes de seguretat i
no necessàriament són admissibles per a les condicions que un altre
tipus de legislació estableixi (per exemple les relatives al règim
econòmic).

Es defineix en el context de l'apartat 4.3 el funcionament en **mode
separat** com aquell en què el generador funciona normalment en mode
interconnectat i quan es donen condicions de manca de xarxa pot
alimentar la instal·lació. En els escenaris en què es fa referència a
funcionament en mode separat, la transferència de càrrega es fa amb
tall.

En cas de tenir la possibilitat de funcionament en mode separat i davant
l'eventualitat de la desconnexió de la xarxa, el control del generador
haurà de garantir que primer es desconnecta el generador de la xarxa i
després es posa en mode de funcionament separat, abans de connectar-se a
les càrregues.

Per a la reconnexió a la xarxa, el generador haurà de primer
desconnectar les càrregues, posar-se en mode de funcionament
interconnectat i sincronitzar-se amb la xarxa abans de connectar-s'hi.

Per a instal·lacions generadores que funcionen en mode separat amb
configuració equivalent als tipus IT, TN o TT es requereix que aquestes
disposin del corresponent sistema de protecció contra els xocs elèctrics
establert en la ITC-BT-24. En particular els dispositius de protecció
contra el xoc elèctric instal·lats en la instal·lació fixa han de
garantir el seu funcionament per a qualsevol combinació possible de
fonts d'alimentació.

En cas que el funcionament en mode separat suposi el pas a una
configuració equivalent al mode IT: - Els interruptors diferencials
conformes amb les normes UNE-EN 61008 o UNE-EN 61009 són apropiats per
al seu ús en sistemes IT si se satisfan els requisits d'instal·lació
inclosos en la ITC-BT-24. - Els interruptors diferencials conformes amb
la norma UNE-EN 61947-2 són apropiats per al seu ús en sistemes IT si se
satisfan els requisits d'instal·lació inclosos en la ITC-BT-24. Només en
el cas de diferencials marcats amb el valor de tensió seguit pel símbol
, aquests no s'han d'utilitzar en sistemes IT per a aquesta tensió. -
Els interruptors automàtics conformes amb la norma UNE-EN 60898 són
apropiats per al seu ús en sistemes IT si se satisfan els requisits
d'instal·lació inclosos en la ITC-BT-22 i ITC-BT-24. - Els interruptors
automàtics conformes amb la sèrie de normes UNE-EN 61947 són apropiats
per al seu ús en sistemes IT si se satisfan els requisits d'instal·lació
inclosos en la ITC-BT-22 i ITC-BT-24. Només en el cas d'interruptors
automàtics marcats amb el valor de tensió seguit pel símbol , aquests no
s'han d'utilitzar en sistemes IT per a aquesta tensió. - Per a la
detecció d'un primer defecte d'aïllament és necessària la instal·lació
d'equips de detecció d'aïllament conformes amb la norma UNE-EN 61557-8.

### 4.3.1 Potències màximes de les centrals interconnectades en baixa tensió

Amb caràcter general, la interconnexió de centrals generadores a les 
xarxes de baixa tensió de 3x400/230 V serà admissible quan la suma de 
les potències nominals dels generadors no excedeixi de 100 kVA, ni de 
la meitat de la capacitat de la sortida del centre de transformació 
corresponent a la línia de la Xarxa de Distribució Pública a la qual es 
connecti la central.

En xarxes trifàsiques a 3x220/127 V, es podran connectar centrals de 
potència total no superior a 60 kVA ni de la meitat de la capacitat de 
la sortida del centre de transformació corresponent a la línia de la 
Xarxa de Distribució Pública a la qual es connecti la central. En 
aquests casos tota la instal·lació haurà d'estar preparada per a un 
funcionament futur a 3x400/230 V.
