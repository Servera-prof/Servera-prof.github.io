# Articulat

<b>Article 1. Objecte.</b>

El present Reglament té per objecte establir les condicions tècniques i
garanties que han de reunir les instal·lacions elèctriques connectades a
una font de subministrament en els límits de baixa tensió, amb la
finalitat de:

<ol class="lletres">
    <li>Preservar la seguretat de les persones i els béns.</li>
    <li>Assegurar el normal funcionament d'aquestes instal·lacions i 
    prevenir les pertorbacions en altres instal·lacions i serveis.</li>
    <li>Contribuir a la fiabilitat tècnica i a l'eficiència econòmica 
    de les instal·lacions.</li>
</ol>



<b>Article 2. Camp d'aplicació.</b>

1. El present Reglament s'aplicarà a les instal·lacions que
distribueixin l'energia elèctrica, a les generadores d'electricitat per
a consum propi i a les receptores, en els següents límits de tensions
nominals:
    1. Corrent altern: igual o inferior a 1.000 volts.
    2. Corrent continu: igual o inferior a 1.500 volts.

2. El present Reglament s'aplicarà:
    1. A les noves instal·lacions, a les seves modificacions i a les 
       seves ampliacions.
    2. A les modificacions, reparacions i ampliacions, siguin o no
       d'importància, de les instal·lacions existents abans de la seva 
       entrada en vigor, només en el que afecta a la part modificada, 
       reparada o ampliada, i sempre que es prenguin les mesures 
       necessàries per garantir les condicions de seguretat del conjunt 
       de la instal·lació.
    3. A les instal·lacions existents abans de la seva entrada en vigor, 
       pel que fa al règim d'inspeccions, si bé els criteris tècnics 
       aplicables en aquestes inspeccions seran els corresponents a la 
       reglamentació amb la qual es van aprovar.

> S'entendrà per modificacions o reparacions d'importància, als efectes 
> de la documentació exigible i de l'obligatorietat d'inspecció inicial, 4
> les que afecten a més del 50 per 100 de la potència instal·lada. 
> Igualment es considerarà modificació d'importància la que afecti a 
> línies completes de processos productius amb nous circuits i quadres, 
> encara amb reducció de potència.

3. Així mateix, s'aplicarà a les instal·lacions existents abans de la
seva entrada en vigor, quan el seu estat, situació o característiques
impliquin un risc greu per a les persones o els béns, o es produeixin
pertorbacions importants en el normal funcionament d'altres
instal·lacions, a judici de l'òrgan competent de la Comunitat Autònoma.

4. S'exclouen de l'aplicació d'aquest Reglament les instal·lacions i
equips d'ús exclusiu en mines, material de tracció, automòbils,
vaixells, aeronaus, sistemes de comunicació, i els usos militars i
altres instal·lacions i equips que estiguessin subjectes a reglamentació
específica.

5. Les prescripcions del present Reglament i les seves instruccions
tècniques complementàries (d'ara endavant ITC) són de caràcter general
unes, i específic, altres. Les específiques substituiran, modificaran o
complementaran a les generals, segons els casos.

6. No s'aplicaran les prescripcions generals, sinó únicament
prescripcions específiques, que seran objecte de les corresponents ITC,
a les instal·lacions o equips que utilitzen «molt baixa tensió» (fins a
50 V en corrent altern i fins a 75 V en corrent continu), per exemple
les xarxes informàtiques i similars, sempre que la seva font d'energia
sigui autònoma, no s'alimentin de xarxes destinades a altres
subministraments, o que aquestes instal·lacions siguin absolutament
independents de les xarxes de baixa tensió amb valors per sobre dels
fixats per a aquestes petites tensions.

> Es modifica, amb efectes d'1 de juliol de 2021, l'apartat 2 per l'art.
> 1.1 del Reial Decret 298/2021, de 27 d'abril. Ref. BOE-A-2021-6879
> 
> Tingueu en compte, per a les empreses prèviament habilitades, la
> disposició transitòria única de l'esmentat Reial Decret.

<b>Article 3. Instal·lació elèctrica.</b>

S'entén per instal·lació elèctrica tot conjunt d'aparells i de circuits
associats en previsió d'un fi particular: producció, conversió,
transformació, transmissió, distribució o utilització de l'energia
elèctrica.


<b>Article 4. Classificació de les tensions. Freqüència de les 
xarxes.</b>

1. A efectes d'aplicació de les prescripcions del present Reglament, les
instal·lacions elèctriques de baixa tensió es classifiquen, segons les
tensions nominals que se'ls assignin, en la forma següent:

<table>
    <thead>
        <tr>
            <th></th>
            <th>Corrent altern (Valor eficaç)</th>
            <th>Corrent continu (Valor mitjà aritmètic)</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Molt baixa tensió.</td>
            <td>U<sub>n</sub> &le; 50V</td>
            <td>U<sub>n</sub> &le; 75V</td>
        </tr>
        <tr>
            <td>Tensió usual.</td>
            <td>50 &lt; U<sub>n</sub> &le; 500V</td>
            <td>75 &lt; U<sub>n</sub> &le; 750V</td>
        </tr>
        <tr>
            <td>Tensió especial.</td>
            <td>500 &lt; U<sub>n</sub> &le; 1000V</td>
            <td>750 &lt; U<sub>n</sub> &le; 1500V</td>
        </tr>
    </tbody>
</table>

2. Les tensions nominals usualment utilitzades en les distribucions de
corrent altern seran:
    1. 230 V entre fases per a les xarxes trifàsiques de tres conductors.
    2. 230 V entre fase i neutre, i 400 V entre fases, per a les xarxes
       trifàsiques de 4 conductors.
    3. Quan a les instal·lacions no es pugui utilitzar alguna de les
       tensions normalitzades en aquest Reglament, perquè hagin de 
       connectar-se a o derivar d'una altra instal·lació amb tensió 
       diferent, es condicionarà la seva inscripció al fet que la nova 
       instal·lació pugui ser utilitzada en el futur amb la tensió 
       normalitzada que es pugui preveure.
    4. La freqüència emprada en la xarxa serà de 50 Hz.
    5. Es podran utilitzar altres tensions i freqüències, prèvia
       autorització motivada de l'òrgan competent de l'Administració 
       Pública, quan es justifiqui davant d'ell la seva necessitat, no 
       es produeixin pertorbacions significatives en el funcionament 
       d'altres instal·lacions i no es menyscabi el nivell de seguretat 
       per a les persones i els béns.

<b>Article 5. Pertorbacions a les xarxes.</b>

Les instal·lacions de baixa tensió que poguessin produir pertorbacions
sobre les telecomunicacions, les xarxes de distribució d'energia o els
receptors, hauran d'estar dotades dels adequats dispositius protectors,
segons s'estableix en les disposicions vigents relatives a aquesta
matèria.

<b>Article 6. Equips i materials.</b>

1. Els materials i equips utilitzats en les instal·lacions hauran de ser
   utilitzats en la forma i per a la finalitat que van ser fabricats.
   Els inclosos en el camp d'aplicació de la reglamentació de
   transposició de les Directives de la Unió Europea hauran de complir
   amb el que s'estableix en les mateixes.

En el no cobert per tal reglamentació s'aplicaran els criteris tècnics
preceptuats pel present Reglament. En particular, s'inclouran juntament
amb els equips i materials les indicacions necessàries per a la seva
correcta instal·lació i ús, havent de marcar-se amb les següents
indicacions mínimes:

<ol class="lletres">
    <li>Identificació del fabricant, representant legal o responsable de la comercialització.</li>
    <li>Marca i model.</li>
    <li>Tensió i potència (o intensitat) assignades.</li>
    <li>Qualsevol altra indicació referent a l'ús específic del material o equip, assignat pel fabricant.</li>
</ol>

2. Els òrgans competents de les Comunitats Autònomes verificaran el
   compliment de les exigències tècniques dels materials i equips
   subjectes a aquest Reglament. La verificació podrà efectuar-se per
   mostreig.

<b>Article 7. Coincidència amb altres tensions.</b>

Si en una instal·lació elèctrica de baixa tensió es troben integrats
circuits o elements sotmesos a tensions superiors als límits definits en
aquest Reglament, en absència d'indicació específica en aquest, s'haurà
de complir amb el que s'estableix en els reglaments que regulin les
instal·lacions a aquestes tensions.

<b>Article 8. Xarxes de distribució.</b>

1. Les instal·lacions de servei públic o privat la finalitat de les
   quals sigui la distribució d'energia elèctrica es definiran:
   1. Pels valors de la tensió entre fase o conductor polar i terra i
       entre dos conductors de fase o polars, per a les instal·lacions
       unides directament a terra.
   2. Pel valor de la tensió entre dos conductors de fase o polars, per
       a les instal·lacions no unides directament a terra.

2. Les intensitats del corrent elèctric admissibles en els conductors es
   regularan en funció de les condicions tècniques de les xarxes de
   distribució i dels sistemes de protecció emprats en les mateixes.

<b>Article 9. Instal·lacions d'enllumenat exterior.</b>

Es consideraran instal·lacions d'enllumenat exterior les que tenen per
finalitat la il·luminació de les vies de circulació o comunicació i les
dels espais compresos entre edificacions que, per les seves
característiques o seguretat general, han de romandre il·luminats, en
forma permanent o circumstancial, siguin o no de domini públic.

Les condicions que han de reunir les instal·lacions d'enllumenat
exterior seran les corresponents a la seva peculiar situació
d'intempèrie i, pel risc que suposa, el fet que part dels seus elements
siguin fàcilment accessibles.


<b>Article 10. Tipus de subministrament.</b>

1. A efectes del present Reglament, els subministraments es classifiquen
   en normals i complementaris.

<ol class="majusc">
    <li>
        <b>Subministraments normals</b> són els efectuats a 
        cada abonat per una sola empresa distribuïdora per la totalitat 
        de la potència contractada per aquest i amb un sol punt de 
        lliurament de l'energia.
    </li>
    <li>
        <b>Subministraments complementaris o de seguretat</b> 
        són els que, a efectes de seguretat i continuïtat de 
        subministrament, complementen a un subministrament normal. 
        Aquests subministraments podran realitzar-se per dues empreses 
        diferents o per la mateixa empresa, quan es disposi, en el lloc 
        d'utilització de l'energia, de mitjans de transport i 
        distribució independents, o per l'usuari mitjançant mitjans de 
        producció propis. Es considera subministrament complementari 
        aquell que, encara que parteixi del mateix transformador, 
        disposa de línia de distribució independent del subministrament 
        normal des del seu mateix origen en baixa tensió. Es 
        classifiquen en subministrament de socors, subministrament de 
        reserva i subministrament duplicat:
        <ol type="a">
            <li><b>Subministrament de socors</b> és el que 
            està limitat a una potència receptora mínima equivalent al 
            15 per 100 del total contractat per al subministrament 
            normal.</li>
            <li><b>Subministrament de reserva</b> és el 
            dedicat a mantenir un servei restringit dels elements de 
            funcionament indispensables de la instal·lació receptora, 
            amb una potència mínima del 25 per 100 de la potència total 
            contractada per al subministrament normal.</li>
            <li><b>Subministrament duplicat</b> és el que és 
            capaç de mantenir un servei major del 50 per 100 de la 
            potència total contractada per al subministrament 
            normal.</li>
        </ol>
    </li>
</ol>



2. Les instal·lacions previstes per rebre subministraments
complementaris hauran d'estar dotades dels dispositius necessaris per
impedir un acoblament entre ambdós subministraments, excepte el que es
prescrigui en les instruccions tècniques complementàries. La
instal·lació d'aquests dispositius haurà de realitzar-se d'acord amb la
o les empreses subministradores. De no establir-se aquest acord, l'òrgan
competent de la Comunitat Autònoma resoldrà el que procedeixi en un
termini màxim de 15 dies hàbils, comptats a partir de la data en què li
sigui formulada la consulta.

3. A més dels assenyalats en les corresponents instruccions tècniques
complementàries, els òrgans competents de les Comunitats Autònomes
podran fixar, en cada cas, els establiments industrials o dedicats a
qualsevol altra activitat que, per les seves característiques i
circumstàncies singulars, hagin de disposar de subministrament de
socors, de reserva o subministrament duplicat.

4. Si l'empresa subministradora que ha de facilitar el subministrament
complementari es negués a realitzar-lo o no hi hagués acord amb l'usuari
sobre les condicions tècnico-econòmiques proposades, l'òrgan competent
de la Comunitat Autònoma haurà de resoldre el que procedeixi, en el
termini de quinze dies hàbils, a partir de la data de presentació de la
controvèrsia.

<b>Article 11. Locals de característiques especials.</b>

S'establiran en les corresponents instruccions tècniques complementàries
prescripcions especials, amb base en les condicions particulars que
presenten, en els denominats «locals de característiques especials», com
ara els locals i emplaçaments molls o en què existeixi atmosfera humida,
gasos o pols de matèries no inflamables o combustibles, temperatures
molt elevades o molt baixes en relació amb les normals, els que es
dediquin a la conservació o reparació d'automòbils, els que estiguin
afectes als serveis de producció o distribució d'energia elèctrica; en
les instal·lacions on s'utilitzin les denominades tensions especials,
les que es realitzin amb caràcter provisional o temporal, les
instal·lacions per a piscines, altres assenyalades específicament en les
ITC i, en general, totes aquelles on sigui necessari mantenir
instal·lacions elèctriques en circumstàncies diferents a les que es
poden estimar com de risc normal, per a la utilització de l'energia
elèctrica en baixa tensió.

<b>Article 12. Ordenació de càrregues.</b>

S'establiran en les corresponents instruccions tècniques complementàries
prescripcions relatives a l'ordenació de les càrregues previsibles per a
cadascuna de les agrupacions de consum de característiques semblants,
com ara edificis dedicats principalment a habitatges, edificis
comercials, d'oficines i de tallers per a indústries, basades en la
millor utilització de les instal·lacions de distribució d'energia
elèctrica.

Abans d'iniciar les obres, els titulars d'edificacions en projecte de
construcció hauran de facilitar a l'empresa subministradora tota la
informació necessària per deduir els consums i càrregues que han de
produir-se, a fi de poder adequar amb antelació suficient el creixement
de les seves xarxes i les previsions de càrregues en els seus centres de
transformació.

<b>Article 13. Reserva de local.</b>

Pel que fa a la reserva de local es seguiran les prescripcions
recollides en la reglamentació per la qual es regulen les activitats de
transport, distribució, comercialització, subministrament i procediments
d'autorització d'instal·lacions d'energia elèctrica.

<b>Article 14. Especificacions particulars i Projectes tipus de les
empreses distribuïdores.</b>

1. Les empreses distribuïdores d'energia elèctrica podran proposar
   especificacions particulars sobre la construcció i muntatge
   d'escomeses, línies generals d'alimentació, instal·lacions de
   comptadors i derivacions individuals. Aquestes especificacions seran
   úniques per a tot el territori de distribució de l'empresa
   distribuïdora i recolliran les condicions tècniques de caràcter
   concret que siguin precises per aconseguir una major homogeneïtat en
   la seguretat i el funcionament de les xarxes de distribució i les
   instal·lacions dels consumidors. <br/> <br/> En cap cas aquestes
   especificacions inclouran marques o models d'equips o materials
   concrets que aboquin el consumidor a un únic proveïdor, ni
   prescripcions de tipus administratiu o econòmic, que suposin per al
   titular de la instal·lació privada càrregues addicionals a les
   previstes en aquest reglament, o en una altra normativa que pugui ser
   d'aplicació.<br/> <br/> En tot cas, les especificacions inclouran la
   possibilitat que, davant situacions degudament justificades, prèvia
   acreditació de seguretat equivalent, el titular de la instal·lació
   pugui donar solucions alternatives a situacions concretes en què
   sigui impossible complir els requisits de les especificacions
   aprovades per l'Administració.

2. Aquestes especificacions hauran d'ajustar-se, en qualsevol cas, als
   preceptes del reglament, i previ compliment del procediment
   d'informació pública, hauran de ser aprovades i registrades pels
   òrgans competents de les Comunitats Autònomes, en cas que es limitin
   al seu àmbit territorial, o pel Ministeri d'Indústria, Comerç i
   Turisme, en cas d'aplicar-se en més d'una comunitat autònoma.

3. Una persona tècnica competent de l'empresa distribuïdora d'energia
   elèctrica certificarà que les especificacions particulars compleixen
   totes les exigències tècniques i de seguretat reglamentàriament
   establertes.<br/> <br/> Així mateix, aquestes normes hauran de
   comptar amb un informe tècnic d'un òrgan qualificat i independent que
   certificarà que aquestes especificacions compleixen amb tots els
   requisits de la reglamentació de seguretat aplicable a productes i
   instal·lacions de baixa tensió, que no s'inclouen prescripcions de
   tipus administratiu o econòmic que suposin una càrrega per al titular
   de la instal·lació privada i que tampoc s'inclouen
   sobredimensionaments tècnicament no justificats de la instal·lació,
   excepte aquells derivats de la utilització de les sèries
   normalitzades de materials.

4. Les empreses distribuïdores que vulguin proposar les especificacions
   particulars, a les quals fa referència l'apartat 1, i que no es
   limitin a l'àmbit territorial d'una única Comunitat Autònoma, hauran
   de remetre sol·licitud d'aprovació al Ministeri d'Indústria, Comerç i
   Turisme, acompanyada de la següent documentació:
    1. El text de les especificacions per a les quals se sol·licita
       l'aprovació.
    2. Certificat per persona tècnica competent referit en el punt 3.
    3. Informe tècnic emès per un organisme qualificat, referit en el 
       punt 3.
    Llistat de les Comunitats Autònomes on l'empresa distribuïdora dugui
a terme la seva activitat.

Presentada la sol·licitud per mitjans electrònics, el Ministeri
d'Indústria, Comerç i Turisme realitzarà el tràmit d'informació pública
d'aquesta especificació i sol·licitarà informe a la Comissió Nacional
dels Mercats i la Competència, a l'òrgan competent de les Comunitats
Autònomes en què l'empresa distribuïdora desenvolupi la seva activitat i
a la Secretaria d'Estat d'Energia del Ministeri per a la Transició
Ecològica i el Repte Demogràfic.

Rebuts els informes, o complert el termini marcat en l'article 80 de la
Llei 39/2015, d'1 d'octubre, del Procediment Administratiu Comú per a la
seva emissió, procedirà a la seva aprovació sempre que es garanteixi el
compliment reglamentari, la uniformitat dels requisits en totes les
zones d'implantació de l'empresa de distribució i que no s'adoptin
barreres tècniques que aboquin el consumidor a un únic proveïdor,
publicant-se la resolució corresponent en el «Butlletí Oficial de
l'Estat».

Un cop presentades les especificacions davant el Ministeri d'Indústria,
Comerç i Turisme, juntament amb els documents esmentats, el termini per
a l'aprovació serà de tres mesos, considerant-se el silenci
administratiu com a aprovatori.

5. Les normes així aprovades es publicaran a la pàgina web del Ministeri
d'Indústria, Comerç i Turisme, sense perjudici de la publicitat que les
empreses de distribució facin d'aquestes.

6. En cas de modificació o ampliació d'especificacions ja aprovades,
l'empresa de distribució d'energia elèctrica sol·licitarà aprovació de
l'ampliació o modificació d'aquestes especificacions, seguint el mateix
procediment indicat anteriorment.

7. Igualment les empreses distribuïdores, per a aquelles instal·lacions,
o part de les mateixes, de caràcter repetitiu, propietat de les empreses
distribució d'energia elèctrica i que requereixen projecte d'acord amb
el que s'estableix a la ITC-BT 04, podran proposar projectes tipus per a
la seva aprovació pels òrgans competents de les Comunitats Autònomes, en
cas que es limitin al seu àmbit territorial, o pel Ministeri
d'Indústria, Comerç i Turisme, en cas d'aplicar-se en més d'una
comunitat autònoma. L'aprovació dels projectes tipus seguirà el
procediment descrit en aquest article per a les especificacions
particulars.

Aquests projectes tipus, inclouran les condicions tècniques de caràcter
concret que siguin precises per aconseguir major homogeneïtat en la
seguretat i el funcionament de les instal·lacions de baixa tensió,
respectant els requisits imposats a les especificacions particulars en
aquest article.

En qualsevol cas, els projectes tipus hauran de ser completats,
inexcusablement, amb les dades específiques concernents a cada cas
particular.

Es modifica per l'art. 5.1 del Reial Decret 542/2020, de 26 de maig.
Ref. BOE-A-2020-6472

<b>Article 15. Escomeses i instal·lacions d'enllaç.<b>

1. Es denomina escomesa la part de la instal·lació de la xarxa de
distribució que alimenta la caixa o caixes generals de protecció o
unitat funcional equivalent.

L'escomesa serà responsabilitat de l'empresa subministradora, que
assumirà la inspecció i verificació final.

2. Són instal·lacions d'enllaç les que uneixen la caixa general de
protecció, o caixes generals de protecció, incloses aquestes, amb les
instal·lacions interiors o receptores de l'usuari.

Es componen de: caixa general de protecció, línia general d'alimentació,
elements per a la ubicació de comptadors, derivació individual, caixa
per a interruptor de control de potència i dispositius generals de
comandament i protecció.

Les caixes generals de protecció allotgen elements de protecció de les
línies generals d'alimentació i assenyalen el principi de la propietat
de les instal·lacions dels usuaris.

Línia general d'alimentació és la part de la instal·lació que enllaça
una caixa general de protecció amb les derivacions individuals que
alimenta.

La derivació individual d'un abonat parteix de la línia general
d'alimentació i comprèn els aparells de mesura, comandament i protecció.

3. Les companyies subministradores facilitaran els valors màxims
previsibles de les potències o corrents de curtcircuit de les seves
xarxes de distribució, amb la finalitat que el projectista tingui en
compte aquesta dada en els seus càlculs.

---

<b>Article 16. Instal·lacions interiors o receptores.<b>

1. Les instal·lacions interiors o receptores són les que, alimentades
per una xarxa de distribució o per una font d'energia pròpia, tenen com
a finalitat principal la utilització de l'energia elèctrica. Dins
d'aquest concepte cal incloure qualsevol instal·lació receptora encara
que tota ella o alguna de les seves parts estigui situada a la
intempèrie.

2. En tota instal·lació interior o receptora que es projecti i realitzi
s'assolirà el màxim equilibri en les càrregues que suporten els
diferents conductors que en formen part, i aquesta se subdividirà de
manera que les pertorbacions originades per les avaries que poguessin
produir-se en algun punt d'ella afectin a una mínima part de la
instal·lació. Aquesta subdivisió haurà de permetre també la localització
de les avaries i facilitar el control de l'aïllament de la part de la
instal·lació afectada.

3. Els sistemes de protecció per a les instal·lacions interiors o
receptores per a baixa tensió impediran els efectes de les
sobreintensitats i sobretensions que per diferents causes cal preveure
en les mateixes i resguardaran els seus materials i equips de les
accions i efectes dels agents externs. Així mateix, i a efectes de
seguretat general, es determinaran les condicions que han de complir
aquestes instal·lacions per protegir dels contactes directes i
indirectes.

4. En la utilització de l'energia elèctrica per a instal·lacions
receptores s'adoptaran les mesures de seguretat, tant per a la protecció
dels usuaris com per a la de les xarxes, que resultin proporcionades a
les característiques i potència dels aparells receptors utilitzats en
les mateixes.

5. A més dels preceptes que en virtut del present i altres reglaments
siguin d'aplicació als locals de pública concurrència, hauran de
complir-se mesures i previsions específiques, en funció del risc que
implica en els mateixos un funcionament defectuós de la instal·lació
elèctrica.

---

<b>Article 17. Receptors i posada a terra.<b>

Sense perjudici de les disposicions referents als requisits tècnics de
disseny dels materials elèctrics, segons el que s'estipula a l'article
6, la instal·lació dels receptors, així com el sistema de protecció per
posada a terra, hauran de respectar el que es disposa en les
corresponents instruccions tècniques complementàries.

---

<b>Article 18. Execució i posada en servei de les instal·lacions.<b>

1. Segons el que s'estableix a l'article 12.3 de la Llei 21/1992,
d'Indústria, la posada en servei i utilització de les instal·lacions
elèctriques es condiciona al següent procediment:

a) Haurà d'elaborar-se, prèviament a l'execució, una documentació
tècnica que defineixi les característiques de la instal·lació i que, en
funció de les seves característiques, segons determini la corresponent
ITC, revestirà la forma de projecte o memòria tècnica.

b) La instal·lació haurà de verificar-se per l'instal·lador, amb la
supervisió del director d'obra, en el seu cas, a fi de comprovar la
correcta execució i funcionament segur de la mateixa.

c) Així mateix, quan així es determini en la corresponent ITC, la
instal·lació haurà de ser objecte d'una inspecció inicial per un
organisme de control.

d) A la terminació de la instal·lació i realitzades les verificacions
pertinents i, en el seu cas, la inspecció inicial, l'empresa
instal·ladora executora de la instal·lació emetrà un certificat
d'instal·lació, en el qual es farà constar que la mateixa s'ha realitzat
de conformitat amb el que s'estableix en el Reglament i les seves
instruccions tècniques complementàries i d'acord amb la documentació
tècnica. En el seu cas, identificarà i justificarà les variacions que en
l'execució s'hagin produït en relació amb el previst en aquesta
documentació.

e) El certificat, juntament amb la documentació tècnica i, en el seu
cas, el certificat de direcció d'obra i el d'inspecció inicial, haurà de
dipositar-se davant l'òrgan competent de la Comunitat Autònoma, amb
objecte de registrar l'esmentada instal·lació, rebent les còpies
diligenciades necessàries per a la constància de cada interessat i
sol·licitud de subministrament d'energia. Les Administracions competents
hauran de facilitar que aquestes documentacions puguin ser presentades i
registrades per procediments informàtics o telemàtics.

2. Les instal·lacions elèctriques hauran de ser realitzades únicament
per empreses instal·ladores.

3. L'empresa subministradora no podrà connectar la instal·lació
receptora a la xarxa de distribució si no se li lliura la còpia
corresponent del certificat d'instal·lació degudament diligenciat per
l'òrgan competent de la Comunitat Autònoma.

4. No obstant el que s'indica a l'apartat precedent, quan existeixin
circumstàncies objectives per les quals sigui precís comptar amb
subministrament d'energia elèctrica abans de poder culminar la
tramitació administrativa de les instal·lacions, aquestes
circumstàncies, degudament justificades i acompanyades de les garanties
per al manteniment de la seguretat de les persones i béns i de la no
pertorbació d'altres instal·lacions o equips, hauran de ser exposades
davant l'òrgan competent de la Comunitat Autònoma, la qual podrà
autoritzar, mitjançant resolució motivada, el subministrament
provisional per atendre estrictament aquelles necessitats.

5. En cas d'instal·lacions temporals (congressos i exposicions, amb
diferents estands, fires ambulants, festes, verbena, etc.), l'òrgan
competent de la Comunitat podrà admetre que la tramitació de les
diferents instal·lacions parcials es realitzi de manera conjunta. De la
mateixa manera, podrà acceptar-se que se substitueixi la documentació
tècnica per una declaració, diligenciada la primera vegada per
l'Administració, en el supòsit d'instal·lacions realitzades
sistemàticament de forma repetitiva.

Se substitueix l'expressió "instal·lador/s autoritzat/s" per "empresa/es
instal·ladora/es" segons estableix l'art. 7.1 del Reial Decret 560/2010,
de 7 de maig. Ref. BOE-A-2010-8190

---

<b>Article 19. Informació als usuaris.<b>

Com a annex al certificat d'instal·lació que es lliuri al titular de
qualsevol instal·lació elèctrica, l'empresa instal·ladora haurà de
confeccionar unes instruccions per al correcte ús i manteniment
d'aquesta. Aquestes instruccions inclouran, en qualsevol cas, com a
mínim, un esquema unifilar de la instal·lació amb les característiques
tècniques fonamentals dels equips i materials elèctrics instal·lats,
així com un croquis del seu traçat.

Qualsevol modificació o ampliació requerirà l'elaboració d'un complement
a l'anterior, en la mesura que sigui necessari.

---

<b>Article 20. Manteniment de les instal·lacions.<b>

Els titulars de les instal·lacions hauran de mantenir en bon estat de
funcionament les seves instal·lacions, utilitzant-les d'acord amb les
seves característiques i abstenint-se d'intervenir en les mateixes per
modificar-les. Si són necessàries modificacions, aquestes hauran de ser
efectuades per una empresa instal·ladora.

Se substitueix l'expressió "instal·lador/s autoritzat/s" per "empresa/es
instal·ladora/es" segons estableix l'art. 7.1 del Reial Decret 560/2010,
de 7 de maig. Ref. BOE-A-2010-8190

---

<b>Article 21. Inspeccions.<b>

Sense perjudici de la facultat que, d'acord amb el que s'assenyala a
l'article 14 de la Llei 21/1992, d'Indústria, posseeix l'Administració
pública competent per dur a terme, per si mateixa, les actuacions
d'inspecció i control que estimi necessàries, el compliment de les
disposicions i requisits de seguretat establerts pel present Reglament i
les seves instruccions tècniques complementàries, segons el previst a
l'article 12.3 d'aquesta Llei, haurà de ser comprovat, en el seu cas,
per un organisme de control autoritzat en aquest camp reglamentari.

A aquesta fi, la corresponent instrucció tècnica complementària
determinarà:

a) Les instal·lacions i les modificacions, reparacions o ampliacions
d'instal·lacions que hauran de ser objecte d'inspecció inicial, abans de
la seva posada en servei.

b) Les instal·lacions que hauran de ser objecte d'inspecció periòdica.

c) Els criteris per a la valoració de les inspeccions, així com les
mesures a adoptar com a resultat de les mateixes.

d) Els terminis de les inspeccions periòdiques.

---

<b>Article 22. Empreses instal·ladores.<b>

1. Les instal·lacions elèctriques de baixa tensió s'executaran per
empreses instal·ladores en baixa tensió, que seran aquelles persones
físiques o jurídiques que hagin presentat la declaració responsable
d'inici d'activitat segons s'estableix en la corresponent instrucció
tècnica complementària. Això s'entén sense perjudici del possible
projecte i direcció d'obra per tècnics titulats competents que, en el
seu cas, requereixin les citades instal·lacions.

2. D'acord amb la Llei 21/1992, de 16 de juliol, d'Indústria, la
declaració responsable habilita per temps indefinit a l'empresa
instal·ladora, des del moment de la seva presentació davant
l'Administració competent, per a l'exercici de l'activitat en tot el
territori espanyol, sense que es puguin imposar requisits o condicions
addicionals.

Es modifica per l'art. 7.6 del Reial Decret 560/2010, de 7 de maig. Ref.
BOE-A-2010-8190

---

<b>Article 23. Compliment de les prescripcions.<b>

1. Es considerarà que les instal·lacions realitzades de conformitat amb
les prescripcions del present Reglament proporcionen les condicions de
seguretat que, d'acord amb l'estat de la tècnica, són exigibles, a fi de
preservar les persones i els béns, quan s'utilitzen d'acord amb el seu
destí.

2. Les prescripcions establertes en el present Reglament tindran la
condició de mínims obligatoris, en el sentit del que s'indica a
l'article 12.5 de la Llei 21/1992, d'Indústria.

3. Es consideraran coberts aquests mínims:

a) Per aplicació directa de les prescripcions de les corresponents ITC,
o

b) Per aplicació de tècniques de seguretat equivalents, sent tals les
que, sense ocasionar distorsions en els sistemes de distribució de les
companyies subministradores, proporcionin, almenys, un nivell de
seguretat equiparable a l'anterior. L'aplicació de tècniques de
seguretat equivalents haurà de ser justificada degudament pel
dissenyador de la instal·lació, i aprovada per l'òrgan competent de la
Comunitat Autònoma.

---

<b>Article 24. Excepcions.<b>

Sense perjudici del que s'estableix a l'apartat 1 de l'article 6, quan
sigui materialment impossible complir determinades prescripcions del
present Reglament, sense que sigui factible tampoc acollir-se a
l'apartat 3.b) de l'article anterior, el titular de la instal·lació que
es pretengui realitzar haurà de presentar, davant l'òrgan competent de
la Comunitat Autònoma, prèviament al procediment contemplat a l'article
18, una sol·licitud d'excepció, exposant els motius d'aquesta i indicant
les mesures de seguretat alternatives que es proposin, les quals, en cap
cas, podran rebaixar els nivells de protecció establerts en el
Reglament.

L'esmentat òrgan competent podrà desestimar la sol·licitud, requerir la
modificació de les mesures alternatives o concedir l'autorització
d'excepció, que serà sempre expressa, entenent-se el silenci
administratiu com a desestimatori.

---

<b>Article 25. Reconeixement mutu.<b>

Sense perjudici del que s'indica a l'article 6, es consideraran
conformes amb aquest reglament els productes comercialitzats legalment
en un altre Estat membre de la Unió Europea, a Turquia, o originaris
d'un Estat de l'Associació Europea de Lliure Comerç signatari de l'Acord
sobre l'Espai Econòmic Europeu i comercialitzats legalment en ell,
sempre que garanteixin un nivell equivalent a l'exigit en el present
reglament quant a la seva seguretat i a l'ús al qual estan destinats.
L'aplicació d'aquesta mesura està subjecta al Reglament (UE) núm.
2019/515 del Parlament Europeu i del Consell, de 19 de març de 2019,
relatiu al reconeixement mutu de mercaderies comercialitzades legalment
en un altre Estat membre i pel qual es deroga el Reglament (CE) núm.
764/2008.

Es modifica per l'art. 3 del Reial Decret 145/2023, de 28 de febrer.
Ref. BOE-A-2023-7056

---

<b>Article 26. Normes de referència.<b>

1. Les instruccions tècniques complementàries podran establir
l'aplicació de normes UNE o altres reconegudes internacionalment, de
manera total o parcial, a fi de facilitar l'adaptació a l'estat de la
tècnica en cada moment.

Aquesta referència es realitzarà, per regla general, sense indicar l'any
d'edició de les normes en qüestió. En la corresponent instrucció tècnica
complementària es recollirà el llistat de totes les normes citades en el
text de les instruccions, identificades pels seus títols i numeració, la
qual inclourà l'any d'edició.

2. Quan una o diverses normes variïn el seu any d'edició, o s'editin
modificacions posteriors a les mateixes, hauran de ser objecte
d'actualització en el llistat de normes, mitjançant resolució del centre
directiu competent en matèria de seguretat industrial del Ministeri de
Ciència i Tecnologia, en la qual haurà de fer-se constar la data a
partir de la qual la utilització de la nova edició de la norma serà
vàlida i la data a partir de la qual la utilització de l'antiga edició
de la norma deixarà de ser-ho, a efectes reglamentaris.

A falta de resolució expressa, s'entendrà que també compleix les
condicions reglamentàries l'edició de la norma posterior a la que figuri
en el llistat de normes, sempre que la mateixa no modifiqui criteris
bàsics i es limiti a actualitzar assajos o incrementi la seguretat
intrínseca del material corresponent.

---

<b>Article 27. Accidents.<b>

A efectes estadístics i amb objecte de poder determinar les principals
causes, així com disposar les eventuals correccions en la reglamentació,
s'han de posseir les corresponents dades sistematitzades dels accidents
més significatius. Per a això, quan es produeixi un accident que
ocasioni danys o víctimes, la companyia subministradora haurà de
redactar un informe que reculli els aspectes essencials d'aquest. En els
quinze primers dies de cada trimestre, hauran de remetre a les
Comunitats Autònomes i al centre directiu competent en matèria de
seguretat industrial del Ministeri de Ciència i Tecnologia, còpia de
tots els informes realitzats.

---

<b>Article 28. Infraccions i sancions.<b>

Les infraccions al que es disposa en el present reglament es
classificaran i sancionaran d'acord amb el que es disposa al Títol V de
la Llei 21/1992, d'Indústria.

---

<b>Article 29. Guia tècnica.<b>

El centre directiu competent en matèria de Seguretat Industrial del
Ministeri de Ciència i Tecnologia elaborarà i mantindrà actualitzada una
Guia tècnica, de caràcter no vinculant, per a l'aplicació pràctica de
les previsions del present Reglament i les seves instruccions tècniques
complementàries, la qual podrà establir aclariments a conceptes de
caràcter general inclosos en aquest Reglament.
