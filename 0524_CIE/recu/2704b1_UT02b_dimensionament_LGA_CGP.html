UT02b - Dimensionament LGA i GCP
================================

Dimensiona la CGP, el fusible i la LGA per a una instal·lació amb les 
següents caracterísitiques:

- Tipus de connexió de servei: subterrànea (Alerta!! és la connexió de 
  servei que és subterrània, la LGA anirà per on digui el punt «tipus 
  d'instal·lació»)
- Potència demandada segons ITC-BT-10 120 kW
- Factor de potència 0,8
- Tipus d'instal·lació: Cables sense tub a fals sostre de 37 cm 
  d'altura. Si no saps a quin tipus d'iinstal·lació correspon tria un 
  aleatoriament entre B1 i B2, es descontarà 0,5 punts del total.
- Temperatura ambient 30°C
- Longitud LGA: 15 m.
- Material: Coure
- Tipus de centralització: Centralització única (totalment centralitzat 
  a la Planta Baixa)
- La resta de dades s'han de poder deduir de les prescripcions 
  reglamentaries de les ITCs corresponents o de la NRZ103

**Nota:** Per unificar criteris, si necessites consultar la taula 
d'intensitats de la ITC-BT-19 utilitza la taula de la imatge, en cas 
contrari simplement ignora-la:

![](../img/2026_UT02_recu02.png)


Determina:
----------

- Intensitat demandada I_b _______ A (1 punt)
- Secció de la LGA __________ mm² (1 punt)
- Intensitat màxima admisible per l'LGA a les condicions ambientals 
  reals __________ A(1 punt)
- Calibre fusibles ___________ A (1 punt)
- Intensitat de la CGP aprovada a la NRZ103 _________ A(1 punt)
- Tria un esquema de la CGP aprovat per NRZ103 apte per a 
  muntatge verticali dimensiona el ninxol quedante sempre amb les mides 
  més grosses dels planols de la NRZ103. Pots consultar Industrias 
  Pinazo per les dimensions de les CGP i CS (CS preferentment amples).
    + Referència de la CGP _______ (0,5 punts)
    + Referencia de la CS _______ (0,5 punts)
    + Ample del ninxol ________ (0,5 punts)
    + Alt del ninxol ________ (0,5 punts)
- Tria el cable del catàleg de prysmian i dona la pagina i l'espessor 
  de l'aïllament _________ (1 punt)
