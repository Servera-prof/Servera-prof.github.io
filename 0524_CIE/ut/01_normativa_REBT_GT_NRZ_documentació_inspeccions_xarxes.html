REBT: ITC-BT-06 & ITC-BT-07 Overview (15-Minute Class Summary)
==============================================================

This document provides a concise 15-minute lesson structure on 
**ITC-BT-06** and **ITC-BT-07** from the Spanish Low Voltage 
Electrotechnical Regulations (*REBT*), complete with International 
Phonetic Alphabet (IPA) transcriptions (Received Pronunciation) to 
assist with English pronunciation.


1. ITC-BT-06: Overhead Low-Voltage Networks 
-------------------------------------------




> **IPA Header:** `/ˌaɪ-tiː-siː-biː-tiː-zɪərəʊ-sɪks: ˌəʊvəˈhed 
> ˈləʊ-ˈvəʊltɪdʒ ˈnetwɜːks/` (*Xarxes aèries per a baixa tensió*)

This instruction specifies the technical requirements for low-voltage 
overhead power distribution lines, focusing on safety, mechanical 
strength, and proper clearances.

*ðɪs ɪnˈstrʌkʃn̩ spəˈsɪfaɪz ðə ˈteknɪkl̩ rɪˈkwaɪəmənts fɔː ˈləʊ-ˈvəʊltɪdʒ ˈəʊvəˈhed 
ˈpaʊə ˌdɪstrɪˈbjuːʃn̩ laɪnz, ˈfəʊkəsɪŋ ɒn ˈseɪfti, mɪˈkænɪkl̩ strɛŋθ, ænd ˈprɒpə 
ˈklɪərənsɪz.*



### Key Points

1. **Conductors / *kənˈdʌktəz***
- **Mainly bundled cables (*cables d'un feix / cables trenats*):** 
  Typically aluminium or aluminium alloy with polymeric insulation 
  (e.g., XLPE).
    + /ˈmeɪnli ˈbʌndld ˈkeɪblz: ˈtɪpɪkli ˌæljʊˈmɪnɪəm ɔː ˌæljʊˈmɪnɪəm ˈælɔɪ wɪð 
             ˌpɒlɪˈmerɪk ˌɪnsjʊˈleɪʃn̩/
- **Bare conductors:** Strictly regulated and rarely used in new 
  installations due to safety risks.
    + /beə kənˈdʌktəz ɑː ˈstrɪktli ˈreɡjʊleɪtɪd ænd ˈreəli juːzd ɪn 
      njuː ˌɪnstəˈleɪʃnz djuː tʊ ˈseɪfti rɪsks/

2. **Installation Types / *ˌɪnstəˈleɪʃn̩ taɪps***
- **Fixed to facades (*posats sobre façana*):** Installed directly
  along walls using suitable supports to maintain minimal clearance.
    + /fɪkst tə fəˈsɑːdz: ɪnˈstɔːld dɪˈrektli əˈlɒŋ wɔːlz ˈjuːzɪŋ ˈsjuːtəbl̩ 
      səˈpɔːts tə meɪnˈteɪn ˈmɪnɪməl ˈklɪərəns/
- **Stretched in the air (*tensats a l'aire*):** Suspended between 
  poles or wall-anchors.
    + /stretʃt ɪn ðɪ eə: səˈspendɪd bɪˈtwiːn pəʊlz ɔː wɔːl-ˈæŋkəz/

3. **Safety Clearances / *ˈseɪfti ˈklɪərənsɪz***
- **Ground clearance (*Alçada al sòl*):** Minimum **6 meters** over 
  roads/streets; **5 meters** over non-vehicular areas.
    + /ɡraʊnd ˈklɪərəns: ˈmɪnɪməm sɪks ˈmiːtəz ˈəʊvə rəʊdz; faɪv ˈmiːtəz ˈəʊvə 
      nɒn-vɪˈhɪkjʊlə ˈeərɪəz/
- **Buildings & Structures:** Must maintain minimum distances from 
  windows, balconies, and roofs to prevent accidental contact.
    + /ˈbɪldɪŋz ænd ˈstrʌktʃəz: mʌst meɪnˈteɪn ˈmɪnɪməm ˈdɪstənsɪz frəm ˈwɪndəʊz, 
            ˈbælkəniz, ænd ruːfs tə prɪˈvent ˌæksɪˈdentl̩ ˈkɒntækt/

4. **Mechanical & Structural Safety / *mɪˈkænɪkl̩ ænd ˈstrʌktʃərəl ˈseɪfti***
- Supports and conductors must withstand severe environmental loads, 
  including **wind pressure** and **ice buildup**.
    + /səˈpɔːts ænd kənˈdʌktəz mʌst wɪðˈstænd sɪˈvɪər ɪnˌvaɪrənˈmentl̩ ləʊdz, 
              ɪnˈkluːdɪŋ wɪnd ˈpreʃər ænd aɪs ˈbɪldʌp/

---

2. ITC-BT-07: Underground Low-Voltage Networks
----------------------------------------------
 (*Xarxes subterrànies per a baixa tensió*)

> **IPA Header:** `/ˌaɪ-tiː-siː-biː-tiː-zɪərəʊ-sevən: ˌʌndəˈɡraʊnd 
> ˈləʊ-ˈvəʊltɪdʒ ˈnetwɜːks/`

This instruction covers low-voltage underground distribution lines, 
emphasizing mechanical protection, depth requirements, and segregation 
from other public utilities.

*ðɪs ɪnˈstrʌkʃn̩ ˈkʌvəz ˈləʊ-ˈvəʊltɪdʒ ˌʌndəˈɡraʊnd ˌdɪstrɪˈbjuːʃn̩ laɪnz, ˈemfəsaɪzɪŋ 
mɪˈkænɪkl̩ prəˈtekʃn̩, depθ rɪˈkwaɪəmənts, ænd ˌseɡrɪˈɡeɪʃn̩ frəm ˈʌðə ˈpʌblɪk 
juːˈtɪlɪtiz.*

### Key Points

1. **Conductors / *kənˈdʌktəz***
- Cables with metallic or polymeric insulation (e.g., XLPE, EPR) 
  resistant to humidity, chemical agents, and soil pressure.
    + /ˈkeɪblz wɪð mɪˈtælɪk ɔː ˌpɒlɪˈmerɪk ˌɪnsjʊˈleɪʃn̩ rɪˈzɪstənt tə hjuːˈmɪdəti, 
              ˈkemɪkl̩ ˈeɪdʒənts, ænd sɔɪl ˈpreʃə/
- Copper or aluminium conductors are standard.
    + /ˈkɒpər ɔː ˌæljʊˈmɪnɪəm kənˈdʌktəz ɑː ˈstændəd/

2. **Installation Methods / *ˌɪnstəˈleɪʃn̩ ˈmeθədz***
- **Directly buried (*Directament enterrats*):** Placed on a sand 
  bed to prevent physical damage from sharp stones.
    + /daɪˈrektli ˈberɪd: pleɪst ɒn ə sænd bed tə prɪˈvent ˈfɪzɪkl̩ ˈdæmɪdʒ frəm ʃɑːp stəʊnz/
   * **In ducts or conduits (*En canonades o tubs*):** Facilitates future cable replacement or maintenance without reopening trenches.
     * /ɪn dʌkts ɔː ˈkɒndɪts: fəˈsɪlɪteɪts ˈfjuːtʃə ˈkeɪbl rɪˈpleɪsmənt ɔː ˈmeɪntənəns wɪˈðaʊt riːˈəʊpn̩ɪŋ ˈtrentʃɪz/

3. **Depth & Protection / *depθ ænd prəˈtekʃn̩***
   * **Minimum depth:** **0.7 meters** under sidewalks/pedestrian areas; **0.8 meters** under roadways (*calçades*).
     * /ˈmɪnɪməm depθ: zɪərəʊ point sevən ˈmiːtəz ˈʌndə ˈsaɪdwɔːks; zɪərəʊ point eɪt ˈmiːtəz ˈʌndə ˈrəʊdweɪz/
   * Must feature physical protection and a **warning tape (*cinta de senyalització*)** placed above the cable to alert during future excavations.
     * /mʌst ˈfiːtʃə ˈfɪzɪkl̩ prəˈtekʃn̩ ænd ə ˈwɔːnɪŋ teɪp pleɪst əˈbʌv ðə ˈkeɪbl/

4. **Clearance from Other Utilities / *ˈklɪərəns frəm ˈʌðə juːˈtɪlɪtiz***
   * Strict separation distances are required when crossing or running parallel to water, gas, telecom, or sewer lines.
     * /strɪkt ˌsepəˈreɪʃn̩ ˈdɪstənsɪz ɑː rɪˈkwaɪəd wen ˈkrɒsɪŋ ɔː ˈrʌnɪŋ ˈpærələl tə ˈwɔːtə, ɡæs, ˈtelɪkɒm, ɔː ˈsjuːə laɪnz/

---

## 3. Comparative Matrix / *kəmˈpærətɪv ˈmeɪtrɪks*

| Feature | ITC-BT-06 (Overhead) | ITC-BT-07 (Underground) |
| :--- | :--- | :--- |
| **Primary Risk** | Environmental loads (wind/ice), direct human contact | Mechanical crushing, moisture, accidental excavation |
| **Cable Type** | XLPE insulated bundled cables | Armored/heavy-duty insulated cables |
| **Key Metric** | Height above ground (5m–6m) | Depth below surface (0.7m–0.8m) + Warning tape |
