ITC-BT-07
=========


## 1. Materials
---------------

#### 1.1 Cables
- **Tensió assignada:** Els cables han de ser de tensió assignada no inferior a **0,6/1 kV**.
- **Tipus de conductors:** Solen utilitzar-se conductors **unipolars** (amb aïllament i coberta protectora).
- **Seccions mínimes (vigents):** 
    + Alumini (Al): **16 mm²**
    + Coure (Cu): **6 mm²**
- **Novetat del Borrador:** Es preveu un **augment d'aquestes seccions mínimes** en la pròxima actualització del reglament.
- **Secció del conductor neutre:** Es determinarà segons el nombre de conductors i la secció dels conductors de fase, tal com s'estableix a la següent taula:

**Taula 1. Secció del conductor neutre en xarxes subterrànees de baixa tensió**

| $S_F$      | $S_N$     |
| :--------: | :-------: |
| **S ≤ 16** | $S_F=S_N$ |
| **25**     | 16        |
| **35**     | 16        |
| **50**     | 25        |
| **70**     | 35        |
| **95**     | 50        |
| **120**    | 70        |
| **150**    | 70        |
| **185**    | 95        |
| **240**    | 120       |
| **300**    | 155       |
| **400**    | 185       |

> *Nota:* Per a instal·lacions amb 2 o 3 conductors (monofàsiques o bifàsiques), la secció del neutre serà sempre igual a la de les fases.


#### 1.2 Empalmes i connexions *(Borrador)*
* **Resistència mecànica:** Els empalmes i les connexions han de suportar, com a mínim, un **33% de la càrrega de trencament** del conductor més feble de la unió.
* **Prohibició explícita:** Per a la protecció i estanquitat de les unions subterrànees, **no s'admet l'ús de manicots termoretractables** (*maniguets termorretràctils*), sent obligatori l'ús de sistemes en fred.




2. Execució de les instal·lacions
---------------------------------

### 2.1. Instal·lació de cables aïllats
Com a criteri general de traçat, les canalitzacions discorreran preferentment per terrenys de domini públic, discorrent de forma prioritària sota voreres i de manera paral·lela a referències fixes com façanes i voravies. Els traçats seran com més rectilinis millor; quan sigui estrictament necessari realitzar canvis de direcció, es mantindrà un radi de curvatura no inferior al mínim especificat pel fabricant del cable per evitar danys en l'aïllament. 

Així mateix, caldrà extremar la precaució amb la presència d'altres serveis existents (xarxes de telecomunicacions, gas, aigua, clavegueram, etc.). Abans de procedir a l'obertura de la rasa, serà obligatòria la realització de cales de reconeixement manual per tal de localitzar el traçat exacte d'aquesta infraestructura subterrània i evitar qualsevol tipus d'afectació.

#### 2.1.1. Directament enterrats
Per a aquesta modalitat d'instal·lació, el fons de la rasa s'ha de cobrir amb una capa d'arena netejada i cribrada d'un gruix mínim de 0,05 m, sobre la qual reposaran els conductors. Un cop disposats els cables, es cobriran amb una altra capa d'arena d'almenys 0,10 m per sobre de la seva generatriu superior.

Superposada a la capa superior d'arena, s'hi col·locarà una protecció mecànica (maons, teules de formigó o plaques de plàstic resistent) que cobreixi la totalitat de l'amplada de la canalització. A una distància mínima de 0,20 m per sobre d'aquesta protecció (i com a mínim a 0,10 m de la superfície del terreny), s'hi disposarà una cinta de senyalització groga que adverteixi de la presència del cable elèctric de baixa tensió.

Pel que fa a les profunditats reglamentàries de la rasa (mesurades des de la generatriu inferior del cable fins a la superfície del terreny):
- Sota vorera: 0,60 m.
- Sota calçada: 0,80 m.

> Per a la definició geomètrica i constructiva detallada, es remet a les rases tipus de la norma tècnica NRZ002. Cal destacar que a les Illes Balears aquest tipus d'instal·lació directament enterrada s'utilitza molt rarament (prioritzant-se les canalitzacions entubades per facilitar el manteniment i les reposicions). El seu principal avantatge rau en una millor dissipació tèrmica, la qual cosa permet als cables suportar una intensitat admissible lleugerament superior.

#### 2.1.2. En canalitzacions entubades
En aquest format, els tubs protectors han de tenir un diàmetre nominal mínim de 160 mm. S'estableix com a condició de disseny la col·locació de només un circuit per tub per tal de garantir la facilitat de pas i no penalitzar la capacitat de transport per agrupament.

Les profunditats mínimes de la canalització fins a la generatriu superior del tub seran:
- Sota vorera: 0,60 m.
- Sota calçada: 0,80 m.

Es col·locaran arquetes de registre en tots els canvis de direcció de la canalització i a trams rectilinis a una distància màxima de 40 m entre elles. Finalment, és obligatori procedir al segellat de les entrades i sortides dels tubs a les arquetes mitjançant materials estancs i ignífugs, per evitar l'entrada d'aigua, gasos, fangs o la proliferació de rosegadors.

#### 2.1.3. En galeries
Cal ressaltar que l'ús de galeries per a les xarxes subterràries de baixa tensió (XSBT) no s'utilitza a la via pública de les Illes Balears. La seva aplicació queda restringida exclusivament a instal·lacions privades o d'infraestructures especials, com és el cas de l'àmbit aeroportuari. Les galeries seran d'estructura de formigó armat i es classifiquen en visitables (permeten el pas de persones al seu interior) i registrables (no visitables des de l'interior, amb obertures d'accés des de l'exterior).

##### 2.1.3.1. Galeries visitables

##### Limitació de serveis existents
* Queda estrictament prohibit el pas de conduccions de gas pel mateix interior de la galeria elèctrica.
* S'ha d'evitar la coexistència amb canalitzacions d'aigua. Si la seva presència és inevitable, el conducte d'aigua s'ha de situar sempre per sota de les línies elèctriques i la galeria ha de disposar d'un sistema eficaç de drenatge i desguàs per evacuar possibles pèrdues o filtracions.

##### Condicions generals
* Dimensions: Els passadissos de servei han de tenir una alçada lliure mínima de 2,00 m i una amplada lliure mínima de 0,90 m.
* Ventilació: Es dissenyarà un sistema de ventilació (natural o forçada) capaç d'assegurar un mínim de 6 renovacions d'aire per hora.
* Temperatura: La configuració espacial i el sistema de ventilació han de garantir que la temperatura màxima a l'interior no superi en cap cas els 40 °C.

##### Disposició i identificació dels cables
Els cables es disposaran de manera ordenada sobre safates o suportacions laterals. Tots els circuits estaran degudament identificats de forma indeleble mitjançant plaques o etiquetes indicadores de la línia a la qual pertanyen.

##### Subjecció dels conductors
Els conductors s'han de fixar fermament als seus suports mitjançant brides o colzes resistents a la corrosió, dimensionats per suportar el pes propi dels cables i els esforços mecànics derivats de possibles esforços de curtcircuit.

##### Equipotencialitat de les masses metàl·liques
Tots els elements metallics estructurals de la galeria (safates, suports, armadures accessibles, pantalles, etc.) han d'estar connectats directament a la xarxa de terra general de la galeria per assegurar la protecció contra contactes indirectes i mantenir la seva equipotencialitat.

##### Galeries de longitud superior a 400 metres
Segons el REBT, quan la galeria visitable tingui una longitud superior a 400 m, s'han de complir obligatòriament els següents requisits addicionals de seguretat i evacuació:
* Accessos d'emergència: Disposar d'accessos directes a l'exterior (sortides d'emergència) distants entre si com a màxim 400 m.
* Sectorització contra incendis: Instal·lació de portes tallafocs automàtiques (amb una resistència mínima EI-60 o equivalent segons normativa vigent) per subdividir la galeria en sectors d'incendi independents.
* Sistemes de protecció contra incendis: Detecció automàtica d'incendis, enllumenat d'emergència i d'evacuació independent, així com sistemes d'extinció adequats i punts de connexió d'aigua per als serveis de bombers.
* Control de ventilació d'emergència: Possibilitat de tallat o commutació del sistema de ventilació per evitar la propagació del fum en cas d'incendi (sistema de desfumatge).
