ITC-BT-06
=========

1. məˈtɪəriəlz
--------------

### 1.1. kənˈdʌktəz

kənˈdʌktəz juːzd ɪn ˌoʊvərˈhɛd laɪnz mʌst ˈpraɪmərɪli biː meɪd ɒv **ˈkɒpər** ɔːr **ˌæljəˈmɪniəm** (ɔː ðɛər rɪsˈpɛktɪv ˈælɔɪz). ˈfɜːðərˌmɔːr, ðeɪ mʌst pəˈzɛs **ˈædɪkwət ɪˈlɛktrɪkəl ænd mɪˈkænɪkəl ˌkærəktəˈrɪstɪks** tuː wɪðˈstænd boʊθ ði ænˈtɪsɪpeɪtɪd loʊd ˈkʌrənt ænd ðə mɪˈkænɪkəl ˈstrɛsɪz kɔːzd baɪ wɪnd, sɛlf-weɪt, ænd ˈwɛðərɪŋ ˈækʃən.

#### 1.1.1. ˈɪnsjʊleɪtɪd kənˈdʌktəz
- **ˌɪnsjʊˈleɪʃən ˈlɛvl:** ˈɪnsjʊleɪtɪd kənˈdʌktəz mʌst hæv ə ˈreɪtɪd ˈvoʊltɪʤ ɒv **$0.6/1\text{ kV}$**.
- **ˈmɪnɪməm pəˈmɪtɪd krɒs-ˈsɛkʃənz:**
    + fɔː **ˈkɒpər** kənˈdʌktəz: ðə ˈmɪnɪməm krɒs-ˈsɛkʃən ɪz **$10\text{ mm}^2$**.
    + fɔː **ˌæljəˈmɪniəm** kənˈdʌktəz: ðə ˈmɪnɪməm krɒs-ˈsɛkʃən ɪz **$16\text{ mm}^2$**.

#### 1.1.2. bɛər kənˈdʌktəz
> ⚠️ **ɪmˈpɔːtənt ˈrɛɡjʊlətəri noʊt:** ðə juːs ɒv bɛər kənˈdʌktəz ɪn njuː loʊ-ˈvoʊltɪʤ ˌoʊvərˈhɛd ˌɪnstəˈleɪʃənz **ɪz sɛt tuː ˌdɪsəˈpɪər**, praɪˈɒrɪˌtaɪzɪŋ ðə juːs ɒv ˈbʌndld ˈɪnsjʊleɪtɪd kənˈdʌktər ˈsɪstəmz fɔː ˈseɪfti ˈriːznz ænd tuː rɪˈdjuːs ɪnˌvaɪrənˈmɛntl ˈɪmpækt.



### 1.2. ˈɪnsjʊleɪtəz
> ⚠️ **ɪmˈpɔːtənt ˈrɛɡjʊlətəri noʊt:** ðɪs taɪp ɒv ˌoʊvərˈhɛd ˈruːtɪŋ **wɪl ˌdɪsəˈpɪər frɒm ˈkʌrənt ˌrɛɡjʊˈleɪʃənz**, rɪˈmeɪnɪŋ rɪsˈtrɪktɪd ɔː dɪsˈjuːzd ɪn ˈfeɪvər ɒv ˈmɒdərn ˈɪnsjʊleɪtɪd ˈkeɪbl ˈsɪstəmz.



### 1.3. ˈfɑːsnɪŋ ænd kəˈnɛkʃən ækˈsɛsərɪz
ɔːl ækˈsɛsərɪz juːzd fɔː sɪˈkjʊərɪŋ, səˈspɛndɪŋ, ænd ˈsplaɪsɪŋ kənˈdʌktəz (sʌʧ æz **streɪn klæmps, hʊks, ˈtɜːnˌbʌklz, taɪz, ænd kəˈnɛktəz**) mʌst biː meɪd ɒv kəˈroʊʒən-rɪˈzɪstənt məˈtɪərɪəl ɔː hæv ˈsjuːtəbl prəˈtɛktɪv ˈtriːtmənt.



### 1.4. səˈpɔːts (poʊlz)
səˈpɔːts (poʊlz) juːzd ɪn ˌoʊvərˈhɛd laɪnz kæn biː meɪd ɒv ˈvɛərɪəs məˈtɪərɪəlz dɪˈpɛndɪŋ ɒn mɪˈkænɪkəl rɪˈkwaɪəmənts, ði ɪnˈvaɪrənmənt, ænd laɪn ˌkærəktəˈrɪstɪks:
- **mɪˈtælɪk** (ˈɡælvənaɪzd stiːl ɔː roʊld ˈsɛkʃənz).
- **ˈkɒŋkriːt** (ˌriːɪnˈfɔːst ɔː ˌpriːˈstrɛst).
- **ˈwʊdn** (ˈtriːtɪd əˈɡɛnst ˈmɔɪsʧər ænd wʊd-ˈbɔːrɪŋ pɛsts).
- **ˈplæstɪk ɔː kəmˈpɒzɪt məˈtɪərɪəlz** (sʌʧ æz ɡlɑːs-ˈfaɪbər ˌriːɪnˈfɔːst ˌpɒlɪˈɛstər).



### 1.5. steɪ ˈwaɪəz ænd strʌts
- **ˌdɛfɪˈnɪʃən:**
    + **steɪ ˈwaɪəz:** ðiːz ɑːr ˈkeɪblz ɔː rɒdz ˈwɜːkɪŋ ɪn ˈtɛnʃən tuː ˌɒfˈsɛt ˌʌnˈbælənst ˈstrɛsɪz æt dɛd-ɛnd, ˈæŋɡl, ɔːr ˈæŋkərɪʤ poʊlz.
    + **strʌts:** ðiːz ɑːr ˈrɪʤɪd ˈstrʌkʧərəl ˈɛlɪmənts ˈwɜːkɪŋ ɪn kəmˈprɛʃən tuː ˈsteɪbɪlaɪz ðə səˈpɔːt.
+ **ˈjuːzɪʤ kraɪˈtɪərɪə:** **ðɛər juːs ʃʊd biː əˈvɔɪdɪd wɛnˈɛvər ˈpɒsəbl**, dɪˈzaɪnɪŋ ðə laɪn ænd sɪˈlɛktɪŋ əˈproʊprɪət səˈpɔːts (wɪð ˈhaɪər mɪˈkænɪkəl strɛŋθ) soʊ æz nɒt tuː dɪˈpɛnd ɒn ðiːz əˈdɪʃənl ˌriːɪnˈfɔːsɪŋ ˈɛlɪmənts.





2. mɪˈkænɪkəl ˌkælkjʊˈleɪʃən
----------------------------

### 2.1. ˈækʃənz tuː kənˈsɪdər ɪn ˌkælkjʊˈleɪʃənz

#### 2.1.1. ˈpɜːmənənt loʊdz
ˈvɜːtɪkəl ˈfɔːsɪz kɔːzd baɪ ðə sɛlf-weɪt ɒv kənˈdʌktəz, səˈpɔːt ˈkeɪblz, ˈɪnsjʊleɪtəz, ænd ˈʌðər ˌɪnstəˈleɪʃən ækˈsɛsərɪz ʃæl biː kənˈsɪdəd æz ˈpɜːmənənt loʊdz ɪn mɪˈkænɪkəl ˌkælkjʊˈleɪʃənz.


#### 2.1.2. wɪnd ˈfɔːsɪz
ə wɪnd spiːd ɒv $120\text{ km/h}$ ˈæktɪŋ ˌhɒrɪˈzɒntəli ʃæl biː kənˈsɪdəd. ðə wɪnd ˈoʊvərloʊdz ˈæplɪkəbl tuː ɪksˈpoʊzd ˈsɜːfɪsɪz ɑːr ˈsʌməraɪzd ɪn ðə ˈfɒloʊɪŋ ˈteɪbl:

| ˈɛlɪmənt ɔː ˈsɜːfɪs | wɪnd ˈoʊvərloʊd |
| :--- | :--- |
| **flæt mɪˈkænɪkəl ˈsɜːfɪsɪz** | $100\text{ daN/m}^2$ |
| **sɪˈlɪndrɪkəl ˈsɜːfɪsɪz ɒv səˈpɔːts** | $70\text{ daN/m}^2$ |
| **kənˈdʌktəz ænd kənˈdʌktər ˈbʌndlz** | $50\text{ daN/m}^2$ |

> ℹ️ **ɪkˈsɛpʃən:** wɪnd ˈfɔːsɪz niːd nɒt biː kənˈsɪdəd wɛn ðə wɪnd kæn ˈoʊnli ækt ˌlɒnʤɪˈtjuːdɪnl-i əˈlɒŋ ðə laɪn (iː.ʤiː., ɪn ˈnæroʊ striːts ɔː bɪˈtwiːn tɔːl ˈbɪldɪŋz).


#### 2.1.3. aɪs ˈoʊvərloʊdz
dɪˈpɛndɪŋ ɒn ðə ˌʤiːəˈɡræfɪkəl ˈæltɪtjuːd zoʊn ɒv ðə ˌɪnstəˈleɪʃən, aɪs ˈoʊvərloʊdz ɒn kənˈdʌktəz ɑːr dɪˈtɜːmɪnd æz ˈfɒloʊz:

- **zoʊn eɪ** ($\lt 500\text{ m}$ ˈæltɪtjuːd): noʊ aɪs ˈoʊvərloʊd niːdz tuː biː kənˈsɪdəd.
- **zoʊn biː** ($500\text{ m}$ tuː $1000\text{ m}$ ˈæltɪtjuːd): ˈoʊvərloʊd ɒv $0.06 \sqrt{d}\text{ daN/m}$.
- **zoʊn siː** ($\gt 1000\text{ m}$ ˈæltɪtjuːd): ˈoʊvərloʊd ɒv $0.12 \sqrt{d}\text{ daN/m}$.

*wɛər $d$ ˌrɛprɪˈzɛnts ðə daɪˈæmɪtər ɒv ðə ˈsɜːkl ˌsɜːkəmˈskraɪbɪŋ ðə kənˈdʌktər ˈbʌndl (ɪn $\text{mm}$).*



### 2.2. kənˈdʌktəz

#### 2.2.1. ˈmæksɪməm əˈlaʊəbl ˈtɛnʃən
ðə ˈmæksɪməm ˈwɜːkɪŋ ˈtɛnʃən ɒv ðə kənˈdʌktər ($T_{\text{max}}$) ˈʌndər ðə moʊst ʌnˈfeɪvərəbl haɪˈpɒθɪsɪs ʃæl nɒt ɪkˈsiːd ɪts ˈbreɪkɪŋ loʊd dɪˈvaɪdɪd baɪ ə ˈseɪfti ˈfæktər, ˌsætɪsˈfaɪɪŋ ðə kənˈdɪʃən:
$$T_{\text{max}} \le \frac{T_{\text{breaking}}}{2.5}$$

#### 2.2.2. ˈʧɛkɪŋ fɔː vaɪˈbreɪʃənl fɪˈnɒmɪnə
ɪn ˈʤɛnərəl, fɔː loʊ-ˈvoʊltɪʤ ˌoʊvərˈhɛd laɪnz, **ə spəˈsɪfɪk ˈstʌdi ɒv vaɪˈbreɪʃənl fɪˈnɒmɪnə ɪz nɒt rɪˈkwaɪəd**, æz ðə mɪˈkænɪkəl ˌkærəktəˈrɪstɪks ɒv ˈbʌndld ˈɪnsjʊleɪtɪd ˈkeɪblz ænd laɪn ʤiːˈɒmɪtri ˈdræstɪkli rɪˈdjuːs ðɛər ˈɪmpækt.

#### 2.2.3. ˈmæksɪməm sæɡ
ˈmæksɪməm sæɡ ʃæl biː ˌkælkjʊˈleɪtɪd kənˈsɪdərɪŋ ðə haɪˈpɒθɪsɪs ɒv ˈmæksɪməm ɪksˈpɛktɪd kənˈdʌktər ˈtɛmprəʧər ($50^\circ\text{C}$ ɔː ðæt dɪˈraɪvd frɒm ʃɔːt-ˈsɜːkɪt ˈkʌrənt) ɔː ðə haɪˈpɒθɪsɪs ɒv aɪs ˈoʊvərloʊd wɪˈðaʊt wɪnd.




### 2.3. səˈpɔːts

səˈpɔːts ʃæl biː saɪzd tuː wɪðˈstænd ˌkɒmbɪˈneɪʃənz ɒv ˈvɜːtɪkəl, ˈtrænzvɜːs, ænd ˌlɒnʤɪˈtjuːdɪnl mɪˈkænɪkəl ˈstrɛsɪz əˈkɔːdɪŋ tuː ðɛər ˈfʌŋkʃən ɪn ðə laɪn.


#### 2.3.1. ˌkælkjʊˈleɪʃən ɒv ən əˈlaɪnmənt səˈpɔːt
ən əˈlaɪnmənt səˈpɔːt mʌst wɪðˈstænd ðə ˈtrænzvɜːs wɪnd ˈfɔːsɪz ˈæktɪŋ ɒn kənˈdʌktəz ænd ðə səˈpɔːt ɪtˈsɛlf, æz wɛl æz ˈvɜːtɪkəl loʊdz.

- **njuːˈmɛrɪkəl ɪɡˈzɑːmpl:**
  ə səˈpɔːt rɪˈsiːvz ə ˌhɒrɪˈzɒntəl wɪnd fɔːs ɒn ðə kənˈdʌktər ˈbʌndl $F_{\text{wind, cond}} = 80\text{ daN}$ ˈæplaɪd æt haɪt $h = 9\text{ m}$, ænd wɪnd ɒn ðə səˈpɔːt ˈʤɛnəreɪts $F_{\text{wind, sup}} = 30\text{ daN}$ ˈæplaɪd æt ˈmɪdpoɪnt $h_{\text{mid}} = 4.5\text{ m}$.
  
  ðə ˈtoʊtl ˌoʊvərˈtɜːnɪŋ ˈmoʊmənt ɪz:
  $$M = (F_{\text{wind, cond}} \cdot h) + (F_{\text{wind, sup}} \cdot h_{\text{mid}})$$
  $$M = (80\text{ daN} \cdot 9\text{ m}) + (30\text{ daN} \cdot 4.5\text{ m}) = 720 + 135 = 855\text{ daN}\cdot\text{m}$$
  
  ˈæplaɪɪŋ ə ˈseɪfti ˈfæktər ɒv $c = 1.5$, ðə səˈpɔːt mʌst wɪðˈstænd ə ˈmoʊmənt ɒv æt liːst:
  $$M_{\text{design}} = 855 \cdot 1.5 = 1282.5\text{ daN}\cdot\text{m}$$


#### 2.3.2. ˌkælkjʊˈleɪʃən ɒv ən ˈæŋɡl səˈpɔːt
wɛn ə laɪn ˈʧeɪnʤɪz dɪˈrɛkʃən baɪ ən ˈæŋɡl $\alpha$, ə rɪˈzʌltənt fɔːs əˈpɪəz əˈlɒŋ ðə baɪˈsɛktər djuː tuː kənˈdʌktər ˈtɛnʃən ($T$).

- **njuːˈmɛrɪkəl ɪɡˈzɑːmpl:**
  ə ˈbʌndl hæz ə ˈtɛnʃən $T = 400\text{ daN}$ pɜː saɪd ænd ə laɪn ˌdiːvɪˈeɪʃən ˈæŋɡl ɒv $\alpha = 30^\circ$.
  
  ðə rɪˈzʌltənt ˈtrænzvɜːs fɔːs djuː tuː kənˈdʌktər ˈtɛnʃən ɪz:
  $$F_R = 2 \cdot T \cdot \sin\left(\frac{\alpha}{2}\right) = 2 \cdot 400 \cdot \sin(15^\circ) = 800 \cdot 0.2588 = 207.04\text{ daN}$$
  ðə wɪnd ɪˈfɛkt ɒn kənˈdʌktəz əˈlɒŋ ðə baɪˈsɛktər dɪˈrɛkʃən mʌst biː ˈædɪd tuː ðɪs fɔːs.


#### 2.3.3. ˌkælkjʊˈleɪʃən ɒv ə ˈʤʌŋkʃən/brɑːnʧ səˈpɔːt
æt ə səˈpɔːt wɛər ˈdɪfrənt laɪnz kənˈvɜːʤ (brɑːnʧ ɔː ˈʤʌŋkʃən), ðə rɪˈzʌltənt ˌhɒrɪˈzɒntəl fɔːs ɪz ðə ˈvɛktər sʌm ɒv ðə ˈtɛnʃənz ɒv ɔːl kənˈvɜːʤɪŋ laɪnz ($T_1, T_2, T_3, \dots$) plʌs ðə ˌkɒrɪsˈpɒndɪŋ wɪnd ˈækʃənz.


#### 2.3.4. ˌkælkjʊˈleɪʃən ɒv ə dɛd-ɛnd səˈpɔːt (ˈæŋkərɪʤ)
ə dɛd-ɛnd səˈpɔːt mʌst wɪðˈstænd ðə fʊl ˌjuːnɪˈpoʊlər laɪn ˈtɛnʃən ɪn ðə ˌlɒnʤɪˈtjuːdɪnl dɪˈrɛkʃən.

- **njuːˈmɛrɪkəl ɪɡˈzɑːmpl:**
  ə laɪn ˈtɜːmɪneɪts æt ə səˈpɔːt wɪð ə kənˈdʌktər ˈbʌndl ɪɡˈzɜːtɪŋ ə ˈtoʊtl ˈtɛnʃən $T = 600\text{ daN}$ æt haɪt $h = 8\text{ m}$.
  
  ðə ˈbɛndɪŋ ˈmoʊmənt æt ðə beɪs ɪz:
  $$M = T \cdot h = 600\text{ daN} \cdot 8\text{ m} = 4800\text{ daN}\cdot\text{m}$$
  
  wɪð ə ˈseɪfti ˈfæktər ɒv $c = 2$, ə səˈpɔːt mʌst biː sɪˈlɛktɪd ðæt kæn wɪðˈstænd ə ˈwɜːkɪŋ fɔːs æt ɪts tɒp ɒv:
  $$F_{\text{working}} = T \cdot c = 600 \cdot 2 = 1200\text{ daN}$$
  




3. ˌɪnstəˈleɪʃən ˌɛksɪˈkjuːʃən
------------------------------

### 3.1. ˌɪnstəˈleɪʃən ɒv ˈɪnsjʊleɪtɪd kənˈdʌktəz
ˈɪnsjʊleɪtɪd kənˈdʌktəz juːzd ɪn ˌəʊvəˈhɛd ˈnɛtwɜːks mʌst hæv ə ˈreɪtɪd ˈvəʊltɪʤ ɒv nɒt lɛs ðæn 0.6/1 keɪ-viː. ðiːz ˌɪnstəˈleɪʃənz kæn biː ˈkæriːd aʊt ɪn tuː meɪn fɔːmz: ˈsɜːfɪs-ˈmaʊntɪd ɔː strɛʧt.

#### 3.1.1. ˈsɜːfɪs-ˈmaʊntɪd (dɪˈrɛktli ɒn fəˈsɑːd ɔː ˈstrʌkʧə)
- **ˈmɪnɪməm haɪt:** mʌst biː ɪnˈstɔːld æt ə ˈmɪnɪməm haɪt ɒv 2.5 ɛm əˈbʌv ðə graʊnd.
- **prəˈtɛkʃən:** ɪf ləʊˈkeɪtɪd æt ə haɪt bɪˈləʊ 2.5 ɛm, ðeɪ mʌst hæv əˈdɪʃənl mɪˈkænɪkl prəˈtɛkʃən əˈɡɛnst ˈɪmpækts.
- **ˈpɑːsɪŋ θruː ˈəʊpnɪŋz:** ˈpɑːsɪŋ ˈsɜːfɪs-ˈmaʊntɪd kənˈdʌktəz ɪn frʌnt ɒv ˈəʊpnɪŋz (ˈwɪndəʊz, ˈbælkəniz, dɔːz, ɛtˈsɛtərə) ɪz prəˈhɪbɪtɪd.
- **ˈɛmpti ˈspeɪsɪz:** ɪn keɪs ɒv ˈkrɒsɪŋ ˈɛmpti ˈspeɪsɪz bɪˈtwiːn ˈstrʌkʧəz ɔː ˈbɪldɪŋz, ðə ˌɪnstəˈleɪʃən ɪz kənˈsɪdəd ænd ˈɛksɪkjuːtɪd æz strɛʧt.

**ˈteɪbl ɒv ˈmɪnɪməm ˈklɪərəns ˈdɪstənsɪz tuː fəˈsɑːd ˈɛlɪmənts ænd mɪˈtælɪk ˈstrʌkʧəz:**

| fəˈsɑːd ˈɛlɪmənt / ˈstrʌkʧə | ˈmɪnɪməm ˌsɛpəˈreɪʃən ˈdɪstəns |
| :------------------------- | :-------------------------: |
| ˈwɪndəʊz (ˈʤɛnərəl ˈəʊpnɪŋz) | 30 cm frɒm ˈʌpə freɪm <br/> 50 cm frɒm saɪd ɔː ˈbɒtəm |
| ˈbælkəniz ænd ˈtɛrəsɪz | 30 cm frɒm tɒp <br/> 100 cm frɒm saɪdz |
| mɪˈtælɪk ˈɛlɪmənts | 0.05 m |


#### 3.1.2. strɛʧt (ˌəʊvəˈhɛd spænz)
- **ˈmɛsɪnʤə ˈnjuːtrəl:** ðə ˈnɛtwɜːk ɪz ˈnɔːməli səˈpɔːtɪd baɪ ə kənˈdʌktər ˈæktɪŋ æz ə mɪˈkænɪkl ænd ɪˈlɛktrɪkl ˈkærɪə (ˈmɛsɪnʤə ˈnjuːtrəl).
- **ˈmɪnɪməm graʊnd ˈklɪərəns:** ðə ˈmɪnɪməm ˈdɪstəns ɒv kənˈdʌktəz tuː ðə graʊnd ɪn ðə məʊst ʌnˈfeɪvərəbl pəˈzɪʃən mʌst biː 4 m.
- **ˈæbsəns ɒv ˈmɛsɪnʤə ˈnjuːtrəl:** ɪf ðə kənˈdʌktə ˈbʌndl dʌz nɒt hæv æn ˈɪntɪɡreɪtɪd ˈmɛsɪnʤə ˈnjuːtrəl, ɪnˈstɔːlɪŋ æn ˌɪndɪˈpɛndənt ˈɡælvənaɪzd stiːl ˈmɛsɪnʤə waɪə tuː səˈpɔːt mɪˈkænɪkl strɛs ɪz mænˈdətəri.



### 3.2. beə kənˈdʌktəz
> **nəʊt:** ðə juːs ɒv beə kənˈdʌktəz ɪn ləʊ-ˈvəʊltɪʤ ˌəʊvəˈhɛd ˈnɛtwɜːks hæz fɔːlən ˈɪntuː dɪsˈjuːs ænd **ɪz nɒt juːzd** ɪn njuː ˌɪnstəˈleɪʃənz.


### 3.3. ʤɔɪnts ænd brɑːnʧ kəˈnɛkʃənz
- **ˈʤɔɪntɪŋ ˈmɛθədz:** ɪksˈkluːsɪvli ˈsjuːtəbl kəmˈprɛʃən sliːvz mʌst biː juːzd. ˈmeɪkɪŋ ʤɔɪnts baɪ dɪˈrɛkt ˈtwɪstɪŋ bɪˈtwiːn kənˈdʌktəz ɔː baɪ ˈsəʊldərɪŋ ɪz ˈstrɪktli prəˈhɪbɪtɪd.
- **mɪˈkænɪkl strɛŋθ:** ʤɔɪnts mʌst wɪðˈstænd æt liːst **90% ɒv ðə ˈbreɪkɪŋ ləʊd** ɒv ðə kənˈdʌktə.
- **ˈwɔːtətaɪtnəs:** mʌst biː kəmˈpliːtli ˈwɔːtəpruːf ænd nɒt əˈlaʊ ˈwɔːtər ɔː ˈmɔɪsʧə ˌpɛnɪˈtreɪʃən ˈɪntuː ði ˌɪnsjʊˈleɪʃən.
- **brɑːnʧ kəˈnɛkʃənz:** ɔːl lɑɪn ˈbrɑːnʧɪz mʌst ˈɔːlweɪz biː meɪd æt pɔɪnts kləʊs tuː mɪˈkænɪkl səˈpɔːts.


### 3.4. ˈmɪnɪməm ˈsɛkʃən ɒv ðə ˈnjuːtrəl kənˈdʌktə
ðə krɒs-ˈsɛkʃən ɒv ðə ˈnjuːtrəl kənˈdʌktə mʌst biː sɪˈlɛktɪd beɪst ɒn ðə feɪz kənˈdʌktəz krɒs-ˈsɛkʃən ænd ðə məˈtɪərɪəl juːzd.

| S_F | S_N(Al) | S_N(Alm) |
| :-: | :-----: | :------: |
| 25  | 25 Al   | 29.5 Alm |
| 50  | 50 Al   | 54.6 Alm |
| 95  | 50 Al   | 54.6 Alm |
| 150 | 95 Al   | 80 Alm   |


### 3.5. aɪˌdɛntɪfɪˈkeɪʃən ɒv ðə ˈnjuːtrəl kənˈdʌktə
ðə ˈnjuːtrəl kənˈdʌktə mʌst biː klɪəli **ˌdɪfəˈrɛnʃɪəbli aɪˈdɛntɪfaɪd** ðruːˈaʊt ði ɪnˈtaɪər ˌɪnstəˈleɪʃən.

### 3.6. kənˈtɪnjʊɪti ɒv ðə ˈnjuːtrəl kənˈdʌktə
- **ˌɪntəˈrʌpʃən prəˈhɪbɪʃən:** ðə ˈnjuːtrəl kənˈdʌktə mʌst ˈnɛvər biː ˌɪntəˈrʌptɪd ˌɪndɪˈpɛndəntli.
- **pəˈmɪtɪd ɪkˈsɛpʃənz:**
  1. baɪ miːnz ɒv **ɔːl-pəʊl ˈswɪʧɪŋ**.
  2. baɪ miːnz ɒv **rɪˈmuːvəbl lɪŋks**, prəˈvaɪdɪd ðæt **feɪzɪz ɑː dɪskəˈnɛktɪd fɜːst**.


### 3.7. ˈɜːθɪŋ (ˈɡraʊndɪŋ)
- **trænsˈfɔːmər ˈsʌbˌsteɪʃən:** ðə ˈnjuːtrəl kənˈdʌktə kəˈnɛkts dɪˈrɛktli tuː ɡraʊnd.
- **TT ˈsɪstəm:** ðə ˈnjuːtrəl kənˈdʌktə mʌst biː ˈɡraʊndɪd əˈɡɛn æt liːst **ˈɛvri 500 ˈmiːtəz**.


### 3.8. ˌɪnstəˈleɪʃən ɒv səˈpɔːts
- **ˈkɒŋkriːt səˈpɔːts:** fɪkst juːzɪŋ ˌmɒnəˈlɪθɪk faʊnˈdeɪʃənz.
- **mɪˈtælɪk səˈpɔːts:** ˈæŋkəd tuː ˌʌndəˈɡraʊnd ˈkɒŋkriːt blɒks juːzɪŋ **ˈæŋkə bəʊlts**.
- **ˈwʊdn səˈpɔːts:** pleɪst dɪˈrɛktli ˈɪntuː ðə ɡraʊnd. ɪf ˈæŋkəd tuː ə ˈkɒŋkriːt blɒk, ðeɪ mʌst biː ˈsɛpəreɪtɪd æt liːst **15 cm**.


### 3.9. ˈkrɒsɪŋz ænd ˈpærəlɛlɪzmz
(mɪnɪməm ˈseɪfti ˈklɪərəns ˈdɪstənsɪz)







4. ˈmæksɪməm ədˈmɪsəbl ˈkʌrənts fɔː kənˈdʌktəz
----------------------------------------------

tuː ɪnˈʃʊər ˈseɪfti ænd prɪˈvɛnt ˌəʊvəˈhiːtɪŋ ɒv ˈɪnsjʊleɪtɪd kənˈdʌktəz ɪn ləʊ-ˈvəʊltɪʤ ˌəʊvəˈhɛd laɪnz, ðə ˈmæksɪməm ədˈmɪsəbl ˈkʌrənt mʌst biː dɪˈtɜːmɪnd beɪst ɒn ˌɪnsjʊˈleɪʃən taɪp, ˈbʌndl əˈreɪnʤmənt, ænd ɪnˌvaɪərənˈmɛntl kənˈdɪʃənz.



### 4.1. ˈʤɛnərəl ˈprɪnsəplz
kənˈdʌktəz juːzd ɪn ləʊ-ˈvəʊltɪʤ ˌəʊvəˈhɛd ˈnɛtwɜːks mʌst hæv ə ˈreɪtɪd ˈvəʊltɪʤ ɒv 0.6/1 keɪ-viː ænd krɒs-lɪŋkt ˌpɒliˈɛθɪliːn (ɛks-ɛl-piː-iː) ˌɪnsjʊˈleɪʃən. ðə ˈmæksɪməm ədˈmɪsəbl kənˈtɪnjʊəs ˈɒpəreɪtɪŋ ˈtɛmprəʧər fɔː ðɪs taɪp ɒv ˌɪnsjʊˈleɪʃən ɪz 90 °C.



### 4.2. ˈbʌndld ˈkeɪblɪŋ ɪn ˈvɪzəbl ˈhiːlɪks
ˈkʌrənt-ˈkærɪɪŋ kəˈpæsɪti ɪz dɪˈtɜːmɪnd baɪ kənˈdʌktə taɪp, ˈnɒmɪnl krɒs-ˈsɛkʃən, ˌvɛntɪˈleɪʃən kənˈdɪʃənz, ænd ɪnˌvaɪərənˈmɛntl ɪksˈpəʊʒə.


#### 4.2.1. ˈmæksɪməm ˈkʌrənt
ˈmæksɪməm ədˈmɪsəbl ˈkʌrənts ɑː dɪˈfaɪnd fɔː ˈstændəd ˌɪnstəˈleɪʃən kənˈdɪʃənz sɛt aʊt ɪn ˈrɛfrəns ˈstændəd UNE 211435. ðiːz kənˈdɪʃənz əˈsjuːm æn ˈæmbɪənt ˈtɛmprəʧər ɒv 40 °C ænd ˈmɒdərət ɪksˈpəʊʒə tuː ˈsəʊlə ˌreɪdɪˈeɪʃən.


##### kənˈdʌktə ˈbʌndlz wɪð ˈmɛsɪnʤə ˈnjuːtrəl
fɔː ˈtwɪstɪd ˈbʌndl kənˈdʌktəz ɪn ˈvɪzəbl ˈhiːlɪks kəmˈpraɪzɪŋ əˈljuːmɪnəm feɪz kənˈdʌktəz ænd æn əˈljuːmɪnəm ˈælɔɪ ˈmɛsɪnʤə ˈnjuːtrəl, ˈmæksɪməm ədˈmɪsəbl kənˈtɪnjʊəs ˈɒpəreɪtɪŋ ˈkʌrənts ɑː:



##### kənˈdʌktə ˈbʌndlz wɪðˈaʊt ˈmɛsɪnʤə ˈnjuːtrəl (sɛlf-səˈpɔːtɪŋ)
fɔː kənˈdʌktə ˈbʌndlz wɪðˈaʊt ə ˈmɛsɪnʤə ˈnjuːtrəl, ˈmæksɪməm kənˈtɪnjʊəs ˈkʌrənts ɑː:


| **kənˈstrʌkʃən** | **prəˈtɛktɪd frɒm ðə sʌn** | **ɪksˈpəʊzd tuː ðə sʌn** |
| :--------------: | :------------------------: | :--------------------: |
| 1 x 25 Al/54.6 Alm | 105 | 95 |
| 1 x 50 Al/54.6 Alm | 160 | 145 |
| 3 x 25 Al/29.5 Alm | 90 | 76 |
| 3 x 25 Al/54.6 Alm | 90 | 76 |
| 3 x 50 Al/29.5 Alm | 135 | 115 |
| 3 x 50 Al/54.6 Alm | 135 | 115 |
| 3 x 95 Al/54.6 Alm | 215 | 185 |
| 3 x 150 Al/80 Alm | 300 | 250 |



#### 4.2.2. kəˈrɛkʃən ˈfæktəz
wɛn ˈæktʃʊəl ˌɪnstəˈleɪʃən kənˈdɪʃənz ˈdɪfər frɒm ˈrɛfrəns kənˈdɪʃənz, kəˈrɛkʃən ˈfæktəz frɒm ˈstændəd UNE 211435-11 mʌst biː əˈplaɪd.


##### dɪˈrɛkt ˈsəʊlə ɪksˈpəʊʒə ˈfæktə
ɪf ˈkeɪblz ɑː dɪˈrɛktli ɪksˈpəʊzd tuː ɪnˈtɛns ˈsəʊlə ˌreɪdɪˈeɪʃən, ə kəˈrɛkʃən ˈfæktə ɒv 0.90 mʌst biː əˈplaɪd.


##### ˈkeɪbl ˈɡruːpɪŋ
wɛn ˈmʌltɪpl kənˈdʌktə ˈbʌndlz ɑːr ɪnˈstɔːld ɪn ˈpærəlɛl ɒn ðə seɪm səˈpɔːt ɔː wɔːl ˈsɜːfɪs, ðə ˈɡruːpɪŋ kəˈrɛkʃən ˈfæktə əˈplaɪz:

| ˈnʌmbər ɒv ˈbʌndlz | kəˈrɛkʃən ˈfæktə ($F_a$) |
| :---------------: | :-----------------------: |
| 1 | 1.00 |
| 2 | 0.89 |
| 3 | 0.80 |
| 4 ɔː mɔː | 0.75 |

> **ˈpræktɪkl nəʊt:** ɪn ləʊ-ˈvəʊltɪʤ ˌəʊvəˈhɛd ˈnɛtwɜːks, ˈɡruːpɪŋ ˈfæktəz ɑː **ˈreəli əˈplaɪd**, æz iːʧ səˈpɔːt ˈtɪpɪkəli ˈkærɪz ˈəʊnli ə ˈsɪŋɡl meɪn ˌdɪstrɪˈbjuːʃən ˈbʌndl.


##### ˈæmbɪənt ˈtɛmprəʧə ˈʌðə ðæn 40 °C
fɔː ˈæmbɪənt ˈtɛmprəʧəz ˈdɪfərɪŋ frɒm ðə ˈrɛfrəns ˈtɛmprəʧər (40 °C), ðiːz kəˈrɛkʃən kəʊɪˈfɪʃənts mʌst biː əˈplaɪd:

| ˈæmbɪənt ˈtɛmprəʧə (°C) | kəˈrɛkʃən ˈfæktə ($F_t$) |
| :--------------------: | :----------------------: |
| 20 | 1.18 |
| 25 | 1.14 |
| 30 | 1.10 |
| 35 | 1.05 |
| **40** | **1.00** |
| 45 | 0.95 |
| 50 | 0.89 |



#### 4.2.3. ˈmæksɪməm ʃɔːt-ˈsɜːkɪt ˈkʌrənts
ðə ˈmæksɪməm ədˈmɪsəbl ʃɔːt-ˈsɜːkɪt ˈkʌrənt ($I_{cc}$) ɪz ðə ˈkʌrənt ˈvæljuː ðæt ə kənˈdʌktə kæn wɪðˈstænd fɔː 1 s wɪðˈaʊt ɪkˈsiːdɪŋ 250 °C.

### 4.3. beə kənˈdʌktəz
> **nəʊt:** spɛsɪfɪˈkeɪʃənz ænd ˈkʌrənt ˈteɪblz fɔː beə kənˈdʌktəz **ɑː nəʊ ˈlɒŋɡə ˈnɛsɪsəri**, æz ðeə juːs ɪz prəˈhɪbɪtɪd.



### 4.4. ˈʌðər ˌɪnstəˈleɪʃən taɪps
> **nəʊt:** ˈʌðər ˌɪnstəˈleɪʃən ˈmɛθədz ɑː **ˈreəli juːzd** ɪn ˌəʊvəˈhɛd el-viː ˈnɛtwɜːk ˈpræktɪs; ɪf rɪˈkwaɪəd, kənˈsʌlt REBT.
