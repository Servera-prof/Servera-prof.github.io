ITC-BT-18
=========



1. Objecte
----------

La posada a terra:

- Limita tensió de contacte
- Assegura l'actuació de les proteccions
- Elimina o disminueix el risc de les avaries



2. Definició
------------

Unió directa (sense fusibles ni interruptors) entre part de la 
instalació i elèctrodes enterrats.



3. Unions a terra
-----------------

Els materials han de:
- Mantenir el valor de la unió al llarg del temps
- Les solicitacions èrmicas, mecàniques i elèctriques, han de ser 
  estables i suficients
- Les influències externes no han d'afectar
- Contemplar riscos d'electròlisis que puguin afectar a altres parts.

Els electrodes poden ser, tubs, pletines, anells, armadures de formigó,
etc.
Si s'empleen conductors han de ser de classe 2 (rígids, formats per
varis filferros trenats).
Profunditat sempre superior a 0,5 m.

**Alerta:** No es poden emplear canalitzacions d'altres serveis.
