REBT: ITC-BT-06 & ITC-BT-07 Overview (15-Minute Class Summary)
==============================================================

1. ITC-BT-06: Overhead Low-Voltage Networks
-------------------------------------------

This instruction specifies the technical requirements for low-voltage
overhead power distribution lines, focusing on safety, mechanical
strength, and proper clearances.


### Key Points

1. **Conductors**

    - **Mainly bundled cables (*cables d'un feix / cables trenats*):**
      Typically aluminium or aluminium alloy with polymeric insulation
      (e.g., XLPE).
    - **Bare conductors:** Strictly regulated and rarely used in new
      installations due to safety risks.

2. **Installation Types**
    - **Fixed to facades (*posats sobre façana*):** Installed directly
      along walls using suitable supports to maintain minimal clearance.
    - **Stretched in the air (*tensats a l'aire*):** Suspended between
      poles or wall-anchors.

3. **Safety Clearances**
    - **Ground clearance (*Alçada al sòl*):** Minimum **6 meters** over
      roads/streets; **5 meters** over non-vehicular areas.
    - **Buildings & Structures:** Must maintain minimum distances from
      windows, balconies, and roofs to prevent accidental contact.

4. **Mechanical & Structural Safety**
    - Supports and conductors must withstand severe environmental loads,
      including **wind pressure** and **ice buildup**.




2. ITC-BT-07: Underground Low-Voltage Networks
----------------------------------------------

This instruction covers low-voltage underground distribution lines,
emphasizing mechanical protection, depth requirements, and segregation
from other public utilities.


### Key Points

1. **Conductors**
    - Cables with metallic or polymeric insulation (e.g., XLPE, EPR)
      resistant to humidity, chemical agents, and soil pressure.
    - Copper or aluminium conductors are standard.

2. **Installation Methods**
    - **Directly buried (*Directament enterrats*):** Placed on a sand
      bed to prevent physical damage from sharp stones.
    - **In ducts or conduits (*En canonades o tubs*):** Facilitates 
      future cable replacement or maintenance without reopening 
      trenches.

3. **Depth & Protection**
    - **Minimum depth:** **0.7 meters** under sidewalks/pedestrian 
      areas; **0.8 meters** under roadways (*calçades*).
    - Must feature physical protection and a **warning tape (*cinta de 
      senyalització*)** placed above the cable to alert during future 
      excavations.

4. **Clearance from Other Utilities**
    - Strict separation distances are required when crossing or running 
      parallel to water, gas, telecom, or sewer lines.
