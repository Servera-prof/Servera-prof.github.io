UT02a - Previsió de càrrega
===========================

**1.** Dimensiona la següent DI, per a un habitatge amb:
- un IGA de 32 A
- pots suposar cosφ = 1
- entre la CC i l'IGA hi ha 18 m
- el sistema d'instal·lació és: tubs en superfície.
- vols utilitzar conductor de 450/750 V, si és possible, només en
  cas contrari utilitzaràs conductor de 0,6/1 kV
- la temperatura ambient màxima prevista és de 40 °C i no hi ha
  agrupació de conductors
- l'habitatge no té LGA


> 1. Potència de l'habitatge: _____ kW
> 2. Intensitat màxima qua admet el conductor en les condicions 
>    REALS: _____ A
> 3. Caiguda de tensió màxima admesa per aquesta instal·lacio: _____ V
> 4. Caiguda de tensió que tindrà la instal·lació: _____ V
> 5. Secció escollida: _____ mm²
> 6. Diàmetre nominal exterior del tub: _______ mm
> 7. Diàmetre del conductor si el fabricant és Prysmian: _______ mm
> 8. Referència del fabricant (Tupersa) del tub: ________

> Cada resposta correcta val 1 punt, excepte la 5 i la 6 que en valen 2.
> Només s'admeten respostes en les que el resultat i el procediment 
> siguin correctes.
