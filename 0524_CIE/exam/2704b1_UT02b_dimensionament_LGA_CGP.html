UT02b - Dimensionament LGA i GCP
================================

Dimensiona la CGP, el fusible i la LGA per a una instal·lació amb les 
següents caracterísitiques:

- Tipus de connexió de servei: subterrànea (Alerta!! és la connexió de 
  servei que és subterrània, la LGA anirà per on digui el punt «tipus 
  d'instal·lació»)
- Potència demandada segons ITC-BT-10 114 kW
- Factor de potència 0,8
- Tipus d'instal·lació: Cables sense tub a fals sostre de 30 cm 
  d'altura. Si no saps a quin tipus d'iinstal·lació correspon tria un 
  aleatoriament entre B1 i B2, es descontarà 0,5 punts del total.
- Temperatura ambient 30°C
- Longitud LGA: 17 m.
- Material: Coure
- Tipus de centralització: Centralització única (totalment centralitzat 
  a la Planta BAixa)
- La resta de dades s'han de poder deduir de les prescripcions 
  reglamentaries de les ITCs corresponents o de la NRZ103




Determina:
----------

- Intensitat demandada I_b (1 punt)
- Secció de la LGA (1 punt)
- Intensitat màxima admisible per l'LGA a les condicions ambientals 
  reals (1 punt)
- Calibre fusibles (1 punt)
- Intensitat de la CGP aprovada per defecte a la NRZ103 (1 punt)
- Tria un esquema de la CGP aprovat per NRZ103 i dimensiona el ninxol 
  quedante sempre amb les mides més grosses dels planols de la NRZ103. 
  Pots consultar Industrias Pinazo per les dimensions de les CGP i CS 
  (preferentment amples).
    + Referència de la CGP (0,5 punts)
    + Referencia de la CS (0,5 punts)
    + Ample del ninxol (0,5 punts)
    + Alt del ninxol (0,5 punts)
- Tria el cable del catàleg de prysmian i dona la pagina i l'espessor 
  de l'aïllament (1 punt)
