Examen - Dimensionament ninxol CS+GCP
=====================================

Dimensiona el ninxol d'una CGP-9-250, sempre amb les mides més amples
de la guia de la NRZ103. Pots consultar Industrias Pinazo per les 
dimensions de les CGP i CS (ampla).




Determina:
----------

- Referència de la CGP (0,5 punts)
- Referencia de la CS (0,5 punts)
- Ample del ninxol (0,5 punts)
- Alt del ninxol (0,5 punts)
