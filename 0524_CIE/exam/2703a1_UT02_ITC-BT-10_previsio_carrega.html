UT03 - Recuperació instal·lacions d'enllaç
==========================================

**1.** Calcula la Previsió de potències d’un edifici 
destinat principalment a habitatges a on:

- Hi ha 20 habitatges, 7 habitatges del qual són d’electrificació 
  elevada.
- Hi ha 3 locals comercials (planta baixa):
    + La cafeteria té una superfície de 90 m² i necessita per a dur a 
      terme la seva activitat com a mínim 11 kW.
    + La merceria té una superfície de 230 m² i necessita 
      2451 W per a dur a terme la seva activitat.
    + L’oficina d’enginyeria de energies renovables té una 
      superfície de 21 m², necessita 2100 W per a dur a terme la seva 
      activitat.
- Les zones comunes són de 100 m² dels quals 30 m² pertanyen a l'escala
  i volen posar llum LED. A més té unes màquines comunitàries de 3,5 kW. 
- L'aparcament te 2 plantes amb 810 m² cada planta.

> Potència prevista habitatges: _____ kW
> Potència prevista locals comercials: _____ kW
> Potència prevista zones comunes: _____ kW
> Potència prevista garatge: _____ kW
> Potència prevista total: _____ kW
> **Nota:** Potser falten una o més potències, per indicar. Que no les 
> demani l'examen no vol dir que no s'hagin de calcular.
> Cada resposta correcta val 2 punts.
