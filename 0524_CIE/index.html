0524 Configuració d'instal·lacions elèctriques
==============================================

1. Coneixements previs
----------------------

El disseny del present mòdul no requereix més coneixement prèvis que els
obtinguts a ESO. Tanmateix, l'alumne agrairà tenir competència en:

- Matemàtiques
- Ortografia
- Redacció de documents
- Mecanografia
- Dibuix tècnic

Al llarg del curs, si es determina convenient, es penjaràn aquí o a la
[pàgina general](../index.html), materials de suport i repàs.
