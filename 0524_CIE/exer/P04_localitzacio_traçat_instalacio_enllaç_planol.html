P03 - Localització o traçat d'una instal·lació d'enllaç
=======================================================

És l'hora de començar a situar els diversos elements de la instal·lació
d'enllaç. Dins del que marca la normativa, per aquest exercici,
s'haurà de triar la sol·lució que menys afecti al disseny original,
però alhora que no requereixi autoritzacions pèvies ni acords amb
EDE.

1. Fés el planol detall del nínxol de la CGP i CS o CDU i CPM, etc.
   Pensa, que si després els càlculs t'indiquen una altra cosa hauras
   de modificar-ho així que prent'ho com una primera aproximació.
   Per altra banda, busca plànols dels elements que necessitis.
   Si fa falta utilitza l'eina de conversio de pdf de AutoCAD
2. Situa la CGP o CDU a un lloc que compleixi norma. Comprova que el 
   nínxol, capiga al lloc triat, sense que es vegi afectat per elements 
   arquitectònics, pensa que el ninxol té unes portes que s'han de 
   poder obrir.
3. Fes el plànol detallat dels comptadors. Utilitza també blocs o
   plànols que et pugui proporcionar el fabricant. Recorda guardar
   els espais de reserva, dibuixals en una altra capa.
2. Situa la CPM, armari de comptadors, local o locals al lloc a on
   compleixi normativa. Si arquitectura no l'ha previst, o el lloc 
   previst no compleix normativa. O la compleix però necessita
   autorització d'EDE, hauràs de crear un espai adient.
3. Traça una a LGA, el recorregut ha de ser adequat a normativa.
4. Traça totes les DI, el recorregut ha de ser adequat a normativa.
