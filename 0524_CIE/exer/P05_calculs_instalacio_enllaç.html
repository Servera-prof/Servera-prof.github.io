P04 - Dimensionament d'una instal·lació d'enllaç
================================================

Una vegada situats tots els elements de la instal·lació d'enllaç l'hem
de dimensionar.

1. Calcula la LGA i els fusibles
2. Comprova la LGA.
3. Calcula **totes** les D.I., per això és útil el full de càlcul.
4. Arribats aquí hem fet tota aquesta tasca de manera artesanal.
   Seria interessant automatitzar-ho en un full de càlcul únic (es farà
   al pròxim exercici).
