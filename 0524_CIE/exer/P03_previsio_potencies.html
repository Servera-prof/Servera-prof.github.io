P03 - Previsió de potències
===========================

Fes la previsió de potències, per a fer-ho necessitaras saber els metres
quadrats de cada local i habitatges, així com si els habitatges hauran
de ser d'electrificació bàsica o elevada.

1. Crea una capa que es digui superficies.
2. Fes una polilinia a aquesta capa que al seu interior contingui cada
   habitatge, pots incloure els envants. Ara a propietats podras veure
   l'àrea d'aquesta figura.
3. Els habitatges que tinguin menys de 160 m² encara no poden ser
   descartats com d'electrificació elevada. Busca si compleixen
   alguna de les condicions que obliguen a electrificació elevada.
   Ves especialment alerta amb els endolls del circuit C<sub>6</sub>
4. La resta de càlculs és el procediment de la ITC-BT-10 que ja 
   coneixes.
