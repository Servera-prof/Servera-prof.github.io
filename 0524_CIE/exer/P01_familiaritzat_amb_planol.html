P01 - Familiaritzar-se amb el plànol d'arquitectura
===================================================

Abans de començar descarregat el plànol d'arquitectura de l'apartat de 
projectes i obri'l. Mira'l breument i continua llegint aquest enunciat.

Sovint els plànols no tenen una estructura rígida i ben definida, ni uns
colors comuns. Cada estudi fa la feina, dins del que marca la normativa,
però amb el seu estil.

Per altra banda, cada edifici és diferent. Una bona manera de
familiaritzar-se amb el plànol és anar fent-se preguntes, i intentant
imaginar-se com realment és l'edifici.

Per començar podries intentar veure que representa cada una de les
vistes, també pots intentar recorrer-lo com si fossis un habitant del 
mateix. També es pot anar pensant en els llocs que utilitzaries per la
teva instal·lació. Es pot seguir amb tantes preguntes com es vulgui,
té diposit d'aigua?, te balcó?, l'edifici te forma de prisma o té
retranquejos verticals?, pots identificar totes les finestres de
l'alçat a la planta, etc.

Com més preguntes intentis respondre, millor coneixeràs l'edifici.
Per començar per que no proves a respondre les següents preguntes:

1. Per on s'entra a l'edifici?
2. Si aparques al parquing, pots identificar el primer escaló per
   pujar a la PB?
3. Han reservat espai per als comptadors?
4. Quants habitatges té?
