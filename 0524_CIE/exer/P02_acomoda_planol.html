P02 - Acomodació del plànol d'arquitectura
==========================================

Normalment els plànols que s'ens fan arribar des d'arquitectura estan
adaptats a les necessitats dels qui els varen desenvolupar. Aquestes,
no obstant, no tenen per que coincidir amb les nostres i de fet, sovint
no ho fan. Per tant, abans de començar cal adaptar el plànol.

El primer que cal veure es que hi ha dos tipus de capes: les que
necessitem i les que no. Una vegada ens quedem amb les capes que 
necessitem, en general són molt nombroses i ens són indiferents.
Per exemple a vegades es diferencia el tancament amb els envans 
(_tabiques_ en castellà). Clarament, per les nostres necessitats, és
més còmode unificar aquestes dues capes en una de color gris anomenada
«PARETS». 

Ara bé, el mobiliari ens pot interesssar conservar-lo en una
capa diferent, ja que és útil coneixer la disposició de taules per
a la col·locació dels punts de llum, per exemple.

L'exercici busca que:
1. Elimina totes les capes innecessaries (textos, cotes, etc.)
2. Crea entre 3 i 5 capes (quantitat orientativa) segons el teu estil
   de feina (PARETS, MOBILIARI, VEGETACIÓ, ALTRES)
    + A parets estaran les parets del tancament tèrmic de l'edifici
      els envans, les finestres, etc.
    + A mobiliari, taules, cadires, dutxes, sanitaris, armaris, etc.
    + A vegetació plantes ornamentals, gespa, etc.
    + Altres tot allò que no entra en aquestes classificacions però ens
      pot ser útil a l'hora d'evitar ocupar un mateix espai com
      ventilacions o tubs. També es pot incloure elements que ens puguin
      ser útils, com la modulació de les rajoles.
3. Canvia els objectes de les capes originals a les capes que has creat,
   a vegades hauras d'explotar els objectes i tornar a crear-los per a
   poder desfer-te d'una capa
4. Crea un nou arxiu amb un caixetí adequat al projecte.
5. Copia el dibuix que has preparat. Si la feina està ben feta, només
   hauries de tenir les capes que has creat, en cas contrari toca tornar
   a revisar l'anterior dibuix.
6. Revisa els objectes del dibuix, només hauries de tenir els que tu
   mateix has tret i tornat a crear.
7. Finalment comprova que les mesures dels planols són coherents amb
   algunes de les unitats del SI, en cas contrari escala el dibuix.
