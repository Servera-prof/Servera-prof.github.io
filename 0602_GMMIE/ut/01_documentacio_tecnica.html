Documentació tècnica i normativa d'aplicació
============================================

Índex
-----

+ Parts del projecte
+ Memòria descriptiva
	- Normativa
+ Plànols
	- Escala
	- Simbologia
	- Codificació
	- Eines informàtiques
+ Plec de prescripcions tècniques
+ Pressupost
+ Annexes
+ Certificacions d'obra



Parts del projecte
------------------

El projecte tècnic és la sèrie de documents tècnics que inclouen completament la informació indispensable per a construir una òptima obra. Principalment, els documents tècnics que componen el projecte tècnic són quatre: La memòria tècnica, els plànols, el pressupost econòmic i el plec de condicions. És important que aquests quatre estiguin redactats en un llenguatge tècnic normalitzat, ja que d'aquesta manera a qualsevol persona li resultaran fàcil de comprendre. 

El projecte es compon de:

+ Memòria
+ Plànols
+ Plec de prescripcions
+ Pressupost i amidaments
+ Annexes (tot i que també es poden considerar part de la memòria)
+ Estudis amb entitat pròpia (com l'Estudi de Seguretat i Salut)
+ Portades i altres



Memòria
-------

La memòria és el document central del projecte, en ell s'indica quin problema s'ha de resoldre i la solució adoptada, a part de algunes dades i fulls de caire general.

No hi ha una normativa general, si que algúns reglaments o ordenances condicionen la mateixa. Prenent com a referència la UNE 157001 (que no és d'obligat compliment), podríem establir una estructura general:

+ **Objecte:** on s'esposa de manera breu quin és el problema que es vol resoldre.
+ **Abast:** un dels punts més importants i defineix fins a on arriba el projecte. És a dir quina obra o instal·lació estem projectant i a quines àrees afecta.
+ **Antecedents** Explica com ha arribat l'encàrrec i les particularitat que hagi expressat el client. L'estat previ tant físic com administratiu de la construcció o instal·lació
+ **Normativa de referència** Normativa d'aplicació directa així com a documents de referència (a vegades anomenats també de reconegut prestigi).
+ **Definicions i abreviatures:** Per fer el projecte comprensible a persones diferents del projectista aquelles definicions de paraules tècniques o ambigüitats així com a les abreviatures, s'han d'incloure en aquest apartat.
+  **Requisits de disseny:** quins condicionaments tenim (administratius, tècnics, econòmics, exigits pel client).
+  **Anàlisis comparatiu de diferents sol·lucions:** De les sol·lucions més raonables quina és la escollida i per què
+  **Resultats finals/Solució adoptada:** Definició de la solució adoptada, sense detalls pròpis del plec de condicions o dels annexes de càlcul. Por estar subdividida en tants d'apartats com es cregui convenient. o bé consituir punts independents sense englobar-los a un únic punt.

### Normativa

Existeixen organismes e institucions que creen normatives i recomanacions per facilitar i estandarditzar els productes i serveis. Podem anomenar les normes:

+ ISO: _International Organitzation for Standaritzation_ Són normes internacionals destaquen les ISO 9000 (de la qual la 9001 és la més coneguda), o la ISO 14000 però n'hi ha de tots els àmbits ISO 9899 (llenguatge C)
+ UNE: _Una Norma Española_ creades per AENOR (n'hi ha més de 32.000)
+ DIN_ _Deutsches Institut für Normung_, DIN46377 (carril DIN)
+ IEC: _International Electrotechnical Commission_
+ EN: _European Norm_ Elaborat pel CEN. Trobem per exemple la norma del tallatge de roba EN 13402. CENELEC és qui elabora les EN o transposa les ISO, DIN, UNE, per exemple la EN 50022 transposa el carril DIN abans anomenat.
+ IEEE: _Institute of Electrical and Electronics Engineers_ d'origen estatunidenc, té més de 400.000 membres dels quals la meitat son de fora del país. IEEE802 estàndard LAN, IEEE 519 control d'harmònics.


Plànols
-------

Novament no existeix una normativa d'obligat compliment (tret que aparegui en un document del BOE) en quan als plànols. Això fa que aquests variïn d'un projectista a un altre en quan a tot el que no estigui legislat. No obstant si que és cert que existeix una serie de normes que bé per qualitat, imitació o tradició es solen seguir:

+ UNE 1032: Dibujos técnicos. Principios generales de representación. (Anulada a 25/09/2022).
+ UNE-EN ISO 5455:1996: Dibujos Técnicos. Escalas (Vigent a 25/09/2022)
+ UNE-EN ISO 5457:2000 Documentación técnica de producto. Formatos y presentación de los elementos gráficos de las hojas de dibujo. (Vigent a 25/09/2022)
+ UNE-EN 60617: Símbolos gráficos para esquemas. (anulada a 25/09/2022)
+ UNE 200002:2004 Simbolos gráficos para esquemas.

Tret que el nombre de plànols sia petit existirà un índex que farà referencia a la numeració dels plànols. Aquesta numeració apareixerà al caixetí que tindrà en conta normativa vigent i permetrà el seu plegament.

Normalment els primers plànols fan referència a la situació i a l'emplaçament.


### Escales

Les escales son un sistema de representar elements de mides molt més grans o molt més petits que l'espai disponible al paper.

Les escales és un sistema de indicar quantes vegades el que mesurem al plànol mesura en la realitat.

El factor d'escala serà adequat, en general s'utilitzarà:

+ 1:50 o 1:100 per a plantes, alçats i seccions
+ 1:20 per a detalls
+ 1:500 o 1:1000 per plànols de xarxes o enginyeria civil

La UNE5455 estableix les mesures normalitzades següents:

+ ampliació: 50:1, 20:1, 10:1, 5:1, 2:1
+ natural: 1:1
+ reducció: 1:2, 1:5, 1:10, 1:20, 1:50, 1:100, 1:200, 1:500, 1:1.000, 1:2.000, 1:5000, 1:10.000

La UNE 1032: Defineix el tipus de línia a utilitzar (línia gruixuda, fina, a mà alçada, amb zig-zag, gruixuda de traços, fina de traç i punt).

### Simbologia

S'aplica la UNE 60617 que tot i que estar anul·lada la norma que la substitueix fa referencia a la mateixa.

En ella podrem trobar com s'han de representar els diferents elements elèctrics. Tots els elements així com l'espai de dibuix està modulat de tal manera que resulti fàcilment escalable.

Per facilitar la lectura es sol agafar mòduls segons la UNE 61082. Per exeple es pot definir una graella de 16M i una separació entre terminals de 2M, M pot prendre els valors 1,8 (2,0mm), 2,5mm, 3,5mm (per DIN A3 i A4, es sòl agafar M=2,5mm), la trama dels simbols normalitzats és de M (es a dir 2,5mm).

### Tècniques i normes de codificació


La norma UNE-EN ISO 7200 estableix la manera de enumerar els plànols. Tot i que en general cada empresa sol utilitzar el sistema que creu més convenient.

Per altra banda la norma UNE EN 81346-2:2009 s'utilitza per la codificació de dispositius elèctrics. Però encara s'utilitza (molt) la antiga IEC750.

Aquestes normatives etiqueten cada element amb un codi únic. Per exemple:

<blockquote>
=0-KA3
</blockquote>

El que ve després del "=", 0 representa la funció del conjunt, per exemple la primera maquina refredadora; la K indica la classe de producte, que en aquest cas és un contactor; la A indica la funció, que és auxiliar (no surt del quadre); i el 3 vol dir que es el tercer contactor auxiliar d'aquest grup funcional.

Plec de Prescripcions Tècniques
-------------------------------

En aquest document trobarem condicionants tècnic sobre les unitat d'obra a executar, en general amb més detall que al pressupost i als plànols. També trobarem la documentació a entregar, la qualitat dels materials, els requeriments d'execució, les proves a realitzar i quan es podrà certificar una partida.

Per exemple, a un quadre elèctric pre-muntat la major part del cost es deu al propi material i a més és molt probable que la empresa quadrista ens pugui subministrar tots els quadres a instal·lar gairebé alhora. Per tant la diferencia entre poder cobrar la partida pel simple fet d'apilar el material o si s'ha de tenir instal·lat o si s'ha de tenir instal·lat i provat és molt important.

Pressupost
----------

És molt complicat conèixer amb exactitud quan ens constarà un projecte. Es farà necessari disposar prèviament d'una estimació, aquesta és la comesa del pressupost.

Un pressupost és la estimació de una feina contant també amb el marge de beneficis.

En el pressupost:
+ s'identifiquen les diferents unitats d'obra
+ es defineix el seu cost unitari a partir dels materials, mà d'obra etc. dels que es compon (quadre de descompostos)
+ Es calcula la quantitat necessària de cada unitat d'obra (amidaments).
+ Es calcula el cost total de cada unitat d'obra per capítols i subcapítols (pressupost d'execució material PEM).

És habitual que el pressupost i els amidaments es fusionin.

Finalment al resum de pressupost es sol afegir les despeses generals (GG), l'Impost del valor afegit (IVA), i el Benefici Industrial (BI).


Annexes
-------

Entra tota justificació, càlculs, documents exigits per normativa o client, estudis amb entitat pròpia. Com a exemples es poden citar els següents:

+ Càlculs de línies elèctriques: Caigudes de Tensió, saturació del cablejat, corrent de curtcircuit.
+ Càlculs hidràulics: Pèrdua de càrrega, dimensionament de bombes.
+ Estudi d'Impacte ambiental: A aquells projectes que afectin al medi ambient (per exemple línies d'alta tensió de més de 66kV i més de 15km o les que passin per la Xarxa natura 2000 i de més de 3km).
+ Estudi de Seguretat i Salut. Pot  tenir caràcter bàsic si es compleixen una serie de condicionants.
+ Altres: Dades estadístiques, cronograma, estudi de costos de manteniment, afectació al pla d'autoprotecció, seguretat operacional, gestió de residus, etc.


Certificacions d'obra
---------------------

A una obra de suficient mida és complicat finalitzar-la en un període curt de temps, a més per començar a treballar necessitarem aprovisionar-nos de material (cablejat, mecanismes, maquinaria, canalitzacions, envolupants, etc.) . Depenent del temps de pagament al nostre proveïdor, tindrem una disminució de líquid a la nostra tresoreria, ja que haurem pagat el material, però no haurem acabat l'obra. 

Les certificacions d'obra son documents que efectua la direcció d'obra i que permeten a la contracta emetre factura. Aquesta factura correspon a una part del pressupost, la que la direcció d'obra considera finalitzada.

D'aquesta manera la contracta, periòdicament podrà emetre factures parcials i depenent del temps de pagament tornara a tenir líquid a la seva tresoreria.

Normalment la direcció d'obra va realitzant mides del efectivament executat o apilat, i amb conformitat amb el PPT, si la partida es pot pagar la inclourà en la certificació aplicat si escau el coeficient de baixa amb la que la contracta va guanyar el pressupost que apareixia a projecte.

### Contracte d'obra a preu alçat

En aquest cas el preu total de l'obra es defineix prèviament i no es possible modificar-lo, independentment de si la quantitat d'unitats dels amidaments es errònia. A no ser que es modifiqui el projecte inicial. Així i tot això és sovint mal de definir, ja que definir quan es necessària la redacció d'un modificat de projecte
