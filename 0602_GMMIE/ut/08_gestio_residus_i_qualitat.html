UT08 - Gestió de residus i sistemes de gestió de qualitat
==================================================

1.- Gestió de residus
---------------------

A totes les fases de l'obra es generen residus. Des dels enderrocs fins als embalatges dels productes. El tractament, classificació i gestió d'aquests residus s'ha de realitzar correctament.

### 1.1.- Tipus de residus

Fins l'any passat la llei de referència era la 22/2011<sup>[[1]]</sup>  de residus i sols contaminats. Al 8 d'abril va entrar en vigor la llei 7/2022<sup>[[2]]</sup> de residus i sols contaminats per a una economia circular, excepte el títol VII que entrà en vigor al gener de 2023.

La llei al seu article 2 enumera les definicions dels diferents tipus de residus, cal destacar els:

- **Residus perillosos:** Aquells que tenen les característiques de l'annexe I (explosius, comburents, inflamables, irritants, tòxics, cancerígens, corrosius, infecciós, perillós per a la reproducció).
- **RCDs o residus de la construcció i demolició:** Que a Mallorca es solen dur a Mac Insular.
- **Residus industrial:** residus resultants dels processos de producció, fabricació, transformació, utilització, consum, neteja o manteniment generats per l'activitat industrial a conseqüència de la seva activitat principal.
- **Residus comercials:** residus generats per l'activitat pròpia del comerç, a l'engròs i al detall, dels serveis de restauració i bars, de les oficines i dels mercats, així com de la resta del sector serveis.
- **Residus domèstics:** residus perillosos o no perillosos generats en les llars a conseqüència de les activitats domèstiques. Es consideren també residus domèstics els similars en composició i quantitat als anteriors generats en serveis i indústries, que no es generin a conseqüència de l'activitat pròpia del servei o indústria.</br></br>S'inclouen també en aquesta categoria els residus que es generen en les llars de, entre altres, olis de cuina usats, aparells elèctrics i electrònics, tèxtil, piles, acumuladors, mobles, estris i matalassos, així com els residus i enderrocs procedents d'obres menors de construcció i reparació domiciliària.</br></br>Tindran la consideració de residus domèstics, els residus procedents de la neteja de vies públiques, zones verdes, àrees recreatives i platges, els animals domèstics morts i els vehicles abandonats.

### 1.2.- Classificació de residus

L'article 6 de la llei 7/2022  ens remet a la decisió 2014/955/UE <sup>[[3]]</sup> de la comissió europea assigna un codi LER (Llista Europea de Residus) a cada tipus de residu, les dues primeres xifres corresponen a un capítol de la llista:
![Llista LER](img/LER.png)

Si ens fixem amb el capítol 17, RCDs:
![Llista LER RCD (capitol 17)](img/LER-RCDs.png)

Les files amb un asterisc representen residus perillosos.

### 1.3.- Residus d'aparells electrònics

El Reial Decret 208/2005 <sup>[[4]]</sup> transposava la directiva directiva 2002/96/CE <sup>[[5]]</sup>, ambdues ja derogades. El nou Reial Decret 110/2015 [[6]], que transposa la Directiva 2012/19/UE [[7]] i està en vigor des de l'agost de 2018, ja incorpora els mòduls fotovoltaics. Aquest reial decret en el seu preambul explica:

<blockquote>
Posteriorment, la Llei 22/2011, de 28 de juliol, de residus i sòls contaminats, [...]. Entre les novetats s’inclouen les condicions en què han d’operar els gestors de residus, el règim de comunicació i autorització dels gestors i dels sistemes de responsabilitat ampliada del
productor, així com el Registre de producció i gestió de residus únic en l’àmbit estatal.
Aquesta Llei <b>preveu l’existència de reials decrets per als fluxos específics de residus que han de contenir les especificitats pròpies del règim de cada tipus de residus</b>.
</blockquote>

I té per objecte:
<blockquote>
regular la prevenció i la reducció dels impactes
adversos causats per la generació i la gestió dels residus dels aparells elèctrics i electrònics (RAEE a partir d'ara) [...], i establir els procediments per fer-ne una gestió, una traçabilitat i una comptabilització correctes.
També té per objecte, [...], millorar l’eficiència en l’ús dels recursos i reduir els impactes globals d’aquest ús, donant prioritat a la prevenció en la generació de residus dels aparells elèctrics i electrònics i a la preparació per a la seva reutilització,[...]
</blockquote>

Els RAEE classificats pel RD 110/2015 tenen 7 categories:

### 1.4.- Sistemes integrats de gestió de residus d'aparell elèctrics i electrònics.

La llei 22/2011, i la nova llei 7/2022 estableixen el concepte de responsabilitat ampliada del productor que impliquen al productor en la gestió de residus que es farà posteriorment.

Una de les mesures aplicades pels productors és la de crear Sistemes Integrat de Gestió (SIG) o també Sistemes Col·lectius de Responsabilitat Ampliada del Productor (SCRAP). Son entitats sense anim de lucre i les empreses les sostenen mitjançant els seus recursos.

A Balears, de fet  s'ha signat el segon conveni (després de Catalunya) en signar un conveni [[8]]. Aquestes entitats gestionen diferents tipus de RAEE. Per exemple Ambilamp [[9]] està especialitzada en làmpades, i Tragamovil [[10]] en dispositius mòbils, tot i que també es poden trobar gestor més generalistes com Ecoraees [[11]].

### 1.5.-  Directiva RoHS

La directiva 2002/95/CE [[12]] o RoHS, pel seu acrònim en anglès: _Restriction of Hazardous Substances_ va, com el seu propi nom indica restringir l'ús de 6 substancies perilloses per a la fabricació d'equips elèctrics i electrònics.

Aquesta directiva, ja es va integrar en l'ordenament espanyol a través del ja anomenat RD 208/2005 [[4]], però ambdúes estàn ja derogades i s'han substituït per la directiva 2011/65/UE [[13]] i el RD 110/2015 [[6]], respectivament.

La RoHS restringeix l'ús del:

- plom
- mercuri
- cadmi
- crom VI (crom hexavalent)
- PBB (polibromobifenils)
- PBDE (polibromodifenil éters)

Els dos darrers eren retardants de la flama però bioacumulatius i relacionats amb alguns càncers.

2.- El pla de gestió de residus
-------------------------------

Segons el Reial Decret 105/2008, s'aplica segons l'article 3 i 2 a qualsevol residu que es generi a una obra de construcció, rehabilitació, reparació, reforma o demolició d'un bé immoble, tal com un edifici, carretera, port, aeroport, ferrocarril, canal, presa, instal·lació esportiva o d'oci, així com qualsevol altre anàleg d'enginyeria civil.

El productor de residus (promotor), haurà d'incloure al projecte d'obres un estudi de gestió de RCD i que el tenidor de residus (contracta o instal·lador) haurà de presentar un pla de gestió del RCDs

### 2.1.- Estructura del pla de gestió de RCDs

- Introducció
- Descripció de l'obra (distingint les fases) 
- Identificació i estimació de les quantitats que es generaran de cada residu, classificades en:
	+ Terres i materials petris no contaminats
	+ RCD de diferent natura:
		* Pètria (Formigó, àrids, maons, morter)
		* No pètria
	+ Residus perillosos (identificats amb el seu LER)
	+ Altres residus amb reglamentació específica (amiant, biosanitaris)
- Mesures de prevenció: tant en la reducció dels residus com en la classificació, emmagatzemament i gestió.
- Operacions de valorització o eliminació: S'ha d'especificar com reutilitzar alguns residus o com es gestionen. Les fraccions s'hauran de separar si superen certes quantitats (80t de formigó, 40t de ceràmics, 2t de metalls, 1t de fusta o vidre i 0,5 tones de paper i cartró).
- Gestió de residus perillosos: No s'han de mesclar i s'han d'etiquetar correctament. Es portarà un registre, i es comptarà amb una empresa gestora autoritzada.
- Accions de formació i comunicació al personal i empreses que intervenen en l'obra.
- Prescripcions tècniques per:
	+ Reduir els volums de producció
	+ Establir les condicions de manipulació i emmagatzemament.
- Plànol de situació i de punt net
- Mesures adoptades per a la supervisió i seguiment de la gestió a l'obra

3.- Model EFQM d'excel·lència
-----------------------------

És entitat sense ànim de lucre europea creada al 1988, i la responsable del model que du el seu nom. Està orientat a la manera de treballar que busca l'excel·lència. Es flexible i es pot aplicar a empreses i organitzacions de qualsevol mida i àmbit.

- Orientació als resultats
- Orientació als clients
- Lideratge i coherència
- Gestió per processos i fets
- Desenvolupament i implicació
- Procés continu d'aprenentatge, innovació i millora
- Desenvolupament d'aliances
- Responsabilitat social de l'organització

La fundació manté tres nivells d'excel·lència, per a reconèixer l'esforç de les organitzacions:

- Premi Europeu a la Qualitat
- Reconeixement a l'excel·lencia
- Compromís amb l'excel·lencia

4.- Model ISO 9001
------------------

Son normes per a la gestió de qualitat. Está separat en 10 capítols (abast, normativa, definicions, context de l'organització, lideratge, planificació, suport, operació, avaluació del rendiment, millora).

I es basa en els principis:
- Organització centrada al client
- Lideratge
- Compromís de les persones
- Enfocament als processos
- Enfocament a la gestió
- Millora continua
- Presa de decisions basades en fets
- Relacions mútuament beneficioses amb els proveïdors

5.- Model ISO 14001
-------------------

Constitueix un sistema de gestió ambiental, cerca l'equilibri entre el manteniment i la reducció de despeses de producció i respecte al medi ambient.

Es basa en els següents punts:

- Sistema de gestió ambiental
- Auditories ambientals
- Avaluació de l'acompliment ambiental
- Anàlisis del cicle de vida

La seva implantació ofereix avantatges com:

- Reducció en la despesa d'energia, aigua i matèries primeres
- Estalvi en el tractament de residus.
- Millora en la imatge davant clients sensibilitzats
- Reducció de despeses de assegurances ambientals
