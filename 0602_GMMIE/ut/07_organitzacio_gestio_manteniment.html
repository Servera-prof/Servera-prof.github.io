UT7 - Organització i gestió del manteniment 
===========================================

1. Tipus de manteniment
2. Manteniment dels elements de les instal·lacions elèctriques
3. Pla de manteniment
4. Indicadors de manteniment
5. Normativa vigent
6. Eines informàtiques

1.- Tipus de manteniment
------------------------

El manteniment és tot allò que feim per a que la instal·lació conservi la funcionalitat i l'estat per a la que va ser dissenyada. No es una despesa si no una inversió, donat que evita pèrdues majors que si no es realitzés.

### 1.1.- Manteniment correctiu

Es realitza només quan es detecta una averia, quelcom que ha deixat de funcionar com ho hauria de fer. La seva finalitat es restaurar el servei de la instal·lació o part de la instal·lació.

Pot ser:

- **instantani:** Es realitza la reparació, al moment que es detecta l'averia.
- **diferit:** Degut a la manca de peces o a la imposibilitat d'aturada no es possible reparar l'averia que es programa per una data concreta, quedant la instal·lació sense servei si es necessari.

### 1.2.- Manteniment preventiu

Es realitza de manera sistemàtica i periòdica, tot i el fet de no existir averia. D'aquesta manera es redueix la probabilitat de que es produeixin. Aquest manteniment es realitza en condicions normals de funcionament i té les següents avantatges:

- Major fiabilitat i operació en major condicions de seguretat.
- Major vida útil de les instal·lacions
- Reducció dels temps d'aturada o caiguda del servei
- Facilita la gestió dels recursos humans, ja que tenen una càrrega de feina programada.
- Disminució del cost mitjà per reparació
- Facilita la gestió de recanvis en el magatzem.

### 1.3.- Manteniment predictiu

El manteniment predictiu tracta de detectar les averies abans de que es produeixin, analitzant periòdicament els possibles punts susceptibles d'error periòdicament. D'aquesta manera hi ha una anticipació a l'avaria, es reparteixen recursos i s'evita la caiguda del servei.

### 1.4.- Manteniment proactiu

És una visió del manteniment en la que tot el personal està implicat en les tasques de manteniment. Es posa èmfasis en la notificació de les incidències, i millora els resultats del manteniment predictiu.

### 1.5.- Manteniment d'oportunitat

És un manteniment preventiu que aprofita els temps d'aturada bé per altres avaries bé per aturades normals de la producció.

2.- Manteniment del elements de les instal·lacions elèctriques
--------------------------------------------------------------

### 2.1.- CGPs

Cada dos anys s'hauran de revisar l'estat de l'interruptor de tall (si el té), i dels fusibles de protecció. També es revisarà l'estat de l'envolupant: desintegració plàstica, oxidació, cops, buits, falta d'estanquitat, o mala subjecció així com la posada a terra si aquesta es metàl·lica. Cada 5 anys es revisara que la protecció de sobrecàrregues i curtcircuit es adient a la secció de la LGA.

### 2.2.- LGA

Es comprovarà cada 5 anys que la línia roman sense empalmes, que les connexions segueixen en bon estat, i que el seu aïllament es superior al límit reglamentari.

### 2.3.- Centralització de comptadors

La centralització de comptadors serà revisada cada 2 anys i es verificarà: la ventilació, il·luminació, dimensionament i accessibilitat. Cada 5 anys es comprovarpa l'estat de l'interruptor de tall en càrrega (connexió, estabilitat, posició).


### 2.4.- Derivacions individuals

Cada 5 anys es revisarà l'estat de les connexions i la mesura de l'aïllament dels conductors.

### 2.5.- Instal·lació interior

#### Mensualment

- Comprovació del funcionament del interruptors diferencials mitjançant el botó test.

#### Trimestralment

- Inspecció visual dels mecanismes
- Inspecció visual dels endolls
- Neteja superficial del endolls

#### Anualment

- Comprovació dels interruptor del quadre de comandament (estabilitat on-off, connexions, posició).
- Revisió de les instal·lacions de garatges

#### Cada dos anys

- Revisió de les possibles corrosions i envelliments del material. Posades a terra de elements elèctric (envolupants metàl·liques, safates metàl·liques), verificació de l'estat de conservació de les cobertes aïllants (endolls, interruptors, capses de derivació).

#### Cada 5 anys 

- Revisió de les proteccions (calibre correcte per a la secció que protegeixen) i prova de les diferents proteccions contra contactes indirectes.
- Revisió de l'aïllament entre conductors

#### Cada 10 anys

- Revisió general, inclou la revisió del cablejat i de la instal·lació que normalment roman oculta.

### 2.6.- Posada a terra

A l'època més seca de l'any es revisarà la instal·lació de terra dels següents elements: parallamps, antenes col·lectives, endolls i masses metàl·liques de banys, elements metàl·lics importants, estructures de ferro, armadures i suports de formigó (això darrer és molt complicat si no impossible de fer).

Cada dos anys es revisarà l'estat de les connexions amb especial atenció a la corrosió.

### 2.7.- Il·luminació interior

- Neteja de les lluminàries
- Reposició de làmpades

### 2.8.- Il·luminació exterior

- Posada a terra de suports metàl·lics
- Neteja de capses de fusibles.
- Estat de les connexions
- Estat de les arquetes

### 2.9- Iluminació d'emergència

Cada 3 mesos es revisarà el seu funcionament
Cada 3 anys la seva duració

### 2.10.- ICT

- Canalitzacions: Anualment es farà una neteja d'arquetes i registres, revisió de degradacions o corrosions, estat de fixació, o obturacions.
- Sistema de captació: Reorientació, fixació dels captadors, corrosió, afluixament riostes, emprimació antioxidants, impermeabilització, LNB i amplificadors
- Capçalera: Revisió amplificadors programables o monocanal, nivells de potència.
- Xares de distribució: Recepció de les emisores regulades, potència adequada, corrosions.

### 2.11.- Porters i videoporters
- Neteja placa exterior
- Funcionament de la instal·lació
- Fixació de tubs i elements
- Cada 5 anys substitució de làmpades de la placa exterior i nitidesa de la imatge

### 2.12.- Instal·lacions de megafonia i fil musical

Es procedirà de manera similar a les instal·lacions de telecomunicacions

### 2.13.- Bateries de condensadors per a la correcció del factor de potència

Mensualment:
- Inspecció visual dels condensadors
- Bon estat de les proteccions
- Control de la temperatura
- Tensió de servei
- Bornes i connexions

Cada any:
- Revisió dels contactes dels contactors
- Intensitat nominal dels condensadors
- Colli fort de les connexions
- Neteja de les bornes i aïlladors

### 2.14.- Instal·lacions fotovoltaiques

- Comprovació de les proteccions elèctriques
- Comprovació de l'estat dels mòduls i del estat de les connexions
- Comprovació de l'estat de l'inversor
- Comprovació del cablejat i terminals

3.- El pla de manteniment
-------------------------

Per a elaborar un pla de manteniment es tindrà en compte totes aquestes informacions:

- Recomanacions dels fabricants
- Experiència dels tècnics
- Índex de fallada
- Mínims legals: Com per exemple la mesura d'aïllament o de terra

Abarca com a mínim les accions del:

- Manteniment correctiu
- Manteniment preventiu
- Manteniment predictiu

Inclourà les plantilles dels següents documents:

- Fulla de feina diària: En ella cada tècnic reflectirà les tasques realitzades cada dia.
- Fulla de manteniment: Conté tots els paràmetres a verificar. Es complimentarà i signarà pel tècnic responsable.
- Fulla de notificacions d'incidències: Qualsevol persona pot complimentar aquesta fulla, s'entregarà al coordinador de manteniment.

4.- Indicadors de manteniment
-----------------------------

### 4.1.- MTBF: Temps mitja entre fallades

Es el temps que passa entre dues fallades, en dies. Es calcula com a:

<div class="eq">

<img src="https://latex.codecogs.com/svg.latex?\text{MTBF}=\frac{n_{elem}\cdot t_{oper}}{n_{fall}}">

<p>A on:</p>
<ul>
<li>n<sub>elem</sub>: És el número d'elements a evaluar.</li>
<li>t<sub>oper</sub>: És el temps d'operació en dies.</li>
<li>n<sub>fall</sub>: És el número de fallades detectades.</li>
</ul>

</div>

### 4.2.- MTTR: Temps mitjà de reparació
 
És el temps mitjà que es triga per a cada avaria, en hores.

<div class="eq">

<img src="https://latex.codecogs.com/svg.latex?\text{MTTR}=\frac{\sum{t_{mc}}}{n_{fall}}">

<p>A on:</p>
<ul>
<li>t<sub>mc</sub>: És el temps de manteniment correctiu (en hores)</li>
<li>n<sub>fall</sub>: És el número de fallades detectades.</li>
</ul>

</div>

### 4.3.- Disponibilitat

Indica el percentatge de temps que ha estat la instal·lació funcionat sense fallades respecte al total.

<div class="eq">

<img src="https://latex.codecogs.com/svg.latex?\text{Disp}=\frac{t_{tot}- t_{atur}}{t_{tot}}">

<p>A on:</p>

<ul>
<li>t<sub>tot</sub>: És el temps total transcorregut.</li>
<li>t<sub>oper</sub>: És el temps d'aturada</li>
</ul>

</div>

### 4.4.- MTTF: Temps mitja per a fallar

És com el MTBF, però element a element.

### 4.5.- FIT: Errors per temps

Calcula el número de fallades per cada mil hores de funcionament. Es la inversa de la disponibilitat.

### 4.6.- Confiança

<div class="eq"><img src="https://latex.codecogs.com/svg.latex?\text{Conf}=\frac{  \text{MTBF}}{\text{MTBF}+\text{MTTR}}"></div>
