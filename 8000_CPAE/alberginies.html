Albergínies mallorquines  
===========================  

Ingredients (per a 4 persones)
------------------------------

- 4 albergínies petites  
- 2 ous  
- 300 g de carn picada  
- Pebre negre mòlt  
- Sal  
- Orenga  
- Julivert  
- 80 g de llet  
- 2 grans d'all  
- 150 g de ceba  
- 80 g d'oli d'oliva (50 g + 30 g)  
- 200 g de tomàquet triturat  
- Pa ratllat  

Elaboració  
-----------  

1. Tallar les albergínies de dalt a baix (rentades i sense pelar), 
   llevant només el peu verd. 
   Amb la punta del ganivet, fer-hi uns talls no gaire profunds en 
   forma de graella a la polpa. 
   Coure-les al vapor (o bullir-les en una olla amb aigua) durant uns 
   25 minuts fins que estiguin ben flonjes.  

2. Mentrestant, picar la ceba i sofregir-la en una paella amb 50 g d'oli 
  d'oliva a foc mitjà fins que quedi ben transparent.  

3. Batre els dos ous en un bol gran i afegir-hi els 300 g de carn 
   picada, la sal, el pebre, l'orenga, el julivert, els 2 grans d'all 
   ben picats i els 80 g de llet.  

4. Un cop cuites les albergínies, deixar-les eixugar sobre paper 
   absorbent.  

5. Preescalfar el forn a 200 ºC.  

6. Amb l'ajuda d'una cullera, buidar la polpa de les albergínies 
  sense fer malbé la pell. Buidar-les bé, picar una mica la polpa i 
  barrejar-la amb la carn i la ceba sofregida dins del bol.  

7. Farcir les pells de les albergínies amb la mescla i disposar-les 
   en una safata de forn unglada amb un rajolí d'oli.  

8. Enfornar **20 minuts / 200 ºC / calor a dalt i a baix amb 
   ventilador**.  

9. Mentrestant, preparar la salsa de tomàquet: en una paella amb els 
   30 g d'oli restants, sofregir el tomàquet triturat a foc lent 
   durant 15 minuts.  

10. Treure les albergínies del forn. Cobrir-les amb la salsa de 
    tomàquet i escampar-hi el pa ratllat pel damunt.  

11. Gratinar al forn fins que el pa ratllat estigui ben daurat.
