<!DOCTYPE html>
<html>
<head>
<style>
/* Taula externa */
#table_resp {
    font-family: "Liberation Sans", "Arial", sans-serif;
    font-size: 14px;
    border: none;
    border-collapse: collapse;
    width: 100%;
}

/* Només cel·les de primer nivell de la taula externa */
#table_resp > tbody > tr > td {
    border: none;
    padding: 15px;
    vertical-align: top;
}

/* Taula interna */
table.resp_int {
    border: 1px solid #ccc;
    border-collapse: collapse;
    width: 100%;
}

/* Cel·les de la taula interna */
table.resp_int td {
    border: 1px solid #ccc;
    padding: 8px;
}

/* Capçaleres de la taula interna */
table.resp_int th {
    border: 1px solid #ccc;
    padding: 8px;
    background-color: #f5f5f5;
    font-weight: bold;
}
</style>
</head>
<body>

<!-- Taula externa (sense borders) -->
<table id="table_resp">
  <tbody>
    <tr>
      <td>
        <!-- Taula interna (AMB borders) -->
        <table class="resp_int">
          <thead>
            <tr>
              <th>Nom</th>
              <th>Edat</th>
              <th>Ciutat</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Joan</td>
              <td>25</td>
              <td>Barcelona</td>
            </tr>
            <tr>
              <td>Maria</td>
              <td>30</td>
              <td>Madrid</td>
            </tr>
            <tr>
              <td>Pere</td>
              <td>28</td>
              <td>València</td>
            </tr>
          </tbody>
        </table>
      </td>
            <td>
        <!-- Taula interna (AMB borders) -->
        <table class="resp_int">
          <thead>
            <tr>
              <th>Nom</th>
              <th>Edat</th>
              <th>Ciutat</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Joan</td>
              <td>25</td>
              <td>Barcelona</td>
            </tr>
            <tr>
              <td>Maria</td>
              <td>30</td>
              <td>Madrid</td>
            </tr>
            <tr>
              <td>Pere</td>
              <td>28</td>
              <td>València</td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>

</body>
</html>
